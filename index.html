<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>AI Content Factory</title>

  <!-- 다크/라이트 테마 전환용 CSS (기본 vue.css 제거 후 통합 테마 사용) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />

  <!-- 수학 수식(LaTeX)을 위한 필수 엔진 -->
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- 커스텀 스타일 (코드 폰트 크기 확대) -->
  <style>
    .markdown-section pre>code {
      font-size: 1.05rem !important; /* 기본보다 크게 설정 */
      line-height: 1.5 !important;
    }
    .markdown-section p>code, .markdown-section li>code {
      font-size: 0.95rem !important; /* 인라인 코드도 살짝 확대 */
    }
  </style>
</head>

<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: 'AI Content Factory',
      repo: 'https://github.com/soboo0123-cmd/ai_content_factory',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'docsify.md',
      relativePath: false,

      // 다크 모드 상세 설정
      darklightTheme: {
        siteFont: "PT Sans",
        defaultTheme: 'dark',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '17px',
        dark: {
          accent: '#42b983',
          toogleBackground: '#ffffff',
          background: '#1e1e1e',
          textColor: '#e0e0e0',
          codeTextColor: '#ffffff',
          codeBackgroundColor: '#2d2d2d',
          borderColor: '#333333',
          blockQuoteColor: '#858585',
          highlightColor: '#d22778',
          sidebarSubColor: '#b4b4b4',
          codeTypeColor: '#ffffff',
          coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        },
        light: {
          accent: '#42b983',
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#34495e',
          codeTextColor: '#525252',
          codeBackgroundColor: '#f8f8f8',
          borderColor: 'rgba(0,0,0,.07)',
          blockQuoteColor: '#858585',
          highlightColor: '#d22778',
          sidebarSubColor: '#b4b4b4',
          codeTypeColor: '#091a28',
          coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        }
      },

      // 수식 설정
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$']]
      },

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '검색어를 입력하세요',
        noData: '결과가 없습니다',
        depth: 6
      },

      // 페이지네이션 설정
      pagination: {
        previousText: '이전 장',
        nextText: '다음 장',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>

  <!-- Docsify 핵심 엔진 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

  <!-- 테마 전환 플러그인 (가장 중요) -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>

  <!-- 검색 및 수식 플러그인 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>

  <!-- 추가 플러그인: 코드 복사 및 페이지네이션 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- 문법 강조 (Syntax Highlighting) 지원 언어 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>

</html>
