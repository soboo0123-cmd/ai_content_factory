<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>AI Content Factory</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: 'AI Content Factory',
      repo: 'https://github.com/soboo0123-cmd/ai_content_factory',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'contents/py_decision_01/sec_01/sub_01_01_v1.md',
      relativePath: false,
      
      // MathJax 설정 추가
      mathjax: {
        chtml: {
          scale: 1
        }
      },
      
      // 사이드바 404 방지 설정
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '검색어를 입력하세요',
        noData: '결과가 없습니다',
        depth: 6
      }
    };
  </script>
  
  <!-- Docsify 엔진 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  
  <!-- 검색 플러그인 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- MathJax 공식 지원 스크립트 (LaTeX 수식 렌더링용) -->
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mathjax/dist/docsify-mathjax.min.js"></script>
</body>
</html>
