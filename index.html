<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>AI Content Factory</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: 'AI Content Factory',
      repo: 'https://github.com/soboo0123-cmd/ai_content_factory',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'contents/py_decision_01/sec_01/sub_01_01_v1.md',
      // 경로 안정성을 위한 설정 추가
      relativePath: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '검색어를 입력하세요',
        noData: '결과가 없습니다',
        depth: 6
      }
    };
  </script>
  
  <!-- Docsify 엔진 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  
  <!-- 검색 플러그인 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- MathJax 플러그인 (안정적인 버전 2.x 주소로 수정) -->
  <script src="//cdn.jsdelivr.net/npm/docsify-mathjax@2/dist/docsify-mathjax.min.js"></script>
</body>
</html>
