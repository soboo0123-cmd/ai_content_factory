<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>AI Content Factory</title>

  <!-- 다크/라이트 테마 전환용 CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
  <!-- 사이드바 접기 플러그인 CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <!-- CodeMirror CSS (용량이 작아 미리 로드) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/darcula.min.css" />

  <!-- 수학 수식(LaTeX)을 위한 필수 엔진 -->
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- 커스텀 스타일 -->
  <style>
    .markdown-section pre>code {
      font-size: 1.05rem !important;
      line-height: 1.5 !important;
    }
    .markdown-section p>code, .markdown-section li>code {
      font-size: 0.95rem !important;
    }
    
    /* CodeMirror 에디터 폰트 설정 */
    .CodeMirror {
      font-family: Consolas, "JetBrains Mono", "Roboto Mono", Monaco, monospace;
      font-size: 1rem;
      height: 100%; /* 에디터가 남은 공간을 꽉 채우도록 변경 */
    }

    /* 출력창 내부 이미지 반응형 처리 */
    #outputPanel img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: 'AI Content Factory',
      repo: 'https://github.com/soboo0123-cmd/ai_content_factory',
      loadSidebar: true,
      sidebarDisplayLevel: 1,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'docsify.md',
      relativePath: false,

      // 다크 모드 상세 설정
      darklightTheme: {
        siteFont: "PT Sans",
        defaultTheme: 'dark',
        codeFontFamily: 'Consolas, "D2Coding", "NanumGothicCoding", "JetBrains Mono", "Roboto Mono", Monaco, monospace',
        bodyFontSize: '17px',
        dark: {
          accent: '#42b983', toogleBackground: '#ffffff', background: '#1e1e1e', textColor: '#e0e0e0',
          codeTextColor: '#ffffff', codeBackgroundColor: '#2d2d2d', borderColor: '#333333',
          blockQuoteColor: '#858585', highlightColor: '#d22778', sidebarSubColor: '#b4b4b4',
          codeTypeColor: '#ffffff', coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        },
        light: {
          accent: '#42b983', toogleBackground: '#091a28', background: '#ffffff', textColor: '#34495e',
          codeTextColor: '#525252', codeBackgroundColor: '#f8f8f8', borderColor: 'rgba(0,0,0,.07)',
          blockQuoteColor: '#858585', highlightColor: '#d22778', sidebarSubColor: '#b4b4b4',
          codeTypeColor: '#091a28', coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        }
      },

      latex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
      search: { maxAge: 86400000, paths: 'auto', placeholder: '검색어를 입력하세요', noData: '결과가 없습니다', depth: 6 },
      pagination: { previousText: '이전 장', nextText: '다음 장', crossChapter: true, crossChapterText: true }
    };
  </script>

  <!-- Docsify 플러그인들 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

  <!-- ========================================================================= -->
  <!-- 파이썬 플레이그라운드 추가 영역 (코드 실행 및 복사 연동) -->
  <!-- ========================================================================= -->

  <!-- CodeMirror 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

  <!-- 로딩 오버레이 -->
  <div id="loadingOverlay" style="position: fixed; inset: 0; z-index: 105; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(3px);">
    <div style="background: #1e1e1e; padding: 30px; border-radius: 12px; text-align: center; color: white; border: 1px solid #333; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h3 style="margin-top:0; color: #42b983;">Python 엔진 다운로드 중...</h3>
      <p style="color: #bbb; margin-bottom: 0;">최초 1회만 약 10MB의 엔진 데이터를 다운로드합니다.<br>데이터 절약을 위해 이 작업은 지금 수행됩니다.</p>
    </div>
  </div>

  <!-- 플레이그라운드 UI -->
  <section id="playgroundWrapper" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; transform: translateY(100%); transition: transform 0.3s ease-in-out; background: #1e1e1e; border-top: 1px solid #333; padding: 16px; padding-bottom: 24px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); height: 90vh; display: flex; flex-direction: column;">
    <div style="max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: white;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <strong style="font-size: 1.1rem;">Python Playground</strong>
          <span id="engineStatus" style="font-size: 0.8rem; background: #444; padding: 2px 6px; border-radius: 4px; color: #bbb;">대기중</span>
        </div>
        <button id="closePlaygroundBtn" style="background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-weight: bold; transition: background 0.2s;">닫기 ▼</button>
      </div>
      
      <!-- 에디터 영역 -->
      <div style="border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #2b2b2b; flex: 1; display: flex; flex-direction: column;">
        <textarea id="editor">print("여기에 파이썬 코드를 작성하거나 본문에서 복사해오세요.")</textarea>
      </div>
      
      <div style="margin-top: 12px; display: flex; gap: 10px; flex-shrink: 0;">
        <button id="runBtn" style="background: #42b983; color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 1rem; transition: opacity 0.2s;">▶ 코드 실행 (엔진 로드 필요)</button>
        <button id="clearBtn" style="background: #444; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">지우기</button>
      </div>
      
      <!-- 출력창 영역: 텍스트와 HTML 요소(이미지)를 모두 담기 위해 div 활용 -->
      <div id="outputPanel" style="margin-top: 12px; background: #0b0f19; color: #dbeafe; padding: 12px; border-radius: 8px; border: 1px solid #222; height: 35%; min-height: 120px; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.95rem; white-space: pre-wrap; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start;">실행 결과가 이곳에 출력됩니다.</div>
    </div>
  </section>

  <script>
    let editor, pyodide;
    let isPyodideLoading = false;
    let isPyodideReady = false;

    // 1. 에디터 초기화
    window.addEventListener('DOMContentLoaded', () => {
      editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
        mode: 'python',
        lineNumbers: true,
        theme: 'darcula',
        indentUnit: 4
      });
    });

    // 2. 창 여닫기
    const wrapper = document.getElementById('playgroundWrapper');
    function showPlayground() {
      wrapper.style.transform = 'translateY(0)';
      setTimeout(() => editor.refresh(), 300);
    }
    function hidePlayground() {
      wrapper.style.transform = 'translateY(100%)';
    }
    document.getElementById('closePlaygroundBtn').addEventListener('click', hidePlayground);

    // 3. 복사 버튼 가로채기
    document.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('.docsify-copy-code-button');
      if (copyBtn) {
        const preTag = copyBtn.closest('pre');
        if (preTag) {
          const codeBlock = preTag.querySelector('code');
          if (codeBlock) {
            const codeText = codeBlock.innerText || codeBlock.textContent;
            editor.setValue(codeText);
            
            const out = document.getElementById('outputPanel');
            out.innerHTML = '<span style="color:#bbb;">코드가 붙여넣기 되었습니다. 실행 버튼을 눌러보세요.</span>';
            
            showPlayground();
          }
        }
      }
    });

    // [핵심 1] 출력창에 텍스트를 노드 형태로 안전하게 추가하는 함수
    // 기존의 textContent += 방식은 기존에 그려진 <img> 태그를 삭제해버리므로 이를 방지
    function appendTextOutput(message, color = '#dbeafe') {
      const out = document.getElementById('outputPanel');
      const span = document.createElement('span');
      span.textContent = message + '\n';
      span.style.color = color;
      out.appendChild(span);
      out.scrollTop = out.scrollHeight; // 자동 스크롤
    }

    // 4. 엔진 로드 및 코드 실행
    document.getElementById('runBtn').addEventListener('click', async function() {
      const out = document.getElementById('outputPanel');
      const status = document.getElementById('engineStatus');

      // 4-1. 엔진 부팅
      if (!isPyodideReady) {
        if (isPyodideLoading) return; 
        isPyodideLoading = true;
        document.getElementById('loadingOverlay').style.display = 'flex';
        this.textContent = '엔진 구성 중...';
        status.textContent = '다운로드 중...';
        status.style.color = '#fbbf24';
        
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/pyodide/v0.22.1/full/pyodide.js'; // 안정적인 버전
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });

          pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.22.1/full/' });
          isPyodideReady = true;
          this.textContent = '▶ 코드 실행';
          status.textContent = '엔진 준비됨';
          status.style.color = '#42b983';
        } catch (err) {
          out.innerHTML = '';
          appendTextOutput("파이썬 엔진 로드 실패:\n" + err.message, '#f87171');
          document.getElementById('loadingOverlay').style.display = 'none';
          isPyodideLoading = false;
          this.textContent = '재시도';
          status.textContent = '로드 실패';
          status.style.color = '#f87171';
          return;
        }
        document.getElementById('loadingOverlay').style.display = 'none';
      }

      // 4-2. 코드 실행 로직
      this.disabled = true;
      this.style.opacity = '0.5';
      out.innerHTML = ''; // 실행 전 출력창 초기화
      
      try {
        // print() 출력을 appendTextOutput 함수로 연결
        pyodide.setStdout({ batched: (m) => appendTextOutput(m) });
        pyodide.setStderr({ batched: (m) => appendTextOutput(m, '#f87171') });
        
        const pythonCode = editor.getValue();

        // 패키지 자동 다운로드 확인
        appendTextOutput("필요한 라이브러리를 확인하고 다운로드하는 중입니다...\n(최초 1회만 시간이 소요됩니다)\n", '#fbbf24');
        await pyodide.loadPackagesFromImports(pythonCode);
        
        // 다운로드 안내문 지우기 (초기화)
        out.innerHTML = '';

        // [핵심 2] Matplotlib 처리: 그래프를 브라우저 DOM이 아닌 이미지(Base64)로 렌더링하도록 강제 설정
        // 사용자의 코드에 matplotlib이 포함되어 있다면 아래 설정 코드를 백그라운드에서 먼저 실행
        if (pythonCode.includes('matplotlib') || pythonCode.includes('plt.')) {
          const matplotlibSetupCode = `
import sys
if 'matplotlib.pyplot' not in sys.modules:
    import matplotlib
    matplotlib.use('Agg') # GUI 창을 띄우지 않는 백엔드 사용
    import matplotlib.pyplot as plt
    import io, base64
    from js import document

    # plt.show()를 가로채는 커스텀 함수
    def custom_show(*args, **kwargs):
        buf = io.BytesIO()
        # 다크테마 출력창에서도 잘 보이도록 배경색을 흰색으로 강제 지정
        plt.savefig(buf, format='png', bbox_inches='tight', facecolor='white')
        buf.seek(0)
        img_data = base64.b64encode(buf.read()).decode('utf-8')
        
        # 자바스크립트를 호출하여 출력창에 <img> 태그 생성 및 삽입
        out_panel = document.getElementById('outputPanel')
        img = document.createElement('img')
        img.src = "data:image/png;base64," + img_data
        out_panel.appendChild(img)
        
        # 스크롤 맨 아래로
        out_panel.scrollTop = out_panel.scrollHeight
        
        plt.clf() # 다음 그래프를 위해 캔버스 초기화

    # 기존 plt.show를 우리가 만든 커스텀 함수로 덮어쓰기
    plt.show = custom_show
          `;
          await pyodide.runPythonAsync(matplotlibSetupCode);
        }

        // 사용자가 작성한 실제 코드 실행
        await pyodide.runPythonAsync(pythonCode);

      } catch (err) {
        appendTextOutput("\n" + err.message, '#f87171');
      }
      
      this.disabled = false;
      this.style.opacity = '1';
    });

    // 5. 출력창 비우기 기능 수정 (innerHTML 활용)
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('outputPanel').innerHTML = '<span style="color:#bbb;">결과가 지워졌습니다.</span>';
    });
  </script>
</body>

</html>
