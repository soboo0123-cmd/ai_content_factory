<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="indigoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="#f8fafc" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700">
    자본비용법(CoC) 기반 위험조정(RA) 부채 형성 및 할인 메커니즘
  </text>

  <!-- Step 1: 비금융 변동성 -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="105" y="28" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="600">1. 비금융 리스크 측정</text>
    <text x="105" y="55" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">현금흐름 변동성 (σ)</text>
    <text x="105" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">신뢰수준 계수 (z_α = 2.576)</text>
    <rect x="25" y="88" width="160" height="1" fill="#3b82f6" opacity="0.5"/>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 250 135 L 280 135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: 요구자본 산출 -->
  <g transform="translate(290, 80)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="url(#indigoCard)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="105" y="28" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="13" font-weight="600">2. 요구자본 동결 (Lock-up)</text>
    <text x="105" y="55" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Capital_t = z_α · σ_t</text>
    <text x="105" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">기간별 미소멸 리스크 자본</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 135 L 530 135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: CoC 현금흐름 발생 -->
  <g transform="translate(540, 80)" filter="url(#shadow)">
    <rect width="270" height="110" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="135" y="28" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="600">3. 주주 기회비용 정량화</text>
    <text x="135" y="55" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">CoC_t = Capital_{t-1} · r_CoC</text>
    <text x="135" y="78" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12">자본비용률 r_CoC = R_e - r_f (6.0%)</text>
  </g>

  <!-- Arrow Down to Step 4 -->
  <path d="M 675 190 L 675 230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: 현재가치 할인 및 IFRS 17 RA 수렴 -->
  <g transform="translate(160, 235)" filter="url(#shadow)">
    <rect width="590" height="95" rx="12" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="2"/>
    <text x="295" y="30" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="600">4. 무위험 할인율(r_f) 적용 및 IFRS 17 위험조정(RA) 최종 수렴</text>
    <text x="295" y="60" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">
      RA_0 = Σ [ (Capital_{t-1} · r_CoC) / (1 + r_f)^t ]
    </text>
    <text x="295" y="80" text-anchor="middle" fill="#d1fae5" font-family="sans-serif" font-size="12">
      장부상 위험조정 부채 = 기간별 주주 기회비용 현금흐름의 총 현재가치 (PV)
    </text>
  </g>

</svg>