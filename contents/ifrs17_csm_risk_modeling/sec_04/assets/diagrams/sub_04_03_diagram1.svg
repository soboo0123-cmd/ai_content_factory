<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Marker / Arrow Heads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="260" rx="12" fill="url(#bgGrad)"/>

  <!-- Title Section -->
  <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">
    IFRS 17 &amp; RAROC 연쇄 인과관계 메커니즘
  </text>
  <text x="30" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    현금흐름 변동성(&#x3C3;) 증가가 최종 자본 수익성(RAROC) 폭락으로 연결되는 4단계 메커니즘
  </text>

  <!-- Step 1 Card -->
  <g transform="translate(25, 75)" filter="url(#shadow)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="55" height="20" rx="4" fill="#2563eb"/>
    <text x="39" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1</text>
    
    <text x="14" y="54" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">변동성(&#x3C3;) 확대</text>
    <text x="14" y="74" font-family="sans-serif" font-size="11" fill="#94a3b8">VaR 요구자본 팽창</text>
    
    <rect x="12" y="92" width="161" height="50" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
    <text x="20" y="112" font-family="monospace" font-size="11" fill="#60a5fa">Capital = z&#x2211; &#x22c5; &#x3C3;</text>
    <text x="20" y="130" font-family="sans-serif" font-size="10" fill="#f1f5f9">&#x2191; &#x3C3; &#x2192; &#x2191; Capital (4배)</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="215" y1="152" x2="238" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 Card -->
  <g transform="translate(243, 75)" filter="url(#shadow)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad2)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="55" height="20" rx="4" fill="#7c3aed"/>
    <text x="39" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2</text>
    
    <text x="14" y="54" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">위험조정(RA) 적립</text>
    <text x="14" y="74" font-family="sans-serif" font-size="11" fill="#94a3b8">부채 장부 가산</text>
    
    <rect x="12" y="92" width="161" height="50" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
    <text x="20" y="112" font-family="monospace" font-size="11" fill="#c084fc">RA = Capital &#x22c5; r_CoC</text>
    <text x="20" y="130" font-family="sans-serif" font-size="10" fill="#f1f5f9">&#x2191; RA 부채 증가 (4배)</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="433" y1="152" x2="456" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 Card -->
  <g transform="translate(461, 75)" filter="url(#shadow)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="55" height="20" rx="4" fill="#d97706"/>
    <text x="39" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3</text>
    
    <text x="14" y="54" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">신계약 CSM 침식</text>
    <text x="14" y="74" font-family="sans-serif" font-size="11" fill="#94a3b8">미래 이익 마진 감소</text>
    
    <rect x="12" y="92" width="161" height="50" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
    <text x="20" y="112" font-family="monospace" font-size="10" fill="#fbbf24">CSM = Prem - BEL - RA</text>
    <text x="20" y="130" font-family="sans-serif" font-size="10" fill="#f1f5f9">&#x2193; CSM 이익 차감 발생</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="651" y1="152" x2="674" y2="152" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowDanger)"/>

  <!-- Step 4 Card -->
  <g transform="translate(679, 75)" filter="url(#shadow)">
    <rect width="195" height="155" rx="10" fill="url(#cardGrad4)" stroke="#ef4444" stroke-width="2"/>
    <rect x="12" y="12" width="55" height="20" rx="4" fill="#dc2626"/>
    <text x="39" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Step 4</text>
    
    <text x="14" y="54" font-family="sans-serif" font-size="13" font-weight="800" fill="#fca5a5">RAROC 비선형 폭락</text>
    <text x="14" y="74" font-family="sans-serif" font-size="11" fill="#f87171">이중 타격 레버리지</text>
    
    <rect x="12" y="92" width="171" height="50" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#7f1d1d"/>
    <text x="20" y="112" font-family="monospace" font-size="11" fill="#fca5a5">RAROC = CSM / Capital</text>
    <text x="20" y="130" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444">&#x2193;&#x2193; RAROC 급감 (150%&#x2192;33%)</text>
  </g>
</svg>