<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .card-accent-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; rx: 8px; }
      .card-accent-green { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 8px; }
      .card-accent-red { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.5; rx: 8px; }
      .title-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .sub-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .highlight-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; marker-end: url(#arrowhead); }
      .badge-red { fill: #ef4444; }
      .badge-green { fill: #10b981; }
      .badge-text { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Step 1: 상품 진단 -->
  <g transform="translate(20, 25)">
    <rect width="220" height="210" class="card"/>
    <text x="15" y="30" class="title-text">1. 상품 RAROC 진단</text>
    <text x="15" y="52" class="sub-text">현금흐름 변동성(σ) 평가</text>
    
    <!-- Sub Box A -->
    <rect x="15" y="68" width="190" height="55" class="card-accent-green"/>
    <text x="25" y="88" class="title-text" fill="#15803d">상품 A (저변동성)</text>
    <text x="25" y="108" class="sub-text">RAROC = 150.0% (적격)</text>
    <circle cx="185" cy="85" r="10" class="badge-green"/>
    <text x="185" y="89" class="badge-text">Pass</text>

    <!-- Sub Box B -->
    <rect x="15" y="135" width="190" height="80" class="card-accent-red"/>
    <text x="25" y="155" class="title-text" fill="#b91c1c">상품 B (고변동성)</text>
    <text x="25" y="173" class="sub-text">RAROC = 33.8% &lt; 목표 50%</text>
    <text x="25" y="193" class="highlight-text" fill="#dc2626">자본 파괴 상품 판정</text>
    <circle cx="185" cy="152" r="10" class="badge-red"/>
    <text x="185" y="156" class="badge-text">Fail</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="240" y1="130" x2="270" y2="130" class="arrow"/>

  <!-- Step 2: 실무 대응 전략 분기 -->
  <g transform="translate(270, 25)">
    <rect width="250" height="210" class="card"/>
    <text x="15" y="30" class="title-text">2. 경영진 의사결정 분기</text>
    <text x="15" y="52" class="sub-text">자본 관리 최적화 프로세스</text>

    <!-- Option A: Pricing -->
    <rect x="15" y="68" width="220" height="60" class="card-accent-blue"/>
    <text x="25" y="88" class="title-text" fill="#1d4ed8">전략 A: Repricing (가격 재설정)</text>
    <text x="25" y="106" class="sub-text">위험 프레미엄(Risk Premium) 부과</text>
    <text x="25" y="120" class="sub-text">필요 보험료: 1,200억 → 1,400억</text>

    <!-- Option B: Capital Allocation -->
    <rect x="15" y="138" width="220" height="60" class="card-accent-blue"/>
    <text x="25" y="158" class="title-text" fill="#1d4ed8">전략 B: Capital Allocation</text>
    <text x="25" y="176" class="sub-text">한정된 자본의 차등 배분</text>
    <text x="25" y="190" class="sub-text">고효율 상품 A로 자본 쏠림 (90%)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="520" y1="130" x2="550" y2="130" class="arrow"/>

  <!-- Step 3: 최종 가치 창출 결과 -->
  <g transform="translate(550, 25)">
    <rect width="250" height="210" class="card-accent-green"/>
    <text x="15" y="30" class="title-text" fill="#15803d">3. 최종 재무 성과 개선</text>
    <text x="15" y="52" class="sub-text">K-IFRS 1117호 재무 가치 극대화</text>

    <rect x="15" y="68" width="220" height="55" fill="#ffffff" stroke="#bbf7d0" rx="6"/>
    <text x="25" y="88" class="highlight-text" fill="#166534">Repricing 결과</text>
    <text x="25" y="108" class="sub-text">상품 B RAROC 33.8% → 72.5% 초과</text>

    <rect x="15" y="133" width="220" height="65" fill="#ffffff" stroke="#bbf7d0" rx="6"/>
    <text x="25" y="153" class="highlight-text" fill="#166534">Capital Allocation 결과</text>
    <text x="25" y="171" class="sub-text">전사 CSM: 919억 → 1,384억 (+50.6%)</text>
    <text x="25" y="187" class="sub-text">전사 평균 RAROC: 91.9% → 138.4%</text>
  </g>
</svg>