<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="820" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Title Section -->
  <text x="40" y="45" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
    K-ICS 99.5% VaR 기반 요구자본 및 임계 한계 변동성 통제 메커니즘
  </text>
  <text x="40" y="68" font-family="'Pretendard', sans-serif" font-size="12" fill="#94a3b8">
    현금흐름 변동성(σ) 측정이 최적추정부채(BEL) 소거를 거쳐 자본 한도 통제로 이어지는 흐름
  </text>

  <!-- Step 1: Input Cash Flow Volatility -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="210" height="110" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1"/>
    <rect x="40" y="100" width="210" height="6" rx="3" fill="url(#blueGrad)"/>
    <text x="56" y="128" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#60a5fa">STEP 1. 변동성 측정</text>
    <text x="56" y="152" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">현금유출 분포 FCF</text>
    <text x="56" y="174" font-family="'Pretendard', sans-serif" font-size="12" fill="#cbd5e1">평균 μ (BEL) &amp; 표준편차 σ</text>
    <text x="56" y="193" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8">FCF ~ N(μ, σ²)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="155" x2="280" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Calculate 99.5% VaR & Required Capital -->
  <g filter="url(#shadow)">
    <rect x="286" y="100" width="240" height="110" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1"/>
    <rect x="286" y="100" width="240" height="6" rx="3" fill="url(#amberGrad)"/>
    <text x="302" y="128" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#fbbf24">STEP 2. VaR 및 요구자본 유도</text>
    <text x="302" y="150" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">VaR₀.₉₉₅ = μ + z₀.₀₀₅ · σ</text>
    <text x="302" y="172" font-family="'Pretendard', sans-serif" font-size="11" fill="#fbbf24">평균(μ) 소거 장치 작동 [BEL 차감]</text>
    <text x="302" y="193" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Capital = 2.576 · σ</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="526" y1="155" x2="556" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Capital Limit Control & BEP -->
  <g filter="url(#shadow)">
    <rect x="562" y="100" width="218" height="110" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1"/>
    <rect x="562" y="100" width="218" height="6" rx="3" fill="url(#blueGrad)"/>
    <text x="578" y="128" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#60a5fa">STEP 3. 한도 통제 검증</text>
    <text x="578" y="150" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">가용자본 한도 (C_max)</text>
    <text x="578" y="172" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">σ_BEP = C_max / z_α</text>
    <text x="578" y="193" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8">임계 한계 변동성 산출</text>
  </g>

  <!-- Decision Branch Arrows -->
  <!-- Branch 1: Pass -->
  <path d="M 671 210 L 671 245 L 420 245 L 420 265" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)"/>
  <!-- Branch 2: Fail -->
  <path d="M 671 210 L 671 245 L 671 265" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-rose)"/>

  <!-- Result Box 1: PASS -->
  <g filter="url(#shadow)">
    <rect x="290" y="270" width="260" height="80" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="296" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ 인수 승인 (σ ≤ σ_BEP)</text>
    <text x="310" y="318" font-family="'Pretendard', sans-serif" font-size="11" fill="#a7f3d0">• 요구자본 ≤ 가용자본 한도</text>
    <text x="310" y="335" font-family="'Pretendard', sans-serif" font-size="11" fill="#a7f3d0">• 자본 버퍼 확보 및 RAROC 제고</text>
  </g>

  <!-- Result Box 2: FAIL -->
  <g filter="url(#shadow)">
    <rect x="570" y="270" width="210" height="80" rx="10" fill="#881337" stroke="#e11d48" stroke-width="1.5"/>
    <text x="586" y="296" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#fb7185">✕ 경고 / 통제 (σ &gt; σ_BEP)</text>
    <text x="586" y="318" font-family="'Pretendard', sans-serif" font-size="11" fill="#fecdd3">• 자본 초과 위험 발생</text>
    <text x="586" y="335" font-family="'Pretendard', sans-serif" font-size="11" fill="#fecdd3">• 재보험 출재 or 언더라이팅 축소</text>
  </g>
</svg>