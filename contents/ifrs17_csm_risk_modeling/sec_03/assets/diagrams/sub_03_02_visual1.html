<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSM 상각 & RA 환입 이익 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    input[type=range] {
      accent-color: #3b82f6;
    }
  </style>
</head>
<body class="p-4 md:p-6">
  <div class="max-w-5xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 mb-5 border-b border-slate-800 gap-2">
      <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-blue-500"></span>
          CSM 상각 & RA 환입 이익 소구 시뮬레이터
        </h2>
        <p class="text-xs text-slate-400 mt-1">부채 자산의 시간 경과에 따른 당기 손익 유입 체계 및 $S_{\text{BEP}}$ 지수 계산기</p>
      </div>
      <div class="flex gap-2">
        <button onclick="setPreset('conservative')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-900/50 hover:bg-emerald-800/60 text-emerald-300 stroke-emerald-500 border border-emerald-700/50 rounded-lg transition">
          보수적 RA (고RA)
        </button>
        <button onclick="setPreset('moderate')" class="px-3 py-1.5 text-xs font-semibold bg-blue-900/50 hover:bg-blue-800/60 text-blue-300 stroke-blue-500 border border-blue-700/50 rounded-lg transition">
          완화적 RA (저RA)
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Controls Panel -->
      <div class="lg:col-span-5 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 space-y-4">
        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">파라미터 설정</h3>
        
        <!-- Slider 1: CSM Initial -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">초기 CSM 잔액</span>
            <span id="csmVal" class="text-blue-400 font-bold">300 만원</span>
          </div>
          <input type="range" id="csmInput" min="50" max="500" step="10" value="300" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Slider 2: RA Initial -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">초기 RA 설정액</span>
            <span id="raVal" class="text-emerald-400 font-bold">200 만원</span>
          </div>
          <input type="range" id="raInput" min="20" max="400" step="10" value="200" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Slider 3: Duration -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">보장 기간 (년)</span>
            <span id="yearsVal" class="text-indigo-400 font-bold">3 년</span>
          </div>
          <input type="range" id="yearsInput" min="3" max="5" step="1" value="3" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Metric KPI Cards -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800">
          <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-800">
            <div class="text-[11px] text-slate-400">1년차 당기 이익</div>
            <div id="firstYearProfit" class="text-base font-extrabold text-amber-400 mt-0.5">0 만원</div>
          </div>
          <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-800">
            <div class="text-[11px] text-slate-400">1년차 $S_{\text{BEP}}$ 지수</div>
            <div id="sbepIndex" class="text-base font-extrabold text-purple-400 mt-0.5">0.00</div>
          </div>
        </div>

        <!-- Diagnostic Text -->
        <div id="diagCard" class="p-3 rounded-lg text-xs leading-relaxed border bg-purple-950/30 border-purple-800/40 text-purple-200">
          -
        </div>
      </div>

      <!-- Visual Charts Panel -->
      <div class="lg:col-span-7 flex flex-col justify-between space-y-4">
        <!-- Chart Container -->
        <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80 h-[280px]">
          <canvas id="profitChart"></canvas>
        </div>

        <!-- Summary Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left text-slate-300">
            <thead class="text-[11px] uppercase bg-slate-800/60 text-slate-400">
              <tr>
                <th class="px-2.5 py-1.5 rounded-l">경과년도</th>
                <th class="px-2.5 py-1.5 text-blue-400">CSM 상각액</th>
                <th class="px-2.5 py-1.5 text-emerald-400">RA 환입액</th>
                <th class="px-2.5 py-1.5 text-amber-400 font-bold rounded-r">당기 이익 합계</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-800/50">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let chartInstance = null;

    // Coverage Unit Weights by Duration
    const weightsMap = {
      3: [0.50, 0.30, 0.20],
      4: [0.40, 0.30, 0.20, 0.10],
      5: [0.35, 0.25, 0.20, 0.12, 0.08]
    };

    function calculateData() {
      const csm0 = parseFloat(document.getElementById('csmInput').value);
      const ra0 = parseFloat(document.getElementById('raInput').value);
      const years = parseInt(document.getElementById('yearsInput').value);

      const weights = weightsMap[years];
      let csmRem = csm0;
      let raRem = ra0;

      const csmAmortList = [];
      const raReleaseList = [];
      const totalProfitList = [];

      for (let t = 0; t < years; t++) {
        // Calculate CSM Amortization based on remaining coverage units
        const currentWeight = weights[t];
        const remWeightSum = weights.slice(t).reduce((a, b) => a + b, 0);
        const ratio = currentWeight / remWeightSum;

        const csmAmort = csmRem * ratio;
        csmRem -= csmAmort;

        // RA Release (Assuming linear decay for simplicity)
        const raRelease = ra0 * (1 / years);
        raRem -= raRelease;

        csmAmortList.push(Math.round(csmAmort * 10) / 10);
        raReleaseList.push(Math.round(raRelease * 10) / 10);
        totalProfitList.push(Math.round((csmAmort + raRelease) * 10) / 10);
      }

      return { years, csmAmortList, raReleaseList, totalProfitList };
    }

    function updateUI() {
      const csmVal = document.getElementById('csmInput').value;
      const raVal = document.getElementById('raInput').value;
      const yearsVal = document.getElementById('yearsInput').value;

      document.getElementById('csmVal').innerText = `${csmVal} 만원`;
      document.getElementById('raVal').innerText = `${raVal} 만원`;
      document.getElementById('yearsVal').innerText = `${yearsVal} 년`;

      const data = calculateData();

      // KPI Update
      const firstYearProfit = data.totalProfitList[0];
      const firstYearCSM = data.csmAmortList[0];
      const firstYearRA = data.raReleaseList[0];
      const sbep = (firstYearRA / firstYearCSM).toFixed(2);

      document.getElementById('firstYearProfit').innerText = `${firstYearProfit} 만원`;
      document.getElementById('sbepIndex').innerText = sbep;

      // Diagnostic Card
      const diagCard = document.getElementById('diagCard');
      if (sbep > 1.0) {
        diagCard.className = "p-3 rounded-lg text-xs leading-relaxed border bg-amber-950/40 border-amber-800/50 text-amber-200";
        diagCard.innerHTML = `<span class="font-bold text-amber-400">[S_BEP = ${sbep} &gt; 1.0 : 위험 해소 의존형]</span><br>초기 RA가 커서 손익의 많은 부분이 불확실성 해소(RA 환입)에 의존합니다. 손해율 안정 시 손익 평탄화 효과가 우수합니다.`;
      } else {
        diagCard.className = "p-3 rounded-lg text-xs leading-relaxed border bg-blue-950/40 border-blue-800/50 text-blue-200";
        diagCard.innerHTML = `<span class="font-bold text-blue-400">[S_BEP = ${sbep} &le; 1.0 : 서비스 제공 기반형]</span><br>손익의 주요 동인이 본업인 보장 서비스 제공(CSM 상각)에 위치합니다. 전통적 우량 보험사의 방어적 구조입니다.`;
      }

      // Table Update
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      for (let i = 0; i < data.years; i++) {
        const row = document.createElement('tr');
        row.className = 'border-b border-slate-800/40 hover:bg-slate-800/30';
        row.innerHTML = `
          <td class="px-2.5 py-2 font-medium text-slate-300">${i + 1}년차</td>
          <td class="px-2.5 py-2 text-blue-400">${data.csmAmortList[i]} 만원</td>
          <td class="px-2.5 py-2 text-emerald-400">${data.raReleaseList[i]} 만원</td>
          <td class="px-2.5 py-2 text-amber-400 font-bold">${data.totalProfitList[i]} 만원</td>
        `;
        tbody.appendChild(row);
      }

      // Chart Update
      renderChart(data);
    }

    function renderChart(data) {
      const ctx = document.getElementById('profitChart').getContext('2d');
      const labels = Array.from({ length: data.years }, (_, i) => `${i + 1}년차`);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'CSM 상각액 (서비스 대가)',
              data: data.csmAmortList,
              backgroundColor: '#3b82f6',
              borderRadius: 4
            },
            {
              label: 'RA 환입액 (위험 소멸 대가)',
              data: data.raReleaseList,
              backgroundColor: '#10b981',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              stacked: true,
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8', font: { size: 11 } }
            },
            y: {
              stacked: true,
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8', font: { size: 11 } },
              title: { display: true, text: '손익 인식액 (만원)', color: '#64748b', font: { size: 10 } }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#cbd5e1', font: { size: 11 }, boxWidth: 12 }
            },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#f8fafc',
              bodyColor: '#cbd5e1',
              borderColor: '#334155',
              borderWidth: 1
            }
          }
        }
      });
    }

    function setPreset(type) {
      if (type === 'conservative') {
        document.getElementById('csmInput').value = 150;
        document.getElementById('raInput').value = 250;
        document.getElementById('yearsInput').value = 3;
      } else if (type === 'moderate') {
        document.getElementById('csmInput').value = 350;
        document.getElementById('raInput').value = 100;
        document.getElementById('yearsInput').value = 3;
      }
      updateUI();
    }

    // Event Listeners
    document.getElementById('csmInput').addEventListener('input', updateUI);
    document.getElementById('raInput').addEventListener('input', updateUI);
    document.getElementById('yearsInput').addEventListener('input', updateUI);

    // Initial Trigger
    window.onload = updateUI;
  </script>
</body>
</html>
