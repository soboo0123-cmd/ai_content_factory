<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험조정(RA) 확률분포 시각화 위젯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 p-5">
        <!-- Header -->
        <div class="border-b border-slate-200 pb-3 mb-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span>
                위험조정(RA - VaR 방식) 확률분포 및 안전마진 시뮬레이터
            </h2>
            <p class="text-xs text-slate-500 mt-1">
                신뢰수준($\alpha$)과 현금흐름 변동성($\sigma$)을 조절하여 기대값 $E[X]$ 대비 위험조정(RA) 마진의 크기를 실시간 확인하세요.
            </p>
        </div>

        <!-- Controls & Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
            <!-- Controls -->
            <div class="md:col-span-1 bg-slate-50 p-3.5 rounded-lg border border-slate-200 text-xs space-y-3">
                <div>
                    <div class="flex justify-between font-semibold text-slate-700 mb-1">
                        <label for="inputStdDev">변동성 ($\sigma$):</label>
                        <span id="valStdDev" class="text-blue-600 font-bold">10%</span>
                    </div>
                    <input type="range" id="inputStdDev" min="2" max="25" value="10" step="1"
                           class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                </div>

                <div>
                    <div class="flex justify-between font-semibold text-slate-700 mb-1">
                        <label for="inputConfidence">신뢰수준 ($\alpha$):</label>
                        <span id="valConfidence" class="text-blue-600 font-bold">99.5%</span>
                    </div>
                    <input type="range" id="inputConfidence" min="800" max="999" value="995" step="1"
                           class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                </div>

                <div class="pt-2 border-t border-slate-200">
                    <span class="text-slate-500">기대 현금흐름 $E[X]$:</span>
                    <span class="font-bold text-slate-700 float-right">1,000억 원</span>
                </div>
            </div>

            <!-- Calculated Metrics -->
            <div class="md:col-span-2 grid grid-cols-3 gap-2">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-center flex flex-col justify-center">
                    <span class="text-xs text-blue-600 font-medium">기대값 $E[X]$</span>
                    <span class="text-base font-bold text-blue-900 mt-1">1,000.0 <span class="text-xs font-normal">억원</span></span>
                </div>
                <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-center flex flex-col justify-center">
                    <span class="text-xs text-indigo-600 font-medium">최대 손실 ($\text{VaR}_\alpha$)</span>
                    <span id="metricVaR" class="text-base font-bold text-indigo-900 mt-1">1,257.5 <span class="text-xs font-normal">억원</span></span>
                </div>
                <div class="bg-emerald-50 border border-emerald-300 rounded-lg p-3 text-center flex flex-col justify-center">
                    <span class="text-xs text-emerald-700 font-semibold">위험조정 ($\text{RA}$)</span>
                    <span id="metricRA" class="text-lg font-extrabold text-emerald-800 mt-1">257.5 <span class="text-xs font-normal">억원</span></span>
                </div>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div class="relative h-64 w-full">
            <canvas id="distributionChart"></canvas>
        </div>
    </div>

    <script>
        // Normal distribution Z-score approximation
        function getZScore(p) {
            // Abramowitz and Stegun formula
            if (p >= 1) p = 0.99999;
            if (p <= 0) p = 0.00001;
            const t = Math.sqrt(-2 * Math.log(1 - p));
            const c0 = 2.515517, c1 = 0.802853, c2 = 0.010328;
            const d1 = 1.432788, d2 = 0.189269, d3 = 0.001308;
            return t - ((c2 * t + c1) * t + c0) / (((d3 * t + d2) * t + d1) * t + 1.0);
        }

        function normalPDF(x, mean, std) {
            return (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
        }

        const ctx = document.getElementById('distributionChart').getContext('2d');
        let chart;

        function updateChart() {
            const stdDevPercent = parseFloat(document.getElementById('inputStdDev').value);
            const confPercent = parseFloat(document.getElementById('inputConfidence').value) / 10;
            
            document.getElementById('valStdDev').innerText = stdDevPercent + '%';
            document.getElementById('valConfidence').innerText = confPercent.toFixed(1) + '%';

            const mean = 1000;
            const stdDev = mean * (stdDevPercent / 100);
            const z = getZScore(confPercent / 100);
            const varValue = mean + z * stdDev;
            const raValue = varValue - mean;

            document.getElementById('metricVaR').innerHTML = varValue.toFixed(1) + ' <span class="text-xs font-normal">억원</span>';
            document.getElementById('metricRA').innerHTML = raValue.toFixed(1) + ' <span class="text-xs font-normal">억원</span>';

            // Generate Distribution Points
            const labels = [];
            const dataBase = [];
            const dataRA = [];
            const minX = mean - 3.5 * stdDev;
            const maxX = mean + 3.5 * stdDev;
            const steps = 100;
            const stepSize = (maxX - minX) / steps;

            for (let i = 0; i <= steps; i++) {
                const x = minX + i * stepSize;
                const pdf = normalPDF(x, mean, stdDev);
                labels.push(x.toFixed(0));
                
                if (x >= mean && x <= varValue) {
                    dataRA.push(pdf);
                    dataBase.push(null);
                } else {
                    dataRA.push(null);
                    dataBase.push(pdf);
                }
            }

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '기본 확률밀도',
                            data: dataBase,
                            borderColor: '#64748b',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.4
                        },
                        {
                            label: '위험조정 (RA) 영역',
                            data: dataRA,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.25)',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: '미래 현금흐름 현재가치 (억 원)', font: { size: 11 } },
                            ticks: { maxTicksLimit: 10, font: { size: 10 } },
                            grid: { display: false }
                        },
                        y: {
                            display: false
                        }
                    }
                }
            });
        }

        document.getElementById('inputStdDev').addEventListener('input', updateChart);
        document.getElementById('inputConfidence').addEventListener('input', updateChart);

        updateChart();
    </script>
</body>
</html>
