<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#f8fafc" rx="12"/>
  
  <!-- Title / Legend -->
  <text x="30" y="40" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="18" font-weight="bold" fill="#0f172a">롤오버 주기별 현금흐름 분포 구조 대조</text>
  <text x="30" y="62" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="13" fill="#64748b">동일한 누적 손익 발생 시, 주기에 따른 실질 현금 유출 타이밍과 강도의 물리적 차이</text>
  
  <!-- Divider -->
  <line x1="30" y1="80" x2="770" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- STRATEGY A: 3-Month Rollover (Upper Section) -->
  <g transform="translate(0, 100)">
    <!-- Section Label -->
    <rect x="30" y="0" width="180" height="26" rx="6" fill="#eff6ff"/>
    <text x="40" y="17" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#1e40af">전략 A: 3개월 단기 롤오버</text>
    <text x="220" y="17" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#64748b">현금 유출 분산형 (건당 충격 최소화)</text>
    
    <!-- Timeline Axis -->
    <line x1="100" y1="70" x2="700" y2="70" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 2"/>
    
    <!-- Timeline Ticks & Labels -->
    <!-- T=0 -->
    <circle cx="100" cy="70" r="4" fill="#3b82f6"/>
    <text x="100" y="90" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=0</text>
    <text x="100" y="105" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(최초 진입)</text>

    <!-- T=0.25 (3M) -->
    <circle cx="250" cy="70" r="4" fill="#ef4444"/>
    <line x1="250" y1="70" x2="250" y2="110" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="250" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">-3.15억</text>
    <text x="250" y="125" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=0.25 (3M)</text>

    <!-- T=0.50 (6M) -->
    <circle cx="400" cy="70" r="4" fill="#ef4444"/>
    <line x1="400" y1="70" x2="400" y2="110" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="400" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">-3.16억</text>
    <text x="400" y="125" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=0.50 (6M)</text>

    <!-- T=0.75 (9M) -->
    <circle cx="550" cy="70" r="4" fill="#ef4444"/>
    <line x1="550" y1="70" x2="550" y2="110" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="550" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">-3.17억</text>
    <text x="550" y="125" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=0.75 (9M)</text>

    <!-- T=1.00 (12M) -->
    <circle cx="700" cy="70" r="4" fill="#ef4444"/>
    <line x1="700" y1="70" x2="700" y2="110" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="700" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">-3.19억</text>
    <text x="700" y="125" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=1.00 (12M)</text>
  </g>

  <!-- STRATEGY B: 12-Month Hedge (Lower Section) -->
  <g transform="translate(0, 270)">
    <!-- Section Label -->
    <rect x="30" y="0" width="180" height="26" rx="6" fill="#fef2f2"/>
    <text x="40" y="17" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="bold" fill="#991b1b">전략 B: 12개월 장기 헤지</text>
    <text x="220" y="17" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#64748b">현금 유출 집중형 (만기 시점 충격 극대화)</text>
    
    <!-- Timeline Axis -->
    <line x1="100" y1="70" x2="700" y2="70" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 2"/>
    
    <!-- Timeline Ticks & Labels -->
    <!-- T=0 -->
    <circle cx="100" cy="70" r="4" fill="#3b82f6"/>
    <text x="100" y="90" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=0</text>
    <text x="100" y="105" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(최초 진입)</text>

    <!-- T=0.25 (No Settlement) -->
    <circle cx="250" cy="70" r="4" fill="#cbd5e1"/>
    <text x="250" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">정산 없음</text>
    <text x="250" y="90" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">3M</text>

    <!-- T=0.50 (No Settlement) -->
    <circle cx="400" cy="70" r="4" fill="#cbd5e1"/>
    <text x="400" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">정산 없음</text>
    <text x="400" y="90" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">6M</text>

    <!-- T=0.75 (No Settlement) -->
    <circle cx="550" cy="70" r="4" fill="#cbd5e1"/>
    <text x="550" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">정산 없음</text>
    <text x="550" y="90" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">9M</text>

    <!-- T=1.00 (Huge Settlement) -->
    <circle cx="700" cy="70" r="5" fill="#991b1b"/>
    <!-- Giant Arrow -->
    <line x1="700" y1="70" x2="700" y2="125" stroke="#991b1b" stroke-width="4" marker-end="url(#arrow-red-bold)"/>
    <text x="700" y="50" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">-12.60억</text>
    <text x="700" y="140" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569" text-anchor="middle">T=1.00 (12M 만기)</text>
  </g>

  <!-- Markers Definitions -->
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-red-bold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#991b1b"/>
    </marker>
  </defs>
</svg>