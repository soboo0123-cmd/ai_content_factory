<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <style>
    .title { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 13px; fill: #64748b; }
    .section-title { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .label { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 12px; fill: #334155; }
    .value { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
    .value-neg { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600; fill: #ef4444; }
    .card-title { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; }
    .card-bg-left { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .card-bg-right { fill: #f0fdfa; stroke: #ccfbf1; stroke-width: 1.5; }
    .arrow-text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="#ffffff" />
  <rect width="800" height="450" rx="12" fill="#f8fafc" opacity="0.3" />

  <!-- Main Title -->
  <text x="30" y="40" class="title">전세 계약 갱신 vs 선물환 롤오버 매칭 구조</text>
  <text x="30" y="60" class="subtitle">시장의 변화를 수용하여 고정 가격이 동적으로 리셋되는 금융적 대칭성</text>

  <!-- Left Column: Jeonse -->
  <g transform="translate(40, 90)">
    <rect width="330" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="330" height="40" rx="8" fill="#f1f5f9" />
    <path d="M0,32 L330,32" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="25" class="section-title" fill="#334155">🏡 일상 비유: 전세 계약 갱신</text>

    <!-- Block 1 -->
    <rect x="15" y="55" width="300" height="65" rx="6" class="card-bg-left" />
    <text x="25" y="75" class="card-title" fill="#475569">2년 전 최초 임대차 계약</text>
    <text x="25" y="95" class="label">당시 전세 보증금:</text>
    <text x="140" y="95" class="value">3억 원 (고정)</text>
    <text x="25" y="110" class="label">만기 기간:</text>
    <text x="140" y="110" class="value">2년 만기 완료 예정</text>

    <!-- Down Arrow -->
    <g transform="translate(150, 125)">
      <line x1="15" y1="0" x2="15" y2="25" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="11,20 15,27 19,20" fill="#94a3b8" />
    </g>

    <!-- Block 2 -->
    <rect x="15" y="155" width="300" height="65" rx="6" class="card-bg-left" style="fill: #fef2f2; stroke: #fca5a5;" />
    <text x="25" y="175" class="card-title" fill="#991b1b">2년 뒤 만기 봉착 (시세 폭등)</text>
    <text x="25" y="195" class="label">현재 시장 시세:</text>
    <text x="140" y="195" class="value" fill="#b91c1c">5억 원으로 상승</text>
    <text x="25" y="210" class="label">임차인의 기대:</text>
    <text x="140" y="210" class="value-neg">"종전 3억으로 연장 희망" (불가능)</text>

    <!-- Down Arrow -->
    <g transform="translate(150, 225)">
      <line x1="15" y1="0" x2="15" y2="25" stroke="#94a3b8" stroke-width="2" />
      <polygon points="11,20 15,27 19,20" fill="#94a3b8" />
    </g>

    <!-- Block 3 -->
    <rect x="15" y="255" width="300" height="50" rx="6" class="card-bg-left" style="stroke: #94a3b8;" />
    <text x="25" y="273" class="card-title" fill="#334155">합리적 재조정 합의</text>
    <text x="25" y="293" class="label">최종 결정:</text>
    <text x="90" y="293" class="value" fill="#0f172a">시장가(5억) 기준 재조정 후 갱신</text>
  </g>

  <!-- Right Column: FX Forward -->
  <g transform="translate(430, 90)">
    <rect width="330" height="320" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
    <rect width="330" height="40" rx="8" fill="#f0fdfa" />
    <path d="M0,32 L330,32" stroke="#ccfbf1" stroke-width="1" />
    <text x="15" y="25" class="section-title" fill="#0d9488">📈 금융 시장: 선물환 롤오버</text>

    <!-- Block 1 -->
    <rect x="15" y="55" width="300" height="65" rx="6" class="card-bg-right" />
    <text x="25" y="75" class="card-title" fill="#0f766e">T = 0 최초 선물환 계약</text>
    <text x="25" y="95" class="label">약정 고정 환율 (F₀):</text>
    <text x="140" y="95" class="value">1,274 원 / 달러</text>
    <text x="25" y="110" class="label">만기 기간:</text>
    <text x="140" y="110" class="value">1년 (단기 계약 진입)</text>

    <!-- Down Arrow -->
    <g transform="translate(150, 125)">
      <line x1="15" y1="0" x2="15" y2="25" stroke="#0d9488" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="11,20 15,27 19,20" fill="#0d9488" />
    </g>

    <!-- Block 2 -->
    <rect x="15" y="155" width="300" height="65" rx="6" class="card-bg-right" style="fill: #fff5f5; stroke: #fecaca;" />
    <text x="25" y="175" class="card-title" fill="#991b1b">T = 1 만기 시점 (환율 급상승)</text>
    <text x="25" y="195" class="label">현재 시장 환율 (S₁):</text>
    <text x="140" y="195" class="value" fill="#b91c1c">1,400 원으로 급상승</text>
    <text x="25" y="210" class="label">구 계약 정산 손익:</text>
    <text x="140" y="210" class="value-neg">-12.6억 원 (현금 정산 유출)</text>

    <!-- Down Arrow -->
    <g transform="translate(150, 225)">
      <line x1="15" y1="0" x2="15" y2="25" stroke="#0d9488" stroke-width="2" />
      <polygon points="11,20 15,27 19,20" fill="#0d9488" />
    </g>

    <!-- Block 3 -->
    <rect x="15" y="255" width="300" height="50" rx="6" class="card-bg-right" style="stroke: #0d9488; fill: #f0fdfa;" />
    <text x="25" y="273" class="card-title" fill="#0f766e">신규 롤오버 체결 (환율 리셋)</text>
    <text x="25" y="293" class="label">차기 약정 환율 (F₁):</text>
    <text x="140" y="293" class="value" fill="#0d9488">1,372 원 (계단식 상승 완료)</text>
  </g>

  <!-- Central Linking Arrow -->
  <g transform="translate(375, 220)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#0d9488" stroke-width="2" />
    <polygon points="45,-4 52,0 45,4" fill="#0d9488" />
    <rect x="2" y="-23" width="46" height="15" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5" />
    <text x="6" y="-12" class="arrow-text">구조 동질</text>
  </g>
</svg>