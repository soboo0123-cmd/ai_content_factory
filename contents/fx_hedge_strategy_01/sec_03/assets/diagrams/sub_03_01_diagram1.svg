<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="gradGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />

  <!-- Node 1: Customer -->
  <g transform="translate(50, 80)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#gradBlue)" />
    <text x="90" y="40" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">고객 (자산가/기업)</text>
    <rect x="15" y="60" width="150" height="1" fill="#93c5fd" opacity="0.5" />
    <text x="90" y="85" fill="#e0f2fe" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif">10년 만기 외화자산 보유</text>
    <text x="90" y="102" fill="#e0f2fe" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif">장기 환헤지 수요 발생</text>
  </g>

  <!-- Node 2: Bank -->
  <g transform="translate(310, 80)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#gradGreen)" />
    <text x="90" y="40" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">시중 은행 (딜러)</text>
    <rect x="15" y="60" width="150" height="1" fill="#a7f3d0" opacity="0.5" />
    <text x="90" y="85" fill="#ecfdf5" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif">시장 조성자 (Market Maker)</text>
    <text x="90" y="102" fill="#ecfdf5" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif">스퀘어 포지션 구축 의무</text>
  </g>

  <!-- Node 3: Interbank Market (Unbalanced) -->
  <g transform="translate(570, 80)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#gradRed)" />
    <text x="90" y="40" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">도매 외환시장</text>
    <rect x="15" y="60" width="150" height="1" fill="#fca5a5" opacity="0.5" />
    <text x="90" y="85" fill="#fef2f2" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif">장기(5년+) 유동성 부재</text>
    <text x="90" y="102" fill="#fef2f2" font-size="12" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="bold">"거래 상대방 없음"</text>
  </g>

  <!-- Connection: Customer -> Bank -->
  <path d="M 230,120 L 300,120" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 300,160 L 236,160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="265" y="110" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">① 장기 헤지 요청</text>
  <text x="265" y="180" fill="#1e3a8a" font-size="11" text-anchor="middle" font-family="'Pretendard', sans-serif">환선도 매수</text>

  <!-- Connection: Bank -> Interbank -->
  <path d="M 490,120 L 560,120" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <path d="M 560,160 L 496,160" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="530" y="110" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">② 반대포지션 커버 시도</text>
  <text x="530" y="180" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">"매칭 실패 (Hedge Blocked)"</text>

  <!-- Core Message Bubble -->
  <path d="M 320,240 L 330,225 L 340,240 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <rect x="180" y="240" width="440" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <text x="400" y="270" fill="#1e40af" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Pretendard', sans-serif">
    결과: 은행은 리스크 오프셋(Offset)이 불가능하여 장기 계약 인수를 거절하거나 고액 수수료를 부과함
  </text>
</svg>