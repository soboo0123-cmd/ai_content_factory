<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  
  <!-- Outer Border -->
  <rect x="2" y="2" width="796" height="356" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Flow Lines / Connector Paths -->
  <path d="M 400 110 L 220 110 L 220 160" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 400 110 L 580 110 L 580 160" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 400 110 L 400 160" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Central Node: Rollover Point -->
  <rect x="280" y="30" width="240" height="60" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="400" y="55" fill="#f8fafc" font-family="'Pretendard', 'Inter', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">롤오버 시점 (t = 만기)</text>
  <text x="400" y="75" fill="#94a3b8" font-family="'Pretendard', 'Inter', sans-serif" font-size="12" text-anchor="middle">동시에 맞물려 돌아가는 두 개의 사건</text>

  <!-- Left Node: Event 1 (Settlement) -->
  <rect x="80" y="160" width="280" height="150" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="80" y="160" width="280" height="40" rx="8" fill="#fee2e2" />
  <text x="220" y="185" fill="#991b1b" font-family="'Pretendard', 'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">사건 ①: 기존 계약의 청산 (정산)</text>
  
  <!-- Event 1 Details -->
  <text x="100" y="225" fill="#4b5563" font-family="'Pretendard', 'Inter', sans-serif" font-size="13" font-weight="600">• 과거의 약속 이행 및 계약 종결</text>
  <text x="100" y="250" fill="#4b5563" font-family="'Pretendard', 'Inter', sans-serif" font-size="13" font-weight="600">• 평가손익의 현금 정산 (Cash In / Out)</text>
  <text x="100" y="275" fill="#dc2626" font-family="'Pretendard', 'Inter', sans-serif" font-size="12" font-weight="bold">→ 실질적인 기업 유동성에 즉각적 영향</text>

  <!-- Right Node: Event 2 (New Contract) -->
  <rect x="440" y="160" width="280" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="440" y="160" width="280" height="40" rx="8" fill="#dcfce7" />
  <text x="580" y="185" fill="#166534" font-family="'Pretendard', 'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">사건 ②: 신규 계약의 개시 (재헤지)</text>
  
  <!-- Event 2 Details -->
  <text x="460" y="225" fill="#4b5563" font-family="'Pretendard', 'Inter', sans-serif" font-size="13" font-weight="600">• 새로운 만기의 차기 계약 체결</text>
  <text x="460" y="250" fill="#4b5563" font-family="'Pretendard', 'Inter', sans-serif" font-size="13" font-weight="600">• 현재 시장 가격(선물환율) 기준 설정</text>
  <text x="460" y="275" fill="#15803d" font-family="'Pretendard', 'Inter', sans-serif" font-size="12" font-weight="bold">→ 새로운 헤지 비율 및 진입 단가 확정</text>

  <!-- Central Indicator: Connection Gear Icon Representation -->
  <circle cx="400" cy="180" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 395 175 L 405 185 M 405 175 L 395 185" stroke="#475569" stroke-width="2"/>
</svg>