<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- Background Style -->
  <style>
    .bg { fill: #f8fafc; }
    .title { font-family: 'Inter', 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
    .label { font-family: 'Inter', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
    .value { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    .line { stroke: #cbd5e1; stroke-dasharray: 4 4; stroke-width: 1.5; }
    .arrow { fill: #64748b; }
    .box-asset { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
    .box-tranche-a { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 6px; }
    .box-tranche-b { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 6px; }
    .box-tranche-c { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 2; rx: 6px; }
    .text-center { text-anchor: middle; }
    .text-right { text-anchor: end; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- Base Asset Block -->
  <rect x="50" y="130" width="200" height="100" class="box-asset" />
  <text x="150" y="175" class="title text-center" fill="#1d4ed8">대상 외화 자산</text>
  <text x="150" y="205" class="value text-center" fill="#1e40af">$10,000,000</text>
  <text x="150" y="225" class="label text-center" style="font-size: 11px;">(1년 만기 보유)</text>

  <!-- Split Lines -->
  <path d="M 250 180 L 330 90" stroke="#10b981" stroke-width="2" fill="none" />
  <path d="M 250 180 L 330 180" stroke="#f59e0b" stroke-width="2" fill="none" />
  <path d="M 250 180 L 330 270" stroke="#8b5cf6" stroke-width="2" fill="none" />

  <!-- Tranche A -->
  <rect x="340" y="40" width="380" height="80" class="box-tranche-a" />
  <text x="360" y="75" class="title" fill="#047857">트렌치 A (30%)</text>
  <text x="360" y="100" class="value" fill="#065f46">$3,000,000</text>
  <text x="700" y="75" class="label text-right">3개월 만기 환선도 계약</text>
  <text x="700" y="100" class="value text-right" fill="#047857">F = 1,293.5 원</text>

  <!-- Tranche B -->
  <rect x="340" y="140" width="380" height="80" class="box-tranche-b" />
  <text x="360" y="175" class="title" fill="#b45309">트렌치 B (40%)</text>
  <text x="360" y="200" class="value" fill="#92400e">$4,000,000</text>
  <text x="700" y="175" class="label text-right">6개월 만기 환선도 계약</text>
  <text x="700" y="200" class="value text-right" fill="#b45309">F = 1,287.0 원</text>

  <!-- Tranche C -->
  <rect x="340" y="240" width="380" height="80" class="box-tranche-c" />
  <text x="360" y="275" class="title" fill="#6d28d9">트렌치 C (30%)</text>
  <text x="360" y="300" class="value" fill="#5b21b6">$3,000,000</text>
  <text x="700" y="275" class="label text-right">12개월 만기 환선도 계약</text>
  <text x="700" y="300" class="value text-right" fill="#6d28d9">F = 1,274.0 원</text>
</svg>