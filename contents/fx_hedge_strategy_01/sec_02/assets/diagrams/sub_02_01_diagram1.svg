<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <!-- 배경 스타일 정의 -->
  <defs>
    <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="discountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FED7D7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; fill: #1E293B; }
    .label { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; fill: #475569; }
    .value-text { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: bold; }
    .status-title { font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: bold; }
  </style>

  <!-- 테두리 영역 -->
  <rect x="10" y="10" width="580" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 선물환 프리미엄 박스 -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="230" height="100" rx="8" fill="url(#premiumGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="55" y="70" class="status-title" fill="#065F46">선물환 프리미엄 (Premium)</text>
    <text x="55" y="95" class="label" fill="#047857">선물환율 (F) &gt; 현물환율 (S)</text>
    <text x="55" y="118" class="value-text" fill="#065F46">스왑포인트 &gt; 0 (+ 부호)</text>
  </g>

  <!-- 선물환 디스카운트 박스 -->
  <g filter="url(#shadow)">
    <rect x="40" y="180" width="230" height="100" rx="8" fill="url(#discountGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <text x="55" y="210" class="status-title" fill="#991B1B">선물환 디스카운트 (Discount)</text>
    <text x="55" y="235" class="label" fill="#B91C1C">선물환율 (F) &lt; 현물환율 (S)</text>
    <text x="55" y="258" class="value-text" fill="#991B1B">스왑포인트 &lt; 0 (- 부호)</text>
  </g>

  <!-- 중앙 흐름 및 수치 척도 라인 -->
  <g>
    <!-- 수직 축 -->
    <line x1="420" y1="40" x2="420" y2="280" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4 4"/>
    
    <!-- 현물환율 기준선 (중앙) -->
    <line x1="370" y1="160" x2="520" y2="160" stroke="#0F172A" stroke-width="3"/>
    <circle cx="420" cy="160" r="6" fill="#0F172A"/>
    <text x="430" y="155" class="value-text" fill="#0F172A">현물환율 (S)</text>
    <text x="430" y="173" class="label" fill="#475569">기준점 (0)</text>

    <!-- 프리미엄 영역 표시 화살표 -->
    <path d="M 420 130 L 420 60" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <rect x="435" y="75" width="130" height="35" rx="4" fill="#E6F4EA" stroke="#10B981" stroke-width="1"/>
    <text x="442" y="97" class="label" fill="#065F46" font-weight="bold">F 가치 상승구간</text>

    <!-- 디스카운트 영역 표시 화살표 -->
    <path d="M 420 190 L 420 260" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <rect x="435" y="210" width="130" height="35" rx="4" fill="#FCE8E6" stroke="#EF4444" stroke-width="1"/>
    <text x="442" y="232" class="label" fill="#991B1B" font-weight="bold">F 가치 하락구간</text>
  </g>

  <!-- 마커 정의 -->
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>
</svg>