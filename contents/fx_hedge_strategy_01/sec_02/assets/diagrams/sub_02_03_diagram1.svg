<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12" />
  
  <!-- Outer Border -->
  <rect x="15" y="15" width="770" height="420" rx="8" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Section Title -->
  <text x="400" y="45" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    실제 환 헤지 비용을 결정하는 3대 변수 유기적 관계도
  </text>

  <!-- Input Factors (Left Column) -->
  
  <!-- Factor 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="220" height="90" rx="8" fill="url(#blueGrad)" />
    <text x="55" y="112" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">01. 한·미 금리차</text>
    <text x="55" y="132" font-family="'Pretendard', sans-serif" font-size="12" fill="#DBEAFE">양국 시간가치의 격차 반영</text>
    <text x="55" y="148" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#93C5FD">이론적 스왑포인트의 앵커</text>
  </g>

  <!-- Factor 2 -->
  <g filter="url(#shadow)">
    <rect x="40" y="190" width="220" height="90" rx="8" fill="url(#tealGrad)" />
    <text x="55" y="222" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">02. 통화스왑 베이시스</text>
    <text x="55" y="242" font-family="'Pretendard', sans-serif" font-size="12" fill="#CCFBF1">국내 외화자금 시장의 수급</text>
    <text x="55" y="258" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#99F6E4">달러 품귀 시 마찰비용 가중</text>
  </g>

  <!-- Factor 3 -->
  <g filter="url(#shadow)">
    <rect x="40" y="300" width="220" height="90" rx="8" fill="url(#indigoGrad)" />
    <text x="55" y="332" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">03. 미 수익률 곡선 &amp; 만기</text>
    <text x="55" y="352" font-family="'Pretendard', sans-serif" font-size="12" fill="#E0E7FF">금리 기간 구조와 헤지 기간</text>
    <text x="55" y="368" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#C7D2FE">수익률 곡선 형태별 유불리 급변</text>
  </g>

  <!-- Central Processing Engine (Middle) -->
  <g filter="url(#shadow)">
    <circle cx="430" cy="235" r="75" fill="url(#grayGrad)" />
    <text x="430" y="220" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">실제 외환시장</text>
    <text x="430" y="240" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">스왑포인트 결정</text>
    <text x="430" y="260" font-family="'Pretendard', sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">(Fx Swap Market)</text>
  </g>

  <!-- Output (Right Column) -->
  <g filter="url(#shadow)">
    <rect x="580" y="165" width="180" height="140" rx="8" fill="url(#goldGrad)" />
    <rect x="590" y="175" width="160" height="32" rx="4" fill="#78350F" />
    <text x="670" y="196" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#FDE68A" text-anchor="middle">최종 산출 헤지 비용</text>
    
    <text x="670" y="235" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">실제 선물환율 (F)</text>
    <path d="M 610 245 L 730 245" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2,2" />
    <text x="670" y="265" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">실제 스왑포인트</text>
    <text x="670" y="285" font-family="'Pretendard', sans-serif" font-size="11" fill="#FEF3C7" text-anchor="middle">기업의 실질 손익 귀속</text>
  </g>

  <!-- Connecting Arrows / Paths with Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Arrows from Left to Middle -->
  <path d="M 260 125 L 310 125 L 365 190" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <path d="M 260 235 L 345 235" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 260 345 L 310 345 L 365 280" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- Arrow from Middle to Right -->
  <path d="M 505 235 L 570 235" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />

</svg>