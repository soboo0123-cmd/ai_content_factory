<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한미 금리차와 이론 스왑포인트 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 p-6">
  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-slate-900 text-white p-6">
      <h2 class="text-xl font-bold">한·미 금리차와 이론 스왑포인트 대시보드</h2>
      <p class="text-slate-400 text-xs mt-1">양국 중앙은행의 이자율 격차가 만들어내는 이론적 중력의 실시간 변동</p>
    </div>

    <!-- Content -->
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Controls -->
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">한국 연 이자율 ($i_{KRW}$): <span id="krw-val" class="text-blue-600 font-bold">3.00%</span></label>
          <input id="krw-slider" type="range" min="0.0" max="8.0" step="0.1" value="3.0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">미국 연 이자율 ($i_{USD}$): <span id="usd-val" class="text-red-600 font-bold">5.025%</span></label>
          <input id="usd-slider" type="range" min="0.0" max="8.0" step="0.025" value="5.025" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600">
        </div>

        <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">고정 및 준거 항목</h4>
          <ul class="text-xs text-slate-600 space-y-1">
            <li>• 기준 현물환율 ($S$): 1,300.00 원</li>
            <li>• 헤지 대상 만기: 3개월 (90일물, 연 0.25년)</li>
            <li>• 계산 원칙: Day-count Convention (ACT/360)</li>
          </ul>
        </div>
      </div>

      <!-- Displays (Tipping Scale Visualizer) -->
      <div class="flex flex-col justify-between bg-slate-50 p-6 rounded-xl border border-slate-200">
        <div class="text-center">
          <span class="text-xs font-bold text-slate-400 tracking-wider block mb-1">한·미 금리 스프레드</span>
          <span id="spread-val" class="text-2xl font-black text-slate-800">-2.025%p</span>
        </div>

        <!-- Scale Visual -->
        <div class="relative h-20 my-4 flex items-center justify-center">
          <!-- Stand -->
          <div class="absolute bottom-0 w-6 h-8 bg-slate-400 rounded-t-lg"></div>
          <!-- Lever -->
          <div id="lever" class="w-11/12 h-2 bg-slate-700 rounded-full origin-center transition-transform duration-300 ease-out" style="transform: rotate(10deg);">
            <!-- Left Weight (KRW) -->
            <div class="absolute -top-3 -left-2 w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-[10px] flex items-center justify-center shadow-md">KRW</div>
            <!-- Right Weight (USD) -->
            <div class="absolute -top-3 -right-2 w-8 h-8 rounded-full bg-red-600 text-white font-bold text-[10px] flex items-center justify-center shadow-md">USD</div>
          </div>
        </div>

        <!-- Calculated Output Dashboard -->
        <div class="space-y-3 pt-4 border-t border-slate-200">
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-500 font-medium">3M 이론 선물환율</span>
            <span id="forward-val" class="font-bold text-slate-800">1,293.47 원</span>
          </div>
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-500 font-medium">이론 스왑포인트</span>
            <span id="spop-val" class="font-black text-red-600">-6.53 원 (-653포인트)</span>
          </div>
          <div class="flex justify-between items-center text-xs pt-1">
            <span class="text-slate-400">연율화 헤지 비용률</span>
            <span id="cost-ratio-val" class="font-bold text-red-500">-2.01%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const krwSlider = document.getElementById('krw-slider');
    const usdSlider = document.getElementById('usd-slider');
    
    const krwVal = document.getElementById('krw-val');
    const usdVal = document.getElementById('usd-val');
    const spreadVal = document.getElementById('spread-val');
    const forwardVal = document.getElementById('forward-val');
    const spopVal = document.getElementById('spop-val');
    const costRatioVal = document.getElementById('cost-ratio-val');
    const lever = document.getElementById('lever');

    const S = 1300.00;
    const t = 90 / 360;

    function update() {
      const i_krw = parseFloat(krwSlider.value) / 100;
      const i_usd = parseFloat(usdSlider.value) / 100;

      // Update Slider value displays
      krwVal.textContent = (i_krw * 100).toFixed(1) + '%';
      usdVal.textContent = (i_usd * 100).toFixed(3) + '%';

      // Gap
      const gap = (i_krw - i_usd) * 100;
      spreadVal.textContent = (gap >= 0 ? '+' : '') + gap.toFixed(3) + '%p';
      if (gap < 0) {
        spreadVal.className = "text-2xl font-black text-red-600";
      } else if (gap > 0) {
        spreadVal.className = "text-2xl font-black text-blue-600";
      } else {
        spreadVal.className = "text-2xl font-black text-slate-800";
      }

      // Calculate Forward
      const F = S * (1 + i_krw * t) / (1 + i_usd * t);
      const spop = F - S;
      const spop_pip = spop * 100;
      const cost_pct = (F / S - 1) * (1 / t) * 100;

      // Outputs Update
      forwardVal.textContent = F.toFixed(2) + ' 원';
      
      if (spop < 0) {
        spopVal.textContent = spop.toFixed(2) + ' 원 (' + spop_pip.toFixed(0) + '포인트)';
        spopVal.className = "font-black text-red-600";
        costRatioVal.textContent = cost_pct.toFixed(2) + '%';
        costRatioVal.className = "font-bold text-red-500";
      } else if (spop > 0) {
        spopVal.textContent = '+' + spop.toFixed(2) + ' 원 (+' + spop_pip.toFixed(0) + '포인트)';
        spopVal.className = "font-black text-blue-600";
        costRatioVal.textContent = '+' + cost_pct.toFixed(2) + '% (헤지 프리미엄)';
        costRatioVal.className = "font-bold text-blue-500";
      } else {
        spopVal.textContent = '0.00 원 (0포인트)';
        spopVal.className = "font-black text-slate-800";
        costRatioVal.textContent = '0.00%';
        costRatioVal.className = "font-bold text-slate-500";
      }

      // Tipping scale rotation limit to -15 to +15 deg
      let deg = gap * 5; // Scaling factor
      deg = Math.max(-15, Math.min(15, deg));
      lever.style.transform = `rotate(${-deg}deg)`;
    }

    krwSlider.addEventListener('input', update);
    usdSlider.addEventListener('input', update);

    // Init
    update();
  </script>
</body>
</html>
