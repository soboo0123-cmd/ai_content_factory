<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <!-- 필터 (그림자) -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="360" rx="12" fill="#f8fafc" />

  <!-- 시간 축 구분선 -->
  <line x1="400" y1="30" x2="400" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4" />
  
  <!-- 시간 라벨 -->
  <rect x="120" y="15" width="160" height="30" rx="15" fill="#e2e8f0" />
  <text x="200" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">투자 시점 (T = 0)</text>

  <rect x="520" y="15" width="160" height="30" rx="15" fill="#e2e8f0" />
  <text x="600" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">만기 시점 (T = 1)</text>

  <!-- [T=0] 원화 투자금 노드 -->
  <rect x="30" y="70" width="150" height="70" rx="8" fill="url(#slateGrad)" filter="url(#dropShadow)" />
  <text x="105" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">원화 투자 원금</text>
  <text x="105" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#38bdf8" text-anchor="middle">V₀ × S₀</text>

  <!-- [T=0] 환전 프로세스 -->
  <path d="M 180 105 L 235 105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">환율 S₀ 적용</text>

  <!-- [T=0] 달러 원금 노드 -->
  <rect x="235" y="70" width="140" height="70" rx="8" fill="url(#blueGrad)" filter="url(#dropShadow)" />
  <text x="305" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">달러화 원금</text>
  <text x="305" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#93c5fd" text-anchor="middle">$V₀</text>

  <!-- [T=1] 달러 회수금 노드 -->
  <rect x="425" y="70" width="140" height="70" rx="8" fill="url(#blueGrad)" filter="url(#dropShadow)" />
  <text x="495" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">만기 달러 회수금</text>
  <text x="495" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#93c5fd" text-anchor="middle">V₀(1 + R_USD)</text>

  <!-- [T=1] 환전 프로세스 -->
  <path d="M 565 105 L 620 105" stroke="#94a3b8" stroke-width="2" />
  <text x="592" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">환율 S₁ 적용</text>

  <!-- [T=1] 원화 회수금 노드 -->
  <rect x="620" y="70" width="150" height="70" rx="8" fill="url(#slateGrad)" filter="url(#dropShadow)" />
  <text x="695" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">원화 회수금</text>
  <text x="695" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">V₀(1 + R_USD) × S₁</text>

  <!-- 중앙 채권 투자 프로세스 라인 (시간의 흐름) -->
  <path d="M 305 140 L 305 200 L 495 200 L 495 140" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="4 2" />
  <rect x="350" y="180" font-family="system-ui, -apple-system, sans-serif" width="100" height="40" rx="6" fill="url(#tealGrad)" />
  <text x="400" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">미국 채권 운용</text>
  <text x="495" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">수익률 R_USD</text>

  <!-- 화살표 촉 정의 -->
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
  </marker>
  <marker id="tealArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
  </marker>

  <!-- 하단 최종 결합 공식 노드 -->
  <rect x="180" y="250" width="440" height="85" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#dropShadow)" />
  <text x="400" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle">최종 원화 결합 수익률 공식 (R_KRW)</text>
  <text x="400" y="310" font-family="Courier New, monospace" font-size="20" font-weight="800" fill="#0f766e" text-anchor="middle">1 + R_KRW = (1 + R_USD) × (1 + R_FX)</text>

  <!-- 장식용 기호 -->
  <path d="M 380 105 L 415 105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
</svg>