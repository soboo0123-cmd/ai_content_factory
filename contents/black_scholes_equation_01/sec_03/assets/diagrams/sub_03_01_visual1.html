<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1기간 주가 트리 및 무차익 조건 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 p-4 min-h-[420px] flex flex-col justify-between">

  <div class="max-w-3xl mx-auto w-full bg-white rounded-xl shadow-md border border-slate-100 p-5">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
      <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
        <span class="inline-block w-2 h-5 bg-blue-600 rounded"></span>
        1기간 이항 트리 &amp; 시장 무차익 조건 시뮬레이터
      </h2>
      <span id="status-badge" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all duration-300"></span>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
      <!-- Sliders (Left) -->
      <div class="md:col-span-5 space-y-4">
        <!-- S Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>현재 주가 (S)</span>
            <span class="text-blue-600 font-mono" id="val-s">100원</span>
          </div>
          <input type="range" id="input-s" min="50" max="150" value="100" step="5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <!-- u Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>상승 계수 (u)</span>
            <span class="text-emerald-600 font-mono" id="val-u">1.20</span>
          </div>
          <input type="range" id="input-u" min="1.01" max="1.50" value="1.20" step="0.01" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600">
        </div>

        <!-- d Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>하락 계수 (d)</span>
            <span class="text-rose-600 font-mono" id="val-d">0.80</span>
          </div>
          <input type="range" id="input-d" min="0.50" max="0.99" value="0.80" step="0.01" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-rose-600">
        </div>

        <!-- r Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>무위험 이자율 (r)</span>
            <span class="text-purple-600 font-mono" id="val-r">5.0%</span>
          </div>
          <input type="range" id="input-r" min="0.00" max="0.25" value="0.05" step="0.01" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
        </div>
      </div>

      <!-- Visualization Tree (Right) -->
      <div class="md:col-span-7 flex flex-col items-center justify-center border border-slate-50 bg-slate-50/50 rounded-xl p-4 relative min-h-[220px]">
        <!-- Tree SVG -->
        <svg id="tree-svg" class="w-full max-w-[320px] h-[180px]" viewBox="0 0 300 160">
          <defs>
            <marker id="arrow-u" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981" />
            </marker>
            <marker id="arrow-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#EF4444" />
            </marker>
          </defs>
          <!-- Lines -->
          <path id="path-u" d="M 50,80 Q 120,50 190,40" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-u)" />
          <path id="path-d" d="M 50,80 Q 120,110 190,120" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-d)" />

          <!-- S Node -->
          <circle cx="50" cy="80" r="18" fill="#FFF" stroke="#2563EB" stroke-width="2.5" />
          <text x="50" y="84" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E293B">S</text>
          <text x="50" y="112" font-size="10" text-anchor="middle" fill="#64748B" id="txt-s-val">100</text>

          <!-- uS Node -->
          <circle cx="210" cy="40" r="18" fill="#FFF" stroke="#10B981" stroke-width="2.5" />
          <text x="210" y="44" font-size="10" font-weight="bold" text-anchor="middle" fill="#047857">uS</text>
          <text x="252" y="44" font-size="11" font-weight="bold" fill="#047857" id="txt-us-val">120</text>

          <!-- dS Node -->
          <circle cx="210" cy="120" r="18" fill="#FFF" stroke="#EF4444" stroke-width="2.5" />
          <text x="210" y="124" font-size="10" font-weight="bold" text-anchor="middle" fill="#B91C1C">dS</text>
          <text x="252" y="124" font-size="11" font-weight="bold" fill="#B91C1C" id="txt-ds-val">80</text>
        </svg>

        <!-- Condition Tracker Text -->
        <div class="mt-2 w-full text-center text-xs font-semibold px-2 py-1 rounded border" id="inequality-box">
          조건식 검증: <span id="inequality-text" class="font-mono">d &lt; 1+r &lt; u</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const inputS = document.getElementById('input-s');
    const inputU = document.getElementById('input-u');
    const inputD = document.getElementById('input-d');
    const inputR = document.getElementById('input-r');

    const valS = document.getElementById('val-s');
    const valU = document.getElementById('val-u');
    const valD = document.getElementById('val-d');
    const valR = document.getElementById('val-r');

    const txtS = document.getElementById('txt-s-val');
    const txtUS = document.getElementById('txt-us-val');
    const txtDS = document.getElementById('txt-ds-val');

    const statusBadge = document.getElementById('status-badge');
    const inequalityBox = document.getElementById('inequality-box');
    const inequalityText = document.getElementById('inequality-text');

    function update() {
      const S = parseFloat(inputS.value);
      const u = parseFloat(inputU.value);
      const d = parseFloat(inputD.value);
      const r = parseFloat(inputR.value);

      // Label Updates
      valS.innerText = `${S}원`;
      valU.innerText = u.toFixed(2);
      valD.innerText = d.toFixed(2);
      valR.innerText = `${(r * 100).toFixed(0)}%`;

      // Tree SVG Text Updates
      txtS.innerText = `${S.toFixed(0)}원`;
      txtUS.innerText = `${(u * S).toFixed(1)}원`;
      txtDS.innerText = `${(d * S).toFixed(1)}원`;

      // Check Arbitrage Condition: d < 1+r < u
      const factorR = 1 + r;
      const conditionMet = (d < factorR) && (factorR < u);

      inequalityText.innerText = `${d.toFixed(2)} < ${(factorR).toFixed(2)} < ${u.toFixed(2)}`;

      if (conditionMet) {
        statusBadge.innerText = "정상 시장 (무차익 거래 조건 충족)";
        statusBadge.className = "px-2.5 py-1 rounded-full text-xs font-bold transition-all duration-300 bg-emerald-100 text-emerald-800";
        inequalityBox.className = "mt-2 w-full text-center text-xs font-semibold px-2 py-1 rounded border border-emerald-200 bg-emerald-50 text-emerald-800";
      } else {
        statusBadge.innerText = "차익거래 가능 또는 불안정 시장";
        statusBadge.className = "px-2.5 py-1 rounded-full text-xs font-bold transition-all duration-300 bg-rose-100 text-rose-800 animate-pulse";
        inequalityBox.className = "mt-2 w-full text-center text-xs font-semibold px-2 py-1 rounded border border-rose-200 bg-rose-50 text-rose-800";
      }
    }

    [inputS, inputU, inputD, inputR].forEach(input => {
      input.addEventListener('input', update);
    });

    update();
  </script>
</body>
</html>
