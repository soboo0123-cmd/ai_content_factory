<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Grid Lines for tech aesthetic -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Time Labels -->
  <g fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">
    <text x="100" y="40" text-anchor="middle">t = 0 (현재)</text>
    <text x="350" y="40" text-anchor="middle">t = 1 (중간 시점)</text>
    <text x="600" y="40" text-anchor="middle">t = 2 (만기)</text>
  </g>

  <!-- Vertical Timeline Guides -->
  <line x1="100" y1="55" x2="100" y2="310" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="350" y1="55" x2="350" y2="310" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="600" y1="55" x2="600" y2="310" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Connection Paths (Branches) -->
  <g stroke="url(#lineGrad)" stroke-width="2.5" fill="none" opacity="0.7">
    <!-- t0 -> t1 -->
    <path d="M 100 180 L 350 90" />
    <path d="M 100 180 L 350 270" />
    <!-- t1 -> t2 -->
    <path d="M 350 90 L 600 50" />
    <path d="M 350 90 L 600 180" />
    <path d="M 350 270 L 600 180" />
    <path d="M 350 270 L 600 310" />
  </g>

  <!-- Transition Labels (Probabilities) -->
  <g fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">
    <rect x="210" y="115" width="24" height="16" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="222" y="127">p</text>

    <rect x="205" y="225" width="34" height="16" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="222" y="237" font-size="10">1-p</text>

    <rect x="465" y="55" width="24" height="16" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="477" y="67" fill="#c084fc">p</text>

    <rect x="460" y="115" width="34" height="16" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="477" y="127" fill="#c084fc" font-size="10">1-p</text>

    <rect x="465" y="215" width="24" height="16" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="477" y="227" fill="#c084fc">p</text>

    <rect x="460" y="275" width="34" height="16" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="477" y="287" fill="#c084fc" font-size="10">1-p</text>
  </g>

  <!-- Nodes (t=0) -->
  <g transform="translate(100, 180)">
    <circle r="26" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <text fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" y="4">S</text>
    <text fill="#94a3b8" font-size="11" text-anchor="middle" y="42" font-weight="600">C</text>
  </g>

  <!-- Nodes (t=1) -->
  <!-- Upper Node -->
  <g transform="translate(350, 90)">
    <circle r="26" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" y="4">uS</text>
    <text fill="#38bdf8" font-size="11" text-anchor="middle" y="-34" font-weight="600">Cu</text>
  </g>
  <!-- Lower Node -->
  <g transform="translate(350, 270)">
    <circle r="26" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" y="4">dS</text>
    <text fill="#38bdf8" font-size="11" text-anchor="middle" y="42" font-weight="600">Cd</text>
  </g>

  <!-- Nodes (t=2) -->
  <!-- Top Node -->
  <g transform="translate(600, 50)">
    <circle r="26" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
    <text fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" y="4">u²S</text>
    <text fill="#c084fc" font-size="11" text-anchor="middle" y="-34" font-weight="600">Cuu</text>
  </g>
  <!-- Middle Node -->
  <g transform="translate(600, 180)">
    <circle r="26" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
    <text fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" y="4">udS</text>
    <text fill="#c084fc" font-size="11" text-anchor="middle" y="42" font-weight="600">Cud</text>
  </g>
  <!-- Bottom Node -->
  <g transform="translate(600, 310)">
    <circle r="26" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
    <text fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" y="4">d²S</text>
    <text fill="#c084fc" font-size="11" text-anchor="middle" y="42" font-weight="600">Cdd</text>
  </g>

  <!-- Backward Induction Direction Arrow -->
  <g stroke="#f43f5e" stroke-width="2" fill="none">
    <path d="M 520,15 L 180,15" stroke-dasharray="4,4"/>
    <path d="M 180,15 L 188,10 M 180,15 L 188,20" stroke-linecap="round"/>
    <text x="350" y="32" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle" stroke="none">역방향 귀납 탐색 (Backward Induction)</text>
  </g>
</svg>