<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기하학적 델타 접선 플로터</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-[420px]">
  <div class="bg-white rounded-xl shadow-lg border border-slate-100 p-6 w-full max-w-4xl">
    <div class="text-center mb-4">
      <h2 class="text-xl font-bold text-slate-800">📈 델타(Δ)의 기하학적 의미 시각화</h2>
      <p class="text-xs text-slate-500 mt-1">상승 노드와 하락 노드를 잇는 할선의 기울기가 바로 포트폴리오의 최적 주식 매수 비율(Δ)입니다.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Sliders -->
      <div class="bg-slate-50 p-4 rounded-lg space-y-4 flex flex-col justify-center">
        <h3 class="text-sm font-bold text-slate-700 border-b pb-2 mb-2">실시간 파라미터 조작</h3>
        
        <!-- S Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>현재 주가 (S)</span>
            <span class="text-blue-600"><span id="valS">100</span>원</span>
          </div>
          <input type="range" id="paramS" min="60" max="140" value="100" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- K Slider -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>행사가격 (K)</span>
            <span class="text-emerald-600"><span id="valK">100</span>원</span>
          </div>
          <input type="range" id="paramK" min="65" max="135" value="100" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- u and d Controls -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
              <span>상승계수 (u)</span>
              <span class="text-indigo-600" id="valU">1.25</span>
            </div>
            <input type="range" id="paramU" min="1.05" max="1.45" step="0.01" value="1.25" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
          </div>
          <div>
            <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
              <span>하락계수 (d)</span>
              <span class="text-rose-600" id="valD">0.75</span>
            </div>
            <input type="range" id="paramD" min="0.55" max="0.95" step="0.01" value="0.75" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
          </div>
        </div>

        <!-- Outputs Display inside column -->
        <div class="pt-4 border-t border-slate-200 mt-2 space-y-2">
          <div class="flex justify-between text-xs">
            <span class="text-slate-500 font-semibold">만기 가치 기울기 (Δ):</span>
            <span class="font-extrabold text-blue-700" id="lblDelta">0.50</span>
          </div>
          <div class="flex justify-between text-xs">
            <span class="text-slate-500 font-semibold">현금 보유/차입 (B):</span>
            <span class="font-extrabold text-slate-700" id="lblB">-35.71원</span>
          </div>
        </div>
      </div>

      <!-- Graph Area (2/3 width) -->
      <div class="col-span-2 relative bg-slate-900 rounded-xl overflow-hidden min-h-[280px] border border-slate-800 flex flex-col">
        <div class="absolute top-3 left-4 text-slate-400 text-xs font-mono">X: 주가 (St) / Y: 만기 가치 (Ct, Pt)</div>
        <div class="flex-1 p-2">
          <svg id="chart" viewBox="0 0 500 250" class="w-full h-full"></svg>
        </div>
        <!-- Legend -->
        <div class="bg-slate-950 p-2.5 flex justify-around text-[10px] text-slate-400 border-t border-slate-800">
          <div class="flex items-center space-x-1.5">
            <div class="w-3 h-0.5 bg-emerald-500"></div>
            <span>콜옵션 만기 페이오프 (Max(S - K, 0))</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <div class="w-3 h-0.5 bg-blue-500"></div>
            <span>복제 포트폴리오 가치선 (기울기 = Δ)</span>
          </div>
          <div class="flex items-center space-x-1.5 font-bold text-white">
            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
            <span>uS, dS 노드</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const paramS = document.getElementById('paramS');
    const paramK = document.getElementById('paramK');
    const paramU = document.getElementById('paramU');
    const paramD = document.getElementById('paramD');

    const valS = document.getElementById('valS');
    const valK = document.getElementById('valK');
    const valU = document.getElementById('valU');
    const valD = document.getElementById('valD');

    const lblDelta = document.getElementById('lblDelta');
    const lblB = document.getElementById('lblB');

    const svg = document.getElementById('chart');

    function drawChart() {
      const S = parseFloat(paramS.value);
      const K = parseFloat(paramK.value);
      const u = parseFloat(paramU.value);
      const d = parseFloat(paramD.value);
      const r = 0.05; // fixed interest for simplicity of B in the graph

      valS.innerText = S;
      valK.innerText = K;
      valU.innerText = u.toFixed(2);
      valD.innerText = d.toFixed(2);

      const uS = u * S;
      const dS = d * S;

      const Cu = Math.max(uS - K, 0);
      const Cd = Math.max(dS - K, 0);

      const delta = (Cu - Cd) / ((u - d) * S);
      const B = (u * Cd - d * Cu) / ((u - d) * (1 + r));

      lblDelta.innerText = delta.toFixed(4) + "주";
      lblB.innerText = B.toFixed(2) + "원";

      // Viewbox scales
      // X maps from 40 to 180 -> SVG coordinate x from 50 to 450
      // Y maps from 0 to 80 -> SVG coordinate y from 220 to 20 (inverted)
      function mapX(x) {
        return 50 + ((x - 40) / (180 - 40)) * 400;
      }
      function mapY(y) {
        return 220 - (y / 80) * 200;
      }

      // Re-generate SVG elements
      svg.innerHTML = `
        <!-- Grid lines -->
        <line x1="${mapX(40)}" y1="${mapY(0)}" x2="${mapX(180)}" y2="${mapY(0)}" stroke="#334155" stroke-width="1.5" />
        <line x1="${mapX(40)}" y1="${mapY(0)}" x2="${mapX(40)}" y2="${mapY(80)}" stroke="#334155" stroke-width="1" />
        
        <!-- Grid Y divisions -->
        <line x1="${mapX(40)}" y1="${mapY(20)}" x2="${mapX(180)}" y2="${mapY(20)}" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />
        <line x1="${mapX(40)}" y1="${mapY(40)}" x2="${mapX(180)}" y2="${mapY(40)}" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />
        <line x1="${mapX(40)}" y1="${mapY(60)}" x2="${mapX(180)}" y2="${mapY(60)}" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />

        <!-- X labels -->
        <text x="${mapX(K)}" y="235" fill="#10b981" font-size="9" text-anchor="middle" font-weight="bold">K (${K})</text>
        <line x1="${mapX(K)}" y1="${mapY(0)}" x2="${mapX(K)}" y2="${mapY(0)+5}" stroke="#10b981" stroke-width="1.5" />

        <!-- Option Payoff Curve: Max(St - K, 0) -->
        <path d="M ${mapX(40)} ${mapY(0)} L ${mapX(K)} ${mapY(0)} L ${mapX(180)} ${mapY(180 - K)}" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.8" />

        <!-- Replicating Portfolio line at t=1 (Value of replication) -->
        <line x1="${mapX(dS)}" y1="${mapY(Cd)}" x2="${mapX(uS)}" y2="${mapY(Cu)}" stroke="#3b82f6" stroke-width="2.5" />
        <!-- Extended prediction lines -->
        <line x1="${mapX(40)}" y1="${mapY(delta * 40 + B*(1+r))}" x2="${mapX(dS)}" y2="${mapY(Cd)}" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
        <line x1="${mapX(uS)}" y1="${mapY(Cu)}" x2="${mapX(180)}" y2="${mapY(delta * 180 + B*(1+r))}" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />

        <!-- Pulsing Down Node (dS, Cd) -->
        <circle cx="${mapX(dS)}" cy="${mapY(Cd)}" r="6" fill="#f43f5e" />
        <circle cx="${mapX(dS)}" cy="${mapY(Cd)}" r="10" stroke="#f43f5e" stroke-width="1.5" fill="none" opacity="0.4" />
        <text x="${mapX(dS)}" y="${mapY(Cd) - 12}" fill="#f43f5e" font-size="9" text-anchor="middle" font-weight="bold">Cd (${Cd.toFixed(1)})</text>
        <text x="${mapX(dS)}" y="235" fill="#f43f5e" font-size="8" text-anchor="middle">dS (${dS.toFixed(0)})</text>

        <!-- Pulsing Up Node (uS, Cu) -->
        <circle cx="${mapX(uS)}" cy="${mapY(Cu)}" r="6" fill="#6366f1" />
        <circle cx="${mapX(uS)}" cy="${mapY(Cu)}" r="10" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.4" />
        <text x="${mapX(uS)}" y="${mapY(Cu) - 12}" fill="#6366f1" font-size="9" text-anchor="middle" font-weight="bold">Cu (${Cu.toFixed(1)})</text>
        <text x="${mapX(uS)}" y="235" fill="#6366f1" font-size="8" text-anchor="middle">uS (${uS.toFixed(0)})</text>

        <!-- Slope annotation bracket or Triangle -->
        <line x1="${mapX(dS)}" y1="${mapY(Cd)}" x2="${mapX(uS)}" y2="${mapY(Cd)}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="${mapX(uS)}" y1="${mapY(Cd)}" x2="${mapX(uS)}" y2="${mapY(Cu)}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" />
        <text x="${(mapX(dS) + mapX(uS))/2}" y="${mapY(Cd) + 12}" fill="#94a3b8" font-size="8" text-anchor="middle">Δ 주가</text>
        <text x="${mapX(uS) + 20}" y="${(mapY(Cd) + mapY(Cu))/2}" fill="#94a3b8" font-size="8" text-anchor="start">Δ 옵션가</text>
      `;
    }

    [paramS, paramK, paramU, paramD].forEach(input => {
      input.addEventListener('input', drawChart);
    });

    drawChart();
  </script>
</body>
</html>
