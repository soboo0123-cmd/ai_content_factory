<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Active Node Highlight Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="12" fill="url(#bg-grad)" />

  <!-- Time Axis Lines -->
  <line x1="100" y1="40" x2="100" y2="320" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="260" y1="40" x2="260" y2="320" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="420" y1="40" x2="420" y2="320" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="580" y1="40" x2="580" y2="320" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />

  <!-- Time Axis Labels -->
  <text x="100" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">t = 0 (현재)</text>
  <text x="260" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">t = 1</text>
  <text x="420" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">t = 2</text>
  <text x="580" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">t = 3 (만기)</text>

  <!-- Transition Links (Standard) -->
  <!-- t=0 -> t=1 -->
  <line x1="100" y1="180" x2="260" y2="100" stroke="#475569" stroke-width="2" />
  <line x1="100" y1="180" x2="260" y2="260" stroke="#475569" stroke-width="2" />
  
  <!-- t=1 -> t=2 -->
  <line x1="260" y1="100" x2="420" y2="60" stroke="#475569" stroke-width="2" />
  <line x1="260" y1="100" x2="420" y2="180" stroke="#38bdf8" stroke-dasharray="1" stroke-width="2" /> <!-- Highlighted Path (u->d) -->
  <line x1="260" y1="260" x2="420" y2="180" stroke="#f43f5e" stroke-dasharray="1" stroke-width="2" /> <!-- Highlighted Path (d->u) -->
  <line x1="260" y1="260" x2="420" y2="300" stroke="#475569" stroke-width="2" />

  <!-- t=2 -> t=3 -->
  <line x1="420" y1="60" x2="580" y2="40" stroke="#475569" stroke-width="2" />
  <line x1="420" y1="60" x2="580" y2="120" stroke="#475569" stroke-width="2" />
  
  <line x1="420" y1="180" x2="580" y2="120" stroke="#38bdf8" stroke-width="2.5" /> <!-- Merging Path 1 (u->d->u) -->
  <line x1="420" y1="180" x2="580" y2="240" stroke="#f43f5e" stroke-width="2.5" /> <!-- Merging Path 2 (d->u->d) -->

  <line x1="420" y1="300" x2="580" y2="240" stroke="#475569" stroke-width="2" />
  <line x1="420" y1="300" x2="580" y2="320" stroke="#475569" stroke-width="2" />

  <!-- Nodes Group -->
  <!-- t=0 -->
  <circle cx="100" y="180" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="100" y="184" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">S₀</text>

  <!-- t=1 -->
  <circle cx="260" y="100" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="260" y="104" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">uS₀</text>

  <circle cx="260" y="260" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="260" y="264" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">dS₀</text>

  <!-- t=2 -->
  <circle cx="420" y="60" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="420" y="64" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">u²S₀</text>

  <!-- Recombining point: udS_0 and duS_0 merge here -->
  <circle cx="420" y="180" r="22" fill="#0f172a" stroke="#e2e8f0" stroke-width="2.5" filter="url(#glow)" />
  <text x="420" y="184" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">udS₀</text>
  <text x="420" y="215" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(duS₀와 통합)</text>

  <circle cx="420" y="300" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="420" y="304" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">d²S₀</text>

  <!-- t=3 -->
  <circle cx="580" y="40" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="580" y="44" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">u³S₀</text>

  <!-- udS0 -> u, and udS0 -> d pathways -->
  <circle cx="580" y="120" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <text x="580" y="124" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">u²dS₀</text>

  <circle cx="580" y="240" r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5" />
  <text x="580" y="244" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ud²S₀</text>

  <circle cx="580" y="320" r="20" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="580" y="324" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">d³S₀</text>

  <!-- Explanatory Callouts -->
  <g transform="translate(480, 155)">
    <rect width="180" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="10" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">경로의 통폐합 (Recombination)</text>
    <text x="10" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">곱셈의 교환법칙(ud = du)에 의해</text>
    <text x="10" y="45" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">서로 다른 도달 경로가 단일 상태로 압축</text>
  </g>
</svg>