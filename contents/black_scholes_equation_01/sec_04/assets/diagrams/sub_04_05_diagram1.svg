<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="780" height="400" fill="none" stroke="#E2E8F0" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E293B" text-anchor="middle">차익거래 피드백 루프 (No-Arbitrage Feedback Loop)</text>

  <!-- Central Equilibrium Box -->
  <rect x="300" y="170" width="200" height="80" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3" rx="10"/>
  <text x="400" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1D4ED8" text-anchor="middle">무차익 균형 가격</text>
  <text x="400" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1E3A8A" text-anchor="middle">C = Δ · S - B</text>

  <!-- Left Box: Overvaluation -->
  <rect x="40" y="90" width="220" height="100" fill="#FFF5F5" stroke="#F87171" stroke-width="2" rx="8"/>
  <text x="150" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#991B1B" text-anchor="middle">시장가 고평가 (C &gt; Δ·S - B)</text>
  <text x="150" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">"옵션 매도 + 복제포트 매수"</text>
  <text x="150" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">매도 압력 유발 (Price Down)</text>

  <!-- Right Box: Undervaluation -->
  <rect x="540" y="230" width="220" height="100" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2" rx="8"/>
  <text x="650" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">시장가 저평가 (C &lt; Δ·S - B)</text>
  <text x="650" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#14532D" text-anchor="middle">"옵션 매수 + 복제포트 매도"</text>
  <text x="650" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">매수 압력 유발 (Price Up)</text>

  <!-- Curved Arrows (Feedback Loop) -->
  <!-- Left to Center -->
  <path d="M 150,198 C 150,260 220,290 290,240" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="290,240 280,241 285,249" fill="#EF4444"/>
  <text x="210" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#EF4444" text-anchor="middle">가격 하락 수렴</text>

  <!-- Center to Left (Deviation trigger) -->
  <path d="M 300,190 C 230,170 190,160 200,160" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="180,150 195,148 190,157" fill="#CBD5E1"/>
  <text x="235" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">일시적 왜곡</text>

  <!-- Right to Center -->
  <path d="M 650,222 C 650,160 580,130 510,180" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="510,180 520,179 515,171" fill="#10B981"/>
  <text x="590" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">가격 상승 수렴</text>

  <!-- Center to Right (Deviation trigger) -->
  <path d="M 500,230 C 570,250 610,260 600,260" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="620,270 605,272 610,263" fill="#CBD5E1"/>
  <text x="565" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">일시적 왜곡</text>

  <!-- Explanation Footer -->
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">"시장의 비이성적 쏠림이 유발한 괴리는 차익거래자의 즉각적인 헷징 매매에 의해 단숨에 제압됩니다."</text>
</svg>