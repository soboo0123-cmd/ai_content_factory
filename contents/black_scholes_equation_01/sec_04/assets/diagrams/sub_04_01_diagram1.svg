<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Definition for Shadows -->
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>

  <!-- Conceptual Grid Lines -->
  <line x1="100" y1="30" x2="100" y2="270" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="300" y1="30" x2="300" y2="270" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="30" x2="500" y2="270" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="30" x2="700" y2="270" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Horizontal Time Flow Arrow -->
  <path d="M 50 20 L 750 20" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none"/>
  
  <!-- Step Labels -->
  <text x="100" y="45" fill="#475569" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">t = 0 (시작)</text>
  <text x="300" y="45" fill="#475569" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">t = 1</text>
  <text x="500" y="45" fill="#475569" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">t = 2</text>
  <text x="700" y="45" fill="#475569" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">t = 3 (만기)</text>

  <!-- Large Reverse Indicator Arrow -->
  <g transform="translate(400, 265)">
    <path d="M 150 0 L -150 0" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="5,3"/>
    <polygon points="-150,0 -140,-6 -140,6" fill="#6366f1"/>
    <rect x="-110" y="-12" width="220" height="24" rx="12" fill="#6366f1"/>
    <text x="0" y="4" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">역방향 귀납 가치평가 흐름 (Backward Induction)</text>
  </g>

  <!-- Node Visual Representations (Mockup Nodes illustrating calculation) -->
  <!-- Target Parent Node -->
  <rect x="230" y="115" width="140" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5" filter="url(#drop-shadow)"/>
  <text x="300" y="140" fill="#1e293b" font-family="system-ui" font-size="14" font-weight="900" text-anchor="middle">현재가 V</text>
  <text x="300" y="165" fill="#6366f1" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">V = [p*V_u + (1-p)*V_d] / r</text>

  <!-- Child Up Node -->
  <rect x="530" y="65" width="110" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="585" y="95" fill="#065f46" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">상승 시 가치 V_u</text>

  <!-- Child Down Node -->
  <rect x="530" y="185" width="110" height="50" rx="8" fill="#fef2f2" stroke="#f43f5e" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="585" y="215" fill="#991b1b" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">하락 시 가치 V_d</text>

  <!-- Flow lines with labels -->
  <!-- Up link back -->
  <path d="M 530 90 L 370 135" fill="none" stroke="#10b981" stroke-width="2"/>
  <rect x="430" y="93" width="36" height="18" rx="4" fill="#e6f4ea" stroke="#10b981" stroke-width="0.5"/>
  <text x="448" y="106" fill="#0c662c" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">상승 p</text>

  <!-- Down link back -->
  <path d="M 530 210 L 370 165" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <rect x="425" y="185" width="46" height="18" rx="4" fill="#fce8e6" stroke="#f43f5e" stroke-width="0.5"/>
  <text x="448" y="198" fill="#b01313" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">하락 (1-p)</text>
</svg>