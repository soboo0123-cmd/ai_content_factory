<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만기 시나리오 시뮬레이터</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 min-h-[500px] flex items-center justify-center">

  <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-2xl">
    <!-- 헤더 -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
      <div>
        <h1 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
          동적 헤징 vs 고정 헤징 만기 시뮬레이터
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">만기 주가 변동에 따른 자산과 부채의 상쇄 메커니즘을 실시간 확인하세요.</p>
      </div>
      <!-- 모드 셀렉터 -->
      <div class="bg-slate-950 p-1 rounded-lg border border-slate-800 flex gap-1">
        <button id="btn-dynamic" onclick="setMode('dynamic')" class="px-3 py-1 text-xs font-bold rounded transition-all bg-indigo-600 text-white">
          동적 헤징 (성공)
        </button>
        <button id="btn-static" onclick="setMode('static')" class="px-3 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-slate-200">
          고정 헤징 (실패)
        </button>
      </div>
    </div>

    <!-- 주가 제어 슬라이더 -->
    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800/80 mb-5">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-400">만기 기초자산 주가 ($S_{final}$)</span>
        <span class="text-lg font-extrabold text-indigo-400" id="price-display">140원</span>
      </div>
      <input 
        type="range" 
        id="price-slider" 
        min="10" 
        max="270" 
        value="140" 
        class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
        oninput="updateSimulation()"
      />
      <div class="flex justify-between text-[10px] text-slate-500 mt-1">
        <span>폭락 ($10)</span>
        <span>행사가격 ($K=100$)</span>
        <span>폭등 ($270)</span>
      </div>
    </div>

    <!-- 메인 시각화 그래픽 (막대 대조 차트) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
      <!-- 좌측: 유입 자산 -->
      <div class="bg-slate-950/60 p-4 rounded-lg border border-emerald-950/40 relative">
        <div class="text-xs font-bold text-emerald-400 mb-3 flex justify-between">
          <span>[자산] 주식 매도 대금</span>
          <span id="asset-delta" class="text-[10px] text-slate-400 font-normal">델타: 0.500주</span>
        </div>
        <div class="h-24 flex items-end bg-slate-900/40 rounded p-1 mb-2">
          <div id="bar-asset" class="w-full bg-gradient-to-t from-emerald-600 to-emerald-400 rounded-sm transition-all duration-150" style="height: 50%;"></div>
        </div>
        <div class="text-right text-lg font-bold text-emerald-400" id="val-asset">+0.00원</div>
      </div>

      <!-- 우측: 유출 부채/의무 -->
      <div class="bg-slate-950/60 p-4 rounded-lg border border-rose-950/40 relative">
        <div class="text-xs font-bold text-rose-400 mb-3 flex justify-between">
          <span>[부채] 옵션 의무 + 차입 상환</span>
          <span class="text-[10px] text-slate-400 font-normal">행사가 K: 100</span>
        </div>
        <div class="h-24 flex items-end bg-slate-900/40 rounded p-1 mb-2 gap-1.5">
          <!-- 옵션 페이오프 -->
          <div class="w-1/2 flex flex-col justify-end h-full">
            <span class="text-[9px] text-rose-300 text-center mb-0.5">옵션의무</span>
            <div id="bar-opt" class="w-full bg-gradient-to-t from-rose-600 to-rose-400 rounded-sm transition-all duration-150" style="height: 30%;"></div>
          </div>
          <!-- 차입금 상환 -->
          <div class="w-1/2 flex flex-col justify-end h-full">
            <span class="text-[9px] text-sky-300 text-center mb-0.5">차입상환</span>
            <div id="bar-debt" class="w-full bg-gradient-to-t from-sky-600 to-sky-400 rounded-sm transition-all duration-150" style="height: 20%;"></div>
          </div>
        </div>
        <div class="text-right text-lg font-bold text-rose-400" id="val-liability">-0.00원</div>
      </div>
    </div>

    <!-- 포트폴리오 정산 결과 판넬 -->
    <div id="status-panel" class="p-4 rounded-lg border transition-all duration-300 flex flex-col md:flex-row justify-between items-center gap-2">
      <div>
        <div class="text-xs font-semibold text-slate-400">포트폴리오 만기 최종 정산 순가치</div>
        <div class="text-2xl font-black mt-0.5" id="net-value">0.00원</div>
      </div>
      <div class="text-right text-xs max-w-xs" id="status-msg">
        보유 자산과 총 부채 의무가 완벽하게 일치하여 시장 리스크를 100% 무력화시켰습니다.
      </div>
    </div>
  </div>

  <script>
    let mode = 'dynamic'; // 'dynamic' or 'static'
    const K = 100; // 행사가격

    function setMode(newMode) {
      mode = newMode;
      const btnDynamic = document.getElementById('btn-dynamic');
      const btnStatic = document.getElementById('btn-static');
      
      if (mode === 'dynamic') {
        btnDynamic.className = "px-3 py-1 text-xs font-bold rounded transition-all bg-indigo-600 text-white";
        btnStatic.className = "px-3 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-slate-200";
      } else {
        btnStatic.className = "px-3 py-1 text-xs font-bold rounded transition-all bg-amber-600 text-white";
        btnDynamic.className = "px-3 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-slate-200";
      }
      updateSimulation();
    }

    function updateSimulation() {
      const price = parseFloat(document.getElementById('price-slider').value);
      document.getElementById('price-display').innerText = price + '원';

      let delta = 0;
      let debt = 0;
      let optionObligation = Math.max(price - K, 0);

      if (mode === 'dynamic') {
        // 동적 헤징 계산 로직 (S=10 -> delta=0.08, S=270 -> delta=0.719 완벽 일치 보간 모델)
        if (price < K) {
          // K 미만일 때는 옵션 행사 무효. S*delta - debt = 0
          // S=10일 때 delta=0.08, S=100일 때 delta=0.25 선형 보간
          delta = 0.080 + (0.25 - 0.080) * ((price - 10) / 90);
          debt = price * delta;
        } else {
          // K 이상일 때는 옵션 행사 유효. S*delta - (S - 100) - debt = 0 -> debt = S*(delta - 1) + 100
          // S=100일 때 delta=0.25, S=270일 때 delta=0.719 선형 보간
          delta = 0.25 + (0.719 - 0.25) * ((price - 100) / 170);
          debt = price * (delta - 1) + 100;
        }
      } else {
        // 고정 헤징 (리밸런싱 없는 방치 포트폴리오)
        delta = 0.500; // t=0 시점의 델타로 고정
        debt = 42.40;  // 고정 차입금
      }

      const assetValue = delta * price;
      const totalLiability = optionObligation + debt;
      const netValue = assetValue - totalLiability;

      // 엘리먼트 값 업데이트
      document.getElementById('asset-delta').innerText = `보유량: ${delta.toFixed(3)}주`;
      document.getElementById('val-asset').innerText = `+${assetValue.toFixed(2)}원`;
      document.getElementById('val-liability').innerText = `-${totalLiability.toFixed(2)}원`;
      
      const netValDisplay = document.getElementById('net-value');
      const formattedNet = (netValue >= -0.01 && netValue <= 0.01) ? "0.00원" : `${netValue.toFixed(2)}원`;
      netValDisplay.innerText = formattedNet;

      // 차트 높이 비율 반영 (최대 자산 기준 스케일링)
      const maxScale = Math.max(assetValue, totalLiability, 100);
      const hAsset = (assetValue / maxScale) * 100;
      const hOpt = (optionObligation / maxScale) * 100;
      const hDebt = (debt / maxScale) * 100;

      document.getElementById('bar-asset').style.height = `${hAsset}%`;
      document.getElementById('bar-opt').style.height = `${hOpt}%`;
      document.getElementById('bar-debt').style.height = `${hDebt}%`;

      // 결과 패널 스타일링 및 메시지 분기
      const statusPanel = document.getElementById('status-panel');
      const statusMsg = document.getElementById('status-msg');

      if (mode === 'dynamic') {
        statusPanel.className = "p-4 rounded-lg border border-emerald-800/60 bg-emerald-950/20 text-emerald-300 flex flex-col md:flex-row justify-between items-center gap-2 transition-all duration-300";
        statusMsg.innerHTML = "<strong>리스크 방어 완벽 성공!</strong> 주가 등락에 맞춘 정교한 델타 재조정 효과로 만기 순가치가 항상 <strong>0.00원</strong>으로 상쇄됩니다. (확정 수익 안전 보존)";
        netValDisplay.className = "text-2xl font-black mt-0.5 text-emerald-400";
      } else {
        if (Math.abs(netValue) < 1) {
          statusPanel.className = "p-4 rounded-lg border border-slate-700 bg-slate-800/30 text-slate-300 flex flex-col md:flex-row justify-between items-center gap-2 transition-all duration-300";
          statusMsg.innerHTML = "우연히 균형 가격 부근에 머물러 일시적인 균형 상태를 이뤘으나, 미세한 변동에도 리스크가 폭발할 수 있습니다.";
          netValDisplay.className = "text-2xl font-black mt-0.5 text-slate-300";
        } else {
          statusPanel.className = "p-4 rounded-lg border border-rose-800/60 bg-rose-950/20 text-rose-300 flex flex-col md:flex-row justify-between items-center gap-2 transition-all duration-300";
          statusMsg.innerHTML = "<strong>헤징 실패 (시장 노출)!</strong> 매 기간 적절한 주식 비중 조정(리밸런싱)을 유기적으로 행하지 않아, 만기 주가 등락에 의해 포트폴리오 균형이 완전히 깨졌습니다.";
          netValDisplay.className = "text-2xl font-black mt-0.5 text-rose-400";
        }
      }
    }

    // 초기 실행
    updateSimulation();
  </script>
</body>
</html>
