```xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- 필터 (그림자 효과) -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    
    <!-- 화살표 마커 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- 배경 배경판 -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />

  <!-- 제목 영역 -->
  <text x="40" y="45" font-family="'Pretendard', system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">시장 가격 괴리 해소의 동적 피드백 메커니즘</text>
  <text x="40" y="68" font-family="'Pretendard', system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">차익거래자들의 진입이 일물일가의 법칙을 구현하는 과정</text>

  <!-- 중앙 1단계: 시장 불균형 발생 -->
  <g filter="url(#shadow)">
    <rect x="270" y="90" width="300" height="70" rx="12" fill="url(#amberGrad)" />
    <text x="420" y="118" font-family="'Pretendard', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">시장 가격 과대평가 (Mispricing)</text>
    <text x="420" y="140" font-family="'Pretendard', system-ui, sans-serif" font-size="13" font-weight="500" fill="#fef3c7" text-anchor="middle">C_market (36.00) &gt; C_theory (34.065)</text>
  </g>

  <!-- 아래 방향 화살표 -->
  <path d="M 420 160 L 420 200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- 2단계: 차익거래자 진입 -->
  <g filter="url(#shadow)">
    <rect x="230" y="210" width="380" height="60" rx="12" fill="url(#slateGrad)" />
    <text x="420" y="235" font-family="'Pretendard', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">차익거래자의 포지션 구축 (Arbitrage Entry)</text>
    <text x="420" y="255" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">고평가 자산 매도 &amp; 복제 포트폴리오(델타 주식) 매수</text>
  </g>

  <!-- 양 갈래 하방 화살표 -->
  <path d="M 380 270 L 220 315" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 460 270 L 620 315" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- 3단계 좌측: 콜옵션 대량 매도 -->
  <g filter="url(#shadow)">
    <rect x="50" y="325" width="310" height="75" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="50" y="325" width="8" height="75" rx="10" fill="#3b82f6" />
    <text x="75" y="348" font-family="'Pretendard', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">1. 콜옵션 시장 매도 (Short Call)</text>
    <text x="75" y="368" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">매도 쏠림에 의한 가격 하락 압력 작용</text>
    <text x="75" y="386" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">C_market ───&gt; 하향 안정화</text>
  </g>

  <!-- 3단계 우측: 주식 대량 매수 -->
  <g filter="url(#shadow)">
    <rect x="480" y="325" width="310" height="75" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <rect x="782" y="325" width="8" height="75" rx="10" fill="#10b981" />
    <text x="495" y="348" font-family="'Pretendard', system-ui, sans-serif" font-size="13" font-weight="700" fill="#064e3b">2. 기초자산 델타 매수 (Long Stock)</text>
    <text x="495" y="368" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">현물 주식의 대량 매수 압력 작용</text>
    <text x="495" y="386" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">기초자산 주가 $S$ 상승 압력</text>
  </g>

  <!-- 순환 피드백 루프 라인 (좌우에서 중앙 상단 mispricing으로 귀환하는 점선) -->
  <path d="M 205 325 C 205 130, 260 130, 260 130" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 635 325 C 635 130, 580 130, 580 130" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 최종 균형 마크 -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="362" r="28" fill="url(#emeraldGrad)" />
    <text x="420" y="366" font-family="'Pretendard', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">수렴</text>
  </g>
</svg>
```