<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3단계 이항 트리 인터랙티브 시각화</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .node-circle {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .node-circle:hover {
      transform: scale(1.25);
      filter: drop-shadow(0 4px 6px rgba(99, 102, 241, 0.4));
    }
    .path-line {
      transition: stroke-width 0.2s, stroke 0.2s;
    }
    .active-path {
      stroke: #6366f1 !important;
      stroke-width: 4px !important;
    }
    .active-node {
      fill: #6366f1 !important;
      stroke: #4f46e5 !important;
      stroke-width: 3px !important;
    }
  </style>
</head>
<body class="bg-slate-50 p-4 flex flex-col items-center justify-center min-h-[500px]">

  <div class="bg-white rounded-2xl shadow-sm border border-slate-150 p-6 w-full max-w-4xl">
    <!-- Header -->
    <div class="mb-4 text-center">
      <h2 class="text-lg font-bold text-slate-800">3단계 이항 주가 트리 ($n=3$)</h2>
      <p class="text-sm text-slate-500">노드에 마우스를 올리면 해당 시점의 주가 계산 공식과 경로가 실시간으로 표시됩니다.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-6 items-center">
      <!-- SVG Canvas -->
      <div class="relative flex-1 w-full bg-slate-50 rounded-xl p-2 border border-slate-100 flex justify-center">
        <svg id="tree-svg" viewBox="0 0 750 360" class="w-full h-auto max-h-[340px]">
          <!-- Connections will be drawn here -->
          <g id="links-group"></g>
          <!-- Nodes will be drawn here -->
          <g id="nodes-group"></g>
        </svg>
      </div>

      <!-- Detail Card -->
      <div class="w-full md:w-64 bg-slate-50 border border-slate-150 rounded-xl p-5 flex flex-col justify-between self-stretch">
        <div>
          <span class="text-xs font-semibold text-indigo-600 tracking-wider uppercase block mb-1">노드 상세 정보</span>
          <h3 id="info-node-id" class="text-xl font-black text-slate-800 mb-2">t = 0 (시작점)</h3>
          
          <div class="space-y-3 text-sm text-slate-600">
            <div>
              <span class="text-slate-400 block text-xs">현재 노드 주가</span>
              <span id="info-price" class="text-lg font-bold text-slate-900">80.0</span>
            </div>
            <div>
              <span class="text-slate-400 block text-xs">도달 경로 수순</span>
              <span id="info-path" class="font-mono bg-white px-2 py-0.5 rounded border border-slate-200 inline-block text-xs mt-0.5">- (Initial)</span>
            </div>
            <div>
              <span class="text-slate-400 block text-xs">수학적 연산식</span>
              <span id="info-formula" class="text-xs font-mono text-indigo-700 block mt-1">S₀ = 80</span>
            </div>
          </div>
        </div>

        <div class="mt-4 pt-4 border-t border-slate-200 text-xs text-slate-400">
          기본 설정: <br>
          S₀ = 80, u = 1.5, d = 0.5
        </div>
      </div>
    </div>
  </div>

  <script>
    // 이항 트리 데이터 구조 정의
    const S0 = 80;
    const u = 1.5;
    const d = 0.5;

    // 노드 위치 정의 (x, y)
    // t=0: [0,0]
    // t=1: [1,0](u), [1,1](d)
    // t=2: [2,0](uu), [2,1](ud/du), [2,2](dd)
    // t=3: [3,0](uuu), [3,1](uud...), [3,2](udd...), [3,3](ddd)
    const nodes = [
      { id: "n_0_0", t: 0, k: 0, label: "S₀", x: 80, y: 180, price: S0, path: "Initial", formula: "80" },

      { id: "n_1_0", t: 1, k: 1, label: "S₁_u", x: 260, y: 100, price: S0 * u, path: "u (상승)", formula: "80 × 1.5 = 120" },
      { id: "n_1_1", t: 1, k: 0, label: "S₁_d", x: 260, y: 260, price: S0 * d, path: "d (하락)", formula: "80 × 0.5 = 40" },

      { id: "n_2_0", t: 2, k: 2, label: "S₂_uu", x: 440, y: 50, price: S0 * u * u, path: "uu (상승-상승)", formula: "80 × 1.5² = 180" },
      { id: "n_2_1", t: 2, k: 1, label: "S₂_ud", x: 440, y: 180, price: S0 * u * d, path: "ud / du (교차)", formula: "80 × 1.5¹ × 0.5¹ = 60" },
      { id: "n_2_2", t: 2, k: 0, label: "S₂_dd", x: 440, y: 310, price: S0 * d * d, path: "dd (하락-하락)", formula: "80 × 0.5² = 20" },

      { id: "n_3_0", t: 3, k: 3, label: "S₃_uuu", x: 620, y: 30, price: S0 * u * u * u, path: "uuu (상승 3회)", formula: "80 × 1.5³ = 270" },
      { id: "n_3_1", t: 3, k: 2, label: "S₃_uud", x: 620, y: 130, price: S0 * u * u * d, path: "uud / udu / duu (상승 2회, 하락 1회)", formula: "80 × 1.5² × 0.5¹ = 90" },
      { id: "n_3_2", t: 3, k: 1, label: "S₃_udd", x: 620, y: 230, price: S0 * u * d * d, path: "udd / dud / ddu (상승 1회, 하락 2회)", formula: "80 × 1.5¹ × 0.5² = 30" },
      { id: "n_3_3", t: 3, k: 0, label: "S₃_ddd", x: 620, y: 330, price: S0 * d * d * d, path: "ddd (하락 3회)", formula: "80 × 0.5³ = 10" }
    ];

    // 링크(선) 정보 정의
    const links = [
      { from: "n_0_0", to: "n_1_0", type: "u" },
      { from: "n_0_0", to: "n_1_1", type: "d" },
      { from: "n_1_0", to: "n_2_0", type: "u" },
      { from: "n_1_0", to: "n_2_1", type: "d" },
      { from: "n_1_1", to: "n_2_1", type: "u" },
      { from: "n_1_1", to: "n_2_2", type: "d" },
      { from: "n_2_0", to: "n_3_0", type: "u" },
      { from: "n_2_0", to: "n_3_1", type: "d" },
      { from: "n_2_1", to: "n_3_1", type: "u" },
      { from: "n_2_1", to: "n_3_2", type: "d" },
      { from: "n_2_2", to: "n_3_2", type: "u" },
      { from: "n_2_2", to: "n_3_3", type: "d" }
    ];

    const svg = document.getElementById('tree-svg');
    const linksGroup = document.getElementById('links-group');
    const nodesGroup = document.getElementById('nodes-group');

    // 링크 그리기
    links.forEach(link => {
      const fromNode = nodes.find(n => n.id === link.from);
      const toNode = nodes.find(n => n.id === link.to);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', fromNode.x);
      line.setAttribute('y1', fromNode.y);
      line.setAttribute('x2', toNode.x);
      line.setAttribute('y2', toNode.y);
      line.setAttribute('stroke', '#cbd5e1');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('class', 'path-line');
      line.setAttribute('id', `link-${link.from}-${link.to}`);
      linksGroup.appendChild(line);

      // 텍스트 기호 (u, d 표시)
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', (fromNode.x + toNode.x) / 2);
      text.setAttribute('y', (fromNode.y + toNode.y) / 2 - 6);
      text.setAttribute('fill', link.type === 'u' ? '#10b981' : '#f43f5e');
      text.setAttribute('font-size', '11px');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('text-anchor', 'middle');
      text.textContent = link.type;
      linksGroup.appendChild(text);
    });

    // 노드 그리기
    nodes.forEach(node => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'cursor-pointer');
      
      // 원형
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', node.x);
      circle.setAttribute('cy', node.y);
      circle.setAttribute('r', '20');
      circle.setAttribute('fill', '#ffffff');
      circle.setAttribute('stroke', '#64748b');
      circle.setAttribute('stroke-width', '2');
      circle.setAttribute('class', 'node-circle');
      circle.setAttribute('id', `circle-${node.id}`);
      
      // 텍스트 (주가 정보 요약)
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', node.x);
      text.setAttribute('y', node.y + 4);
      text.setAttribute('fill', '#1e293b');
      text.setAttribute('font-size', '10px');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('text-anchor', 'middle');
      text.textContent = Math.round(node.price);

      // 시간 레이블 (t=0, t=1 등 표시)
      if (node.id === "n_0_0" || node.id === "n_1_1" || node.id === "n_2_2" || node.id === "n_3_3") {
        const timeLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        timeLabel.setAttribute('x', node.x);
        timeLabel.setAttribute('y', 355);
        timeLabel.setAttribute('fill', '#94a3b8');
        timeLabel.setAttribute('font-size', '11px');
        timeLabel.setAttribute('font-weight', 'bold');
        timeLabel.setAttribute('text-anchor', 'middle');
        timeLabel.textContent = `t = ${node.t}`;
        svg.appendChild(timeLabel);
      }

      g.appendChild(circle);
      g.appendChild(text);

      // 마우스 오버/아웃 인터랙션 설정
      g.addEventListener('mouseenter', () => handleNodeHover(node));
      g.addEventListener('mouseleave', () => resetHighlights());

      nodesGroup.appendChild(g);
    });

    // 노드 오버 핸들러
    function handleNodeHover(node) {
      // 정보 업데이트
      document.getElementById('info-node-id').textContent = `t = ${node.t} 시점`;
      document.getElementById('info-price').textContent = `${node.price.toFixed(1)} 원`;
      document.getElementById('info-path').textContent = node.path;
      document.getElementById('info-formula').textContent = node.formula;

      // 대상 서클 및 연결선 하이라이트
      document.getElementById(`circle-${node.id}`).classList.add('active-node');
      
      // 역방향으로 해당 노드로 가는 경로 탐색 및 하이라이트
      highlightPathsToRoot(node.id);
    }

    function highlightPathsToRoot(nodeId) {
      let currentId = nodeId;
      while (currentId !== "n_0_0") {
        const link = links.find(l => l.to === currentId);
        if (!link) break;
        
        const lineEl = document.getElementById(`link-${link.from}-${link.to}`);
        if (lineEl) {
          lineEl.classList.add('active-path');
        }
        
        const parentCircle = document.getElementById(`circle-${link.from}`);
        if (parentCircle) {
          parentCircle.style.stroke = "#818cf8";
        }
        currentId = link.from;
      }
    }

    // 하이라이트 전체 해제
    function resetHighlights() {
      document.querySelectorAll('.node-circle').forEach(el => {
        el.classList.remove('active-node');
        el.style.stroke = "#64748b";
      });
      document.querySelectorAll('.path-line').forEach(el => {
        el.classList.remove('active-path');
      });
    }

    // 기본 최초 상태 세팅
    handleNodeHover(nodes[0]);
    resetHighlights();
  </script>
</body>
</html>
