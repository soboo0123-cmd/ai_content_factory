<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>차익거래 균형 저울 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
    .scale-beam {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 p-6 flex flex-col items-center justify-center min-h-[500px]">

  <div class="w-full max-w-4xl bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-2xl">
    
    <!-- Title Section -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold text-blue-400">차익거래 균형 저울 시뮬레이터</h1>
      <p class="text-sm text-slate-400 mt-1">시장 옵션 가격과 동적 복제 비용 간의 괴리가 유발하는 평형 압력을 직접 체험해 보세요.</p>
    </div>

    <!-- main Simulation Playground -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
      
      <!-- Left: Interactive Sliders -->
      <div class="md:col-span-5 bg-slate-850 p-4 rounded-xl border border-slate-700/50 space-y-5">
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-bold text-rose-400 flex items-center">
              <span class="w-2.5 h-2.5 bg-rose-500 rounded-full mr-1.5 animate-pulse"></span>
              시장 옵션 가격 (<span class="font-mono">C<sub>market</sub></span>)
            </span>
            <span id="marketVal" class="text-lg font-mono font-black text-rose-400">12.0 원</span>
          </div>
          <input id="marketSlider" type="range" min="5" max="15" step="0.1" value="12" 
                 class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-rose-500">
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span>극단적 저평가 (5원)</span>
            <span>극단적 고평가 (15원)</span>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-bold text-blue-400">이론적 복제 포트폴리오 비용</span>
            <span id="repVal" class="text-lg font-mono font-black text-blue-400">10.0 원</span>
          </div>
          <div class="space-y-2 bg-slate-900/50 p-3 rounded-lg border border-slate-800">
            <div class="flex justify-between text-xs text-slate-400">
              <span>기초자산 주가 (S):</span>
              <span class="font-mono text-slate-300">100 원</span>
            </div>
            <div class="flex justify-between text-xs text-slate-400">
              <span>헤지 비율 (Δ):</span>
              <span class="font-mono text-slate-300">0.50</span>
            </div>
            <div class="flex justify-between text-xs text-slate-400">
              <span>차입금 잔액 (B):</span>
              <span class="font-mono text-slate-300">40.0 원</span>
            </div>
            <div class="border-t border-slate-800 pt-1 flex justify-between text-xs font-bold text-blue-300">
              <span>수식: Δ · S - B</span>
              <span>0.5·100 - 40 = 10 원</span>
            </div>
          </div>
        </div>

        <!-- Action Button -->
        <button id="arbitrageBtn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold rounded-xl shadow-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"></path>
          </svg>
          차익거래 매매 작동 (시장안정화)
        </button>
      </div>

      <!-- Right: Interactive Balancing Scale Graphics -->
      <div class="md:col-span-7 flex flex-col items-center justify-center bg-slate-900/40 p-4 rounded-xl border border-slate-700/30 min-h-[300px] relative overflow-hidden">
        
        <!-- Status Banner -->
        <div id="statusBanner" class="absolute top-3 left-3 right-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold transition-all">
          균형 상태
        </div>

        <!-- The Scale Container -->
        <div class="w-full flex flex-col items-center mt-8 relative">
          <!-- Balance Beam (Rotates based on price difference) -->
          <div id="beam" class="scale-beam w-80 h-2 bg-slate-400 rounded-full relative flex justify-between items-center px-4" style="transform: rotate(0deg); transform-origin: center center;">
            
            <!-- Left Pan (Market Option) -->
            <div class="absolute -left-8 -top-16 flex flex-col items-center w-24">
              <!-- Rope hanger -->
              <svg class="w-16 h-16 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M12 2L4 18h16L12 2z"></path>
              </svg>
              <div class="bg-rose-500 text-white font-mono font-black text-xs py-1 px-2.5 rounded-md shadow-md -mt-2">
                시장가
              </div>
            </div>

            <!-- Right Pan (Replicating Cost) -->
            <div class="absolute -right-8 -top-16 flex flex-col items-center w-24">
              <!-- Rope hanger -->
              <svg class="w-16 h-16 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M12 2L4 18h16L12 2z"></path>
              </svg>
              <div class="bg-blue-500 text-white font-mono font-black text-xs py-1 px-2.5 rounded-md shadow-md -mt-2">
                이론가
              </div>
            </div>
            
          </div>

          <!-- Stand Base -->
          <div class="w-4 h-32 bg-gradient-to-b from-slate-500 to-slate-700 -mt-1"></div>
          <div class="w-32 h-4 bg-slate-600 rounded-t-lg shadow-md"></div>
        </div>

        <!-- Profit Dashboard -->
        <div class="w-full mt-4 bg-slate-800/80 p-3 rounded-lg border border-slate-750 text-center">
          <div class="text-[11px] text-slate-400 uppercase tracking-widest font-bold">실시간 차익거래 포착 기회</div>
          <div id="arbitrageProfit" class="text-2xl font-black text-emerald-400 font-mono mt-1">0.00 원</div>
          <div id="actionText" class="text-[11px] text-slate-300 mt-1">가격 왜곡이 없어 차익거래 기회가 존재하지 않습니다.</div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const marketSlider = document.getElementById('marketSlider');
    const marketVal = document.getElementById('marketVal');
    const beam = document.getElementById('beam');
    const statusBanner = document.getElementById('statusBanner');
    const arbitrageProfit = document.getElementById('arbitrageProfit');
    const actionText = document.getElementById('actionText');
    const arbitrageBtn = document.getElementById('arbitrageBtn');

    const THEORETICAL_PRICE = 10.0;
    let isAnimating = false;

    function updateSimulation() {
      if (isAnimating) return;
      
      const marketPrice = parseFloat(marketSlider.value);
      marketVal.textContent = marketPrice.toFixed(1) + ' 원';

      const gap = marketPrice - THEORETICAL_PRICE;
      
      // Rotate beam based on gap. Max 25 degrees.
      const angle = Math.min(Math.max(gap * 4.5, -22), 22);
      beam.style.transform = `rotate(${angle}deg)`;

      // Update banner and profit text
      if (Math.abs(gap) < 0.15) {
        statusBanner.className = "absolute top-3 left-3 right-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-slate-700 text-slate-300";
        statusBanner.textContent = "시장 평형 (No-Arbitrage Equilibrium)";
        arbitrageProfit.className = "text-2xl font-black text-slate-400 font-mono mt-1";
        arbitrageProfit.textContent = "0.00 원";
        actionText.textContent = "시장 가격이 가치와 일치합니다. 차익거래 기회 없음.";
        arbitrageBtn.disabled = true;
        arbitrageBtn.style.opacity = 0.5;
      } else if (gap > 0) {
        statusBanner.className = "absolute top-3 left-3 right-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
        statusBanner.textContent = "시장 과열: 콜옵션 고평가 상태";
        arbitrageProfit.className = "text-2xl font-black text-rose-400 font-mono mt-1";
        arbitrageProfit.textContent = `+${gap.toFixed(2)} 원 무위험 이익`;
        actionText.innerHTML = `<strong>차익거래 전략:</strong> 비싼 콜옵션 <span class='text-rose-400 font-bold'>매도</span> & 동적 복제 포트폴리오 <span class='text-blue-400 font-bold'>매수</span>`;
        arbitrageBtn.disabled = false;
        arbitrageBtn.style.opacity = 1;
      } else {
        statusBanner.className = "absolute top-3 left-3 right-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        statusBanner.textContent = "시장 냉각: 콜옵션 저평가 상태";
        arbitrageProfit.className = "text-2xl font-black text-emerald-400 font-mono mt-1";
        arbitrageProfit.textContent = `+${Math.abs(gap).toFixed(2)} 원 무위험 이익`;
        actionText.innerHTML = `<strong>차익거래 전략:</strong> 싼 콜옵션 <span class='text-emerald-400 font-bold'>매수</span> & 동적 복제 포트폴리오 <span class='text-blue-400 font-bold'>매도</span>`;
        arbitrageBtn.disabled = false;
        arbitrageBtn.style.opacity = 1;
      }
    }

    // Interactive adjustment
    marketSlider.addEventListener('input', updateSimulation);

    // Simulate Market Convergence Process (Feedback Loop Animation)
    arbitrageBtn.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;
      arbitrageBtn.disabled = true;
      marketSlider.disabled = true;

      let interval = setInterval(() => {
        let marketPrice = parseFloat(marketSlider.value);
        let gap = marketPrice - THEORETICAL_PRICE;

        if (Math.abs(gap) < 0.1) {
          marketSlider.value = THEORETICAL_PRICE;
          clearInterval(interval);
          isAnimating = false;
          marketSlider.disabled = false;
          updateSimulation();
        } else {
          // Move 35% closer to equilibrium every tick
          marketSlider.value = (marketPrice - gap * 0.35).toFixed(2);
          updateSimulation();
        }
      }, 100);
    });

    // Initial run
    updateSimulation();
  </script>
</body>
</html>
