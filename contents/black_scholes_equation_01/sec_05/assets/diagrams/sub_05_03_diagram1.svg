<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-discrete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="grad-control" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="grad-continuous" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    
    <!-- Cutting Plane Grid Fill (Perspective) -->
    <pattern id="grid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0.15" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#0B0F19" rx="16" />
  
  <!-- Subtle Background Tech Orbs -->
  <g opacity="0.03">
    <circle cx="200" cy="225" r="300" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,8" />
    <circle cx="450" cy="225" r="250" fill="none" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="700" cy="225" r="300" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="10,5" />
  </g>

  <!-- ==================== 1. DISCRETE JUMP (LEFT) ==================== -->
  <g transform="translate(30, 40)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="260" height="370" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect width="260" height="48" rx="12" fill="#EF4444" opacity="0.1" />
    <line x1="0" y1="48" x2="260" y2="48" stroke="#EF4444" stroke-width="1" opacity="0.3" />
    
    <text x="130" y="28" fill="#F87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">이산적 도약 (고정 매개변수)</text>
    <text x="130" y="42" fill="#9CA3AF" font-size="10" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">비동조적 자산 단계의 급격한 팽창</text>

    <!-- Visual Metaphor: Exploding / Tearing lattice -->
    <g transform="translate(0, 40)">
      <!-- Divergent Bounds (Red Glow) -->
      <path d="M 50 160 L 230 40" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />
      <path d="M 50 160 L 230 280" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />

      <!-- Exploding Tree Paths -->
      <g stroke="#F87171" stroke-linecap="round" fill="none">
        <!-- Main Trunk -->
        <path d="M 40 160 L 90 160" stroke-width="2.5" />
        <!-- Level 1 Split -->
        <path d="M 90 160 L 140 110" stroke-width="2" />
        <path d="M 90 160 L 140 210" stroke-width="2" />
        <!-- Level 2 Split (Tearing outward) -->
        <path d="M 140 110 L 190 50" stroke-width="1.5" stroke-dasharray="2,2" />
        <path d="M 140 110 L 190 170" stroke-width="1.5" />
        <path d="M 140 210 L 190 150" stroke-width="1.5" />
        <path d="M 140 210 L 190 270" stroke-width="1.5" stroke-dasharray="2,2" />
        
        <!-- Out of Boundary Exploding Arrows (Shattering effect) -->
        <g stroke="#EF4444" stroke-width="3">
          <path d="M 190 50 L 245 0" marker-end="url(#arrow)" />
          <path d="M 190 270 L 245 320" marker-end="url(#arrow)" />
        </g>
      </g>

      <!-- Nodes -->
      <circle cx="90" cy="160" r="5" fill="#EF4444" />
      <circle cx="140" cy="110" r="4" fill="#EF4444" />
      <circle cx="140" cy="210" r="4" fill="#EF4444" />
      <circle cx="190" cy="50" r="3" fill="#EF4444" />
      <circle cx="190" cy="170" r="3" fill="#EF4444" />
      <circle cx="190" cy="150" r="3" fill="#EF4444" />
      <circle cx="190" cy="270" r="3" fill="#EF4444" />

      <!-- Explosion Warning Indicator -->
      <g transform="translate(210, 140)">
        <polygon points="15,0 30,26 0,26" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5" />
        <text x="15" y="21" fill="#F87171" font-size="16" font-weight="bold" text-anchor="middle">!</text>
      </g>
    </g>

    <!-- Descriptive Labels -->
    <text x="130" y="315" fill="#FCA5A5" font-size="12" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">분산 무한 발산 (σ² → ∞)</text>
    <text x="130" y="335" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">제어 불능 격자팽창 (화면 이탈)</text>
  </g>

  <!-- Connection Arrow 1 -->
  <g transform="translate(295, 215)" fill="none" stroke="url(#arrow-grad)" stroke-width="3">
    <path d="M 0 0 L 20 0" />
    <path d="M 15 -5 L 20 0 L 15 5" fill="none" stroke-linecap="round" />
  </g>

  <!-- ==================== 2. TIME-SCALING (MIDDLE) ==================== -->
  <g transform="translate(320, 40)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="260" height="370" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect width="260" height="48" rx="12" fill="#3B82F6" opacity="0.1" />
    <line x1="0" y1="48" x2="260" y2="48" stroke="#3B82F6" stroke-width="1" opacity="0.3" />

    <text x="130" y="28" fill="#60A5FA" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">시간의 동적 제어 (완충)</text>
    <text x="130" y="42" fill="#9CA3AF" font-size="10" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">정밀 가공 작업을 통한 보폭 통제</text>

    <!-- Precision Machining & Controlled Tree -->
    <g transform="translate(0, 40)">
      <!-- Precision Machining Bounds (Envelope curves y = ±σ√t) -->
      <path d="M 40 160 Q 130 90 220 105" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
      <path d="M 40 160 Q 130 230 220 215" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

      <!-- Controlled Denser Tree -->
      <g stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M 40 160 L 80 160" />
        <!-- Level 1 -->
        <path d="M 80 160 L 120 140" />
        <path d="M 80 160 L 120 180" />
        <!-- Level 2 (Slightly narrower step height) -->
        <path d="M 120 140 L 160 125" />
        <path d="M 120 140 L 160 155" />
        <path d="M 120 180 L 160 165" />
        <path d="M 120 180 L 160 195" />
        <!-- Level 3 (Denser, micro steps) -->
        <path d="M 160 125 L 200 115" />
        <path d="M 160 125 L 200 135" />
        <path d="M 160 155 L 200 145" />
        <path d="M 160 155 L 200 165" />
        <path d="M 160 195 L 200 185" />
        <path d="M 160 195 L 200 205" />
      </g>

      <!-- Caliper Measurement (Precision metaphor) -->
      <g stroke="#38BDF8" stroke-width="1" opacity="0.8">
        <!-- Vertical caliper bar -->
        <line x1="225" y1="105" x2="225" y2="215" />
        <!-- Caliper ticks -->
        <line x1="220" y1="105" x2="230" y2="105" />
        <line x1="220" y1="215" x2="230" y2="215" />
        <line x1="220" y1="160" x2="230" y2="160" stroke-dasharray="2,2" />
      </g>
      <!-- Caliper formula text -->
      <rect x="135" y="65" width="105" height="24" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
      <text x="187" y="81" fill="#38BDF8" font-size="10" font-weight="bold" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">u,d = e^(±σ√Δt)</text>
    </g>

    <!-- Descriptive Labels -->
    <text x="130" y="315" fill="#93C5FD" font-size="12" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">동적 보폭 완충 (n·Δt = t)</text>
    <text x="130" y="335" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">격자 높이·폭의 정교한 깎임 제어</text>
  </g>

  <!-- Connection Arrow 2 -->
  <g transform="translate(585, 215)" fill="none" stroke="url(#arrow-grad)" stroke-width="3">
    <path d="M 0 0 L 20 0" />
    <path d="M 15 -5 L 20 0 L 15 5" fill="none" stroke-linecap="round" />
  </g>

  <!-- ==================== 3. CONTINUOUS FLOW (RIGHT) ==================== -->
  <g transform="translate(610, 40)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="260" height="370" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect width="260" height="48" rx="12" fill="#10B981" opacity="0.1" />
    <line x1="0" y1="48" x2="260" y2="48" stroke="#10B981" stroke-width="1" opacity="0.3" />

    <text x="130" y="28" fill="#34D399" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">연속 확률 과정으로의 합일</text>
    <text x="130" y="42" fill="#9CA3AF" font-size="10" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">미끄럼틀의 아름다운 로그정규분포 단면</text>

    <!-- Smooth Slide & Projected Bell Curve -->
    <g transform="translate(10, 50)">
      
      <!-- 3D Grid Slide Track (Perspective mesh) -->
      <path d="M 40 180 C 80 180, 100 110, 130 110 L 170 125 C 140 125, 120 195, 80 195 Z" fill="url(#grad-continuous)" opacity="0.15" />
      
      <!-- Slide Rails (Representing smooth continuous limit of step staircase) -->
      <path d="M 30 185 C 70 185, 90 115, 120 115" fill="none" stroke="#047857" stroke-width="1.5" opacity="0.5" />
      <path d="M 50 195 C 90 195, 110 125, 140 125" fill="none" stroke="#047857" stroke-width="1.5" opacity="0.5" />

      <!-- The Cutting Slice Plane (가상의 절단 평면) -->
      <polygon points="110,70 230,85 210,240 90,225" fill="#1F2937" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />
      <text x="195" y="95" fill="#34D399" font-size="9" font-family="'Inter', system-ui, sans-serif" opacity="0.8">단면 (Slice)</text>

      <!-- Projected Beautiful Bell Curve (Lognormal Distribution) on the cutting plane -->
      <!-- Shading -->
      <path d="M 110 215 C 130 215, 145 100, 160 100 C 175 100, 185 215, 205 215 Z" fill="#10B981" opacity="0.25" />
      <!-- Stroke -->
      <path d="M 110 215 C 130 215, 145 100, 160 100 C 175 100, 185 215, 205 215" fill="none" stroke="#34D399" stroke-width="3" />
      
      <!-- Mean Axis -->
      <line x1="160" y1="215" x2="160" y2="100" stroke="#A7F3D0" stroke-dasharray="2,2" stroke-width="1" />

      <!-- Miniature sliding ball -->
      <circle cx="75" cy="155" r="5" fill="#34D399" filter="drop-shadow(0px 0px 4px #10B981)" />
      <path d="M 85 145 L 95 135" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow)" />
    </g>

    <!-- Descriptive Labels -->
    <text x="130" y="315" fill="#A7F3D0" font-size="12" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">매끄러운 미끄럼틀 효과</text>
    <text x="130" y="335" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif">단면: 자산의 로그정규분포 수렴</text>
  </g>
</svg>