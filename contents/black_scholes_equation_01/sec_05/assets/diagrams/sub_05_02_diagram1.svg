<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- 배경색 정의 -->
  <rect width="800" height="400" fill="#0f172a" rx="12" />

  <!-- 격자 가이드라인 (선택사항, 테크니컬 느낌) -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4">
    <line x1="400" y1="20" x2="400" y2="380" />
    <line x1="40" y1="200" x2="760" y2="200" />
  </g>

  <!-- 테두리 -->
  <rect x="5" y="5" width="790" height="390" fill="none" stroke="#334155" stroke-width="2" rx="10" />

  <!-- 왼쪽: 확률의 저울 (기댓값 및 분산의 원리) -->
  <g transform="translate(0, 0)">
    <text x="200" y="50" fill="#f8fafc" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1. 확률의 저울 (기댓값 &amp; 분산)</text>
    
    <!-- 지점 받침대 -->
    <polygon points="200,240 180,280 220,280" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    
    <!-- 시소 대 (기울어짐 표현: 상승 쪽이 조금 무거운 느낌으로 살짝 기울임) -->
    <!-- 회전 중심 (200, 240) 기준으로 -8도 회전 -->
    <g transform="rotate(-8, 200, 240)">
      <!-- 시소 판 -->
      <line x1="60" y1="240" x2="340" y2="240" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
      
      <!-- 왼쪽 무게추 (Down, ln d) -->
      <g transform="translate(100, 240)">
        <rect x="-30" y="-40" width="60" height="40" fill="#ef4444" rx="4" opacity="0.85" />
        <text x="0" y="-18" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ln d</text>
        <text x="0" y="18" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">확률: 1-q</text>
      </g>
      
      <!-- 오른쪽 무게추 (Up, ln u) -->
      <g transform="translate(300, 240)">
        <rect x="-30" y="-50" width="60" height="50" fill="#10b981" rx="4" opacity="0.85" />
        <text x="0" y="-23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ln u</text>
        <text x="0" y="18" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">확률: q</text>
      </g>
      
      <!-- 흔들림 폭 표시 (ln(u/d)) -->
      <path d="M 100,-60 L 300,-60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <text x="200" y="-68" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">거리: ln(u/d) [변동성 결정]</text>
    </g>
    
    <!-- 무게 중심 기댓값 표시 -->
    <circle cx="185" cy="242" r="5" fill="#f59e0b" />
    <path d="M 185,242 L 185,310" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="185" y="325" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">기댓값 μ̂</text>
  </g>

  <!-- 오른쪽: 발산하는 격자 (시간 보정의 유무 대조) -->
  <g transform="translate(400, 0)">
    <text x="200" y="50" fill="#f8fafc" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2. 통제력을 잃고 발산하는 격자</text>
    
    <!-- 이항 격자 중심축선 -->
    <line x1="50" y1="200" x2="350" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,2" />
    
    <!-- 발산하는 격자망 외곽 나팔선 (보정 없을 때의 폭주) -->
    <path d="M 50,200 Q 150,140 350,50" fill="none" stroke="#ef4444" stroke-width="3" />
    <path d="M 50,200 Q 150,260 350,350" fill="none" stroke="#ef4444" stroke-width="3" />
    
    <!-- 올바른 수렴 대역 (시간 보정이 ON 일 때의 차분한 한계선) -->
    <path d="M 50,200 Q 150,170 350,130" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 50,200 Q 150,230 350,270" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />

    <!-- 격자 노드들 및 연결선 (예시적으로 폭주하는 이산 격자 표현) -->
    <!-- 노드 t0 -->
    <circle cx="50" cy="200" r="4" fill="#64748b" />
    
    <!-- 노드 t1 -->
    <line x1="50" y1="200" x2="110" y2="160" stroke="#f43f5e" stroke-width="1" />
    <line x1="50" y1="200" x2="110" y2="240" stroke="#f43f5e" stroke-width="1" />
    <circle cx="110" cy="160" r="3.5" fill="#ef4444" />
    <circle cx="110" cy="240" r="3.5" fill="#ef4444" />

    <!-- 노드 t2 -->
    <line x1="110" y1="160" x2="180" y2="120" stroke="#f43f5e" stroke-width="1" />
    <line x1="110" y1="160" x2="180" y2="190" stroke="#f43f5e" stroke-width="1" />
    <line x1="110" y1="240" x2="180" y2="210" stroke="#f43f5e" stroke-width="1" />
    <line x1="110" y1="240" x2="180" y2="280" stroke="#f43f5e" stroke-width="1" />
    <circle cx="180" cy="120" r="3" fill="#ef4444" />
    <circle cx="180" cy="280" r="3" fill="#ef4444" />

    <!-- 무한 발산 유도 텍스트 표기 -->
    <g transform="translate(340, 200)">
      <text x="15" y="-60" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start">보정 OFF: 무한 발산 (σ² → ∞)</text>
      <text x="15" y="60" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start">보정 ON: 일정한 분산 수렴</text>
    </g>

    <!-- 화살표 및 표시기 -->
    <path d="M 330,85 L 330,120" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />
    <path d="M 330,315 L 330,280" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />
  </g>

  <!-- 마커 정의 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
</svg>