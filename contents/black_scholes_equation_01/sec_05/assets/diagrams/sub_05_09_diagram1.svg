<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Definitions of gradients and markers -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Left Box Gradient (Asset) -->
    <linearGradient id="assetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Right Box Gradient (Debt) -->
    <linearGradient id="debtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Central Option Gradient -->
    <linearGradient id="optionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <filterRes subregion-width="1024" subregion-height="1024"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Outer Border -->
  <rect x="15" y="15" width="770" height="420" fill="none" stroke="#334155" stroke-width="2" rx="10"/>

  <!-- TITLE -->
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    블랙-숄즈 복제 포트폴리오의 구조와 자금 흐름
  </text>
  <text x="400" y="68" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400">
    동적 헤징(Dynamic Hedging)을 통한 무위험 결합구조의 수학적 정체성
  </text>

  <!-- LINE Dividers (Grid style) -->
  <line x1="100" y1="210" x2="700" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 1. LEFT CONTAINER: ASSET COMPONENT -->
  <g transform="translate(80, 110)" filter="url(#shadow)">
    <rect width="210" height="200" fill="url(#assetGrad)" rx="8"/>
    <rect width="210" height="200" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    
    <!-- Title Area inside left container -->
    <rect x="0" y="0" width="210" height="45" fill="#0c4a6e" rx="8" clip-path="inset(0 0 155 0)"/>
    <text x="105" y="28" text-anchor="middle" fill="#e0f2fe" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700">
      기초자산 주식 매수분 (Asset)
    </text>

    <!-- Formula -->
    <rect x="25" y="65" width="160" height="36" fill="#082f49" rx="6"/>
    <text x="105" y="88" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="16" font-weight="700">
      S₀ · N(d₁)
    </text>

    <!-- Description -->
    <text x="105" y="125" text-anchor="middle" fill="#f0f9ff" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">
      주식 보유량 (Delta)
    </text>
    <text x="105" y="145" text-anchor="middle" fill="#bae6fd" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400">
      0 ≤ N(d₁) ≤ 1
    </text>
    <text x="105" y="175" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="400">
      시장 상승 참여 비율을 통제
    </text>
  </g>

  <!-- 2. RIGHT CONTAINER: LIABILITY COMPONENT -->
  <g transform="translate(510, 110)" filter="url(#shadow)">
    <rect width="210" height="200" fill="url(#debtGrad)" rx="8"/>
    <rect width="210" height="200" fill="none" stroke="#f43f5e" stroke-width="1.5" rx="8"/>

    <!-- Title Area inside right container -->
    <rect x="0" y="0" width="210" height="45" fill="#4c0519" rx="8" clip-path="inset(0 0 155 0)"/>
    <text x="105" y="28" text-anchor="middle" fill="#ffe4e6" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700">
      무위험 자금 차입분 (Debt)
    </text>

    <!-- Formula -->
    <rect x="20" y="65" width="170" height="36" fill="#2d000b" rx="6"/>
    <text x="105" y="88" text-anchor="middle" fill="#fb7185" font-family="'Consolas', monospace" font-size="15" font-weight="700">
      - K · e⁻ʳᵀ · N(d₂)
    </text>

    <!-- Description -->
    <text x="105" y="125" text-anchor="middle" fill="#fff1f2" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">
      차입 부채 규모 (Leverage)
    </text>
    <text x="105" y="145" text-anchor="middle" fill="#fecdd3" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400">
      B &lt; 0 (음의 현금흐름)
    </text>
    <text x="105" y="175" text-anchor="middle" fill="#fda4af" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="400">
      행사 확률 N(d₂) 기반 부채 산정
    </text>
  </g>

  <!-- 3. CENTRAL TARGET: REPLICATED CALL OPTION -->
  <g transform="translate(315, 160)" filter="url(#shadow)">
    <rect width="170" height="100" fill="url(#optionGrad)" rx="8"/>
    <rect width="170" height="100" fill="none" stroke="#34d399" stroke-width="1.5" rx="8"/>

    <text x="85" y="32" text-anchor="middle" fill="#ecfdf5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700">
      복제 콜옵션 가격
    </text>
    <rect x="15" y="44" width="140" height="36" fill="#064e3b" rx="6"/>
    <text x="85" y="67" text-anchor="middle" fill="#34d399" font-family="'Consolas', monospace" font-size="18" font-weight="800">
      Value = C
    </text>
    <text x="85" y="92" text-anchor="middle" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="400">
      실시간 무위험 균형 상태 유지
    </text>
  </g>

  <!-- FLOW ARROWS & MATH SYMBOLS -->
  <!-- Plus Sign between containers in formula context -->
  <text x="400" y="130" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="300">
    +
  </text>

  <!-- Connectors from Left and Right to Center Option -->
  <!-- Left to Option -->
  <path d="M 290, 210 Q 302, 210 315, 210" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Right to Option -->
  <path d="M 510, 210 Q 498, 210 485, 210" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- BOTTOM METRICS & PATHWAY INFO -->
  <!-- Timeline Arrow at bottom -->
  <g transform="translate(150, 350)">
    <line x1="0" y1="15" x2="500" y2="15" stroke="#475569" stroke-width="2" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">초기 시점 (t=0)</text>
    <text x="500" y="5" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">만기 시점 (t=T)</text>
    
    <!-- Action steps -->
    <text x="250" y="-10" text-anchor="middle" fill="#34d399" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">
      동적 델타 리밸런싱 (Dynamic Delta Rebalancing)
    </text>
    <text x="250" y="8" text-anchor="middle" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="400">
      무작위 주가 변동을 완벽 차단하여 최종 포트폴리오 정산 오차 0에 수렴
    </text>
  </g>

</svg>