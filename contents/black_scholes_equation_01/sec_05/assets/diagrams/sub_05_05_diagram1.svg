<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="8"/>
  
  <!-- Outer Border -->
  <rect width="100%" height="100%" fill="none" stroke="#E2E8F0" stroke-width="2" rx="8"/>

  <!-- Title and Subtitle -->
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">이산 상승 횟수 격자(J)와 표준정규분포(Z)의 임계 경계 정렬</text>
  <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">이산 공간의 행사 하한선 J* = 2는 표준화 과정을 거쳐 Z 공간의 -d₂ = 0.4082로 정확히 매핑됩니다.</text>

  <!-- ================= TOP CHART: DISCRETE J SPACE ================= -->
  <g transform="translate(0, 30)">
    <!-- Baseline J -->
    <line x1="150" y1="140" x2="650" y2="140" stroke="#94A3B8" stroke-width="2"/>
    <text x="660" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#475569">J (상승 횟수)</text>

    <!-- Discrete Bars for n=4, p=0.4 -->
    <!-- J=0: x=277.6, height=30 (Y: 140 -> 110) OTM -->
    <rect x="257.6" y="110" width="40" height="30" fill="#CBD5E1" rx="3"/>
    <text x="277.6" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#64748B">13.0%</text>
    <text x="277.6" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">J=0</text>

    <!-- J=1: x=354.1, height=80 (Y: 140 -> 60) OTM -->
    <rect x="334.1" y="60" width="40" height="80" fill="#CBD5E1" rx="3"/>
    <text x="354.1" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#64748B">34.6%</text>
    <text x="354.1" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">J=1</text>

    <!-- J=2: x=430.6, height=80 (Y: 140 -> 60) ITM -->
    <rect x="410.6" y="60" width="40" height="80" fill="#0D9488" rx="3"/>
    <text x="430.6" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#0D9488" font-weight="bold">34.6%</text>
    <text x="430.6" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0D9488">J*=2</text>

    <!-- J=3: x=507.1, height=36 (Y: 140 -> 104) ITM -->
    <rect x="487.1" y="104" width="40" height="36" fill="#0D9488" rx="3"/>
    <text x="507.1" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#0D9488">15.4%</text>
    <text x="507.1" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="#475569">J=3</text>

    <!-- J=4: x=583.6, height=6 (Y: 140 -> 134) ITM -->
    <rect x="563.6" y="134" width="40" height="6" fill="#0D9488" rx="3"/>
    <text x="583.6" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#0D9488">2.6%</text>
    <text x="583.6" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="#475569">J=4</text>

    <!-- Zone indicator labels -->
    <text x="290" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#64748B" text-anchor="middle">미행사 영역 (OTM)</text>
    <text x="510" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0D9488" text-anchor="middle">옵션 행사 성공 영역 (ITM)</text>
  </g>

  <!-- ================= MIDDLE BRIDGE: STANDARDIZATION MAP ================= -->
  <!-- Connecting mapping arrow -->
  <g>
    <!-- Vertical dashed border line at boundary point X=430.6 -->
    <line x1="430.6" y1="120" x2="430.6" y2="355" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Central transition arrow representing Standardization -->
    <path d="M 380,210 Q 350,225 380,240" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="325" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4F46E5" text-anchor="end">표준화 변환 (Z-Score)</text>
    <text x="325" y="246" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#4F46E5" text-anchor="end">Z = (J - np) / √np(1-p)</text>
  </g>

  <!-- Definition of marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- ================= BOTTOM CHART: CONTINUOUS Z SPACE ================= -->
  <g transform="translate(0, 240)">
    <!-- Baseline Z -->
    <line x1="150" y1="115" x2="650" y2="115" stroke="#94A3B8" stroke-width="2"/>
    <text x="660" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#475569">Z (표준정규변수)</text>

    <!-- Normal Distribution Shaded Area (Z > -d2, i.e. X > 430.6 to 625) -->
    <!-- Curved shaded area path under the bell curve -->
    <path d="M 430.6 115 
             L 430.6 37 
             C 450 47, 475 72, 525 105, 550 115, 625 115
             L 625 115 Z" 
          fill="#0D9488" fill-opacity="0.15"/>

    <!-- Normal Distribution Curve Outline -->
    <!-- Peak height at X=400 is Y=15 (height 100 pixels) -->
    <path d="M 175 115 
             C 250 115, 275 100, 325 55 
             C 350 30, 375 15, 400 15 
             C 425 15, 450 30, 475 55 
             C 525 100, 550 115, 625 115" 
          fill="none" stroke="#4F46E5" stroke-width="2.5"/>

    <!-- Mean indicator at Z=0 (X=400) -->
    <line x1="400" y1="15" x2="400" y2="115" stroke="#64748B" stroke-dasharray="2,2"/>
    <text x="400" y="132" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#64748B">Z = 0 (평균)</text>

    <!-- Z-axis Tick labels -->
    <text x="250" y="132" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#64748B">Z = -2</text>
    <text x="325" y="132" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#64748B">Z = -1</text>
    <text x="475" y="132" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#64748B">Z = +1</text>
    <text x="550" y="132" font-family="Cambria, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#64748B">Z = +2</text>

    <!-- Boundary annotation at X=430.6 -->
    <circle cx="430.6" cy="115" r="4.5" fill="#EF4444"/>
    <text x="430.6" y="148" font-family="Cambria, 'Times New Roman', serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#EF4444">-d₂ = 0.4082</text>
    <text x="430.6" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#EF4444">(행사 임계 경계)</text>

    <!-- Shaded Area Label N(d2) -->
    <text x="510" y="70" font-family="Cambria, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#0D9488" text-anchor="middle">N(d₂) Area</text>
    <text x="510" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0D9488" text-anchor="middle">행사 성공 확률</text>
  </g>
</svg>