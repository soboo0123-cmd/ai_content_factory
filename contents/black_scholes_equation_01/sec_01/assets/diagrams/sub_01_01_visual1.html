<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .permutation-item { transition: all 0.2s ease; }
        .permutation-item:hover { transform: translateY(-2px); background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">동일한 크기의 '묶음' 발견하기</h2>
        <p class="text-sm text-slate-600 mb-6 text-center">첫 번째 자리에 세울 친구를 클릭해보세요. <br>어떤 친구를 선택하든 뒤따르는 경우의 수가 <strong>6개</strong>로 동일함을 확인할 수 있습니다.</p>
        
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="showPerms('A')" class="w-12 h-12 rounded-full bg-blue-500 text-white font-bold hover:bg-blue-600 focus:ring-4 ring-blue-200 transition-all">A</button>
            <button onclick="showPerms('B')" class="w-12 h-12 rounded-full bg-green-500 text-white font-bold hover:bg-green-600 focus:ring-4 ring-green-200 transition-all">B</button>
            <button onclick="showPerms('C')" class="w-12 h-12 rounded-full bg-orange-500 text-white font-bold hover:bg-orange-600 focus:ring-4 ring-orange-200 transition-all">C</button>
            <button onclick="showPerms('D')" class="w-12 h-12 rounded-full bg-purple-500 text-white font-bold hover:bg-purple-600 focus:ring-4 ring-purple-200 transition-all">D</button>
        </div>

        <div id="display-area" class="grid grid-cols-3 gap-3 min-h-[120px]">
            <div class="col-span-3 text-center text-slate-400 py-10 border-2 border-dashed border-slate-200 rounded-lg">
                위의 알파벳 버튼을 클릭하여 나열을 시작하세요
            </div>
        </div>

        <div id="result-text" class="mt-6 text-center font-semibold text-blue-600 h-6"></div>
    </div>

    <script>
        const data = {
            'A': ['ABCD', 'ABDC', 'ACBD', 'ACDB', 'ADBC', 'ADCB'],
            'B': ['BACD', 'BADC', 'BCAD', 'BCDA', 'BDAC', 'BDCA'],
            'C': ['CABD', 'CADB', 'CBAD', 'CBDA', 'CDAB', 'CDBA'],
            'D': ['DABC', 'DACB', 'DBAC', 'DBCA', 'DCAB', 'DCBA']
        };

        function showPerms(char) {
            const container = document.getElementById('display-area');
            const resultText = document.getElementById('result-text');
            container.innerHTML = '';
            
            data[char].forEach(item => {
                const div = document.createElement('div');
                div.className = 'permutation-item border border-slate-200 p-3 rounded text-center font-mono font-bold text-slate-700 shadow-sm';
                div.innerText = item;
                container.appendChild(div);
            });

            resultText.innerText = `${char}가 맨 앞에 설 때: 총 ${data[char].length}가지의 묶음이 생성됨`;
        }
    </script>
</body>
</html>
