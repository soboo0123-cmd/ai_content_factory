<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slot { border: 2px dashed #cbd5e1; transition: all 0.3s; }
        .character { cursor: pointer; transition: transform 0.2s; }
        .character:hover { transform: scale(1.1); }
        .character.selected { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-8">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">캐릭터 줄 세우기 체험</h2>
        <p class="text-slate-600 mb-6 text-sm">캐릭터를 클릭하여 빈 슬롯에 채워보세요. 각 단계에서 선택지가 어떻게 줄어드는지 확인할 수 있습니다.</p>
        
        <div class="flex justify-around mb-8" id="characters">
            <button onclick="pick('A')" id="btn-A" class="character bg-red-100 text-red-600 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-sm border-2 border-red-200">A</button>
            <button onclick="pick('B')" id="btn-B" class="character bg-blue-100 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-sm border-2 border-blue-200">B</button>
            <button onclick="pick('C')" id="btn-C" class="character bg-green-100 text-green-600 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-sm border-2 border-green-200">C</button>
            <button onclick="pick('D')" id="btn-D" class="character bg-yellow-100 text-yellow-600 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-sm border-2 border-yellow-200">D</button>
        </div>

        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="flex flex-col items-center">
                <div id="slot-0" class="slot w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-bold text-slate-400 bg-slate-50">1</div>
                <span class="text-xs mt-2 text-slate-400">1st 자리</span>
            </div>
            <div class="flex flex-col items-center">
                <div id="slot-1" class="slot w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-bold text-slate-400 bg-slate-50">2</div>
                <span class="text-xs mt-2 text-slate-400">2nd 자리</span>
            </div>
            <div class="flex flex-col items-center">
                <div id="slot-2" class="slot w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-bold text-slate-400 bg-slate-50">3</div>
                <span class="text-xs mt-2 text-slate-400">3rd 자리</span>
            </div>
            <div class="flex flex-col items-center">
                <div id="slot-3" class="slot w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-bold text-slate-400 bg-slate-50">4</div>
                <span class="text-xs mt-2 text-slate-400">4th 자리</span>
            </div>
        </div>

        <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
            <div class="text-sm font-semibold text-indigo-800 mb-1">수학적 상태:</div>
            <div id="status-msg" class="text-indigo-600 font-mono">자리를 선택해 주세요.</div>
        </div>

        <button onclick="reset()" class="mt-6 w-full py-2 bg-slate-800 text-white rounded-lg font-medium hover:bg-slate-700 transition">다시 하기</button>
    </div>

    <script>
        let selection = [];
        const chars = ['A', 'B', 'C', 'D'];
        
        function pick(char) {
            if (selection.includes(char) || selection.length >= 4) return;
            
            const currentSlot = selection.length;
            selection.push(char);
            
            const slotEl = document.getElementById(`slot-${currentSlot}`);
            slotEl.innerText = char;
            slotEl.classList.remove('text-slate-400', 'bg-slate-50');
            slotEl.classList.add('bg-white', 'border-solid', 'border-indigo-500', 'text-indigo-600', 'shadow-inner');
            
            document.getElementById(`btn-${char}`).classList.add('selected');
            updateStatus();
        }

        function updateStatus() {
            const remaining = 4 - selection.length;
            const msgEl = document.getElementById('status-msg');
            if (selection.length === 0) {
                msgEl.innerText = "첫 번째 자리에 앉을 수 있는 사람: 4명";
            } else if (selection.length < 4) {
                msgEl.innerText = `${selection.length}명을 세웠습니다. 다음 자리에 앉을 수 있는 사람: ${remaining}명`;
            } else {
                msgEl.innerText = "배치가 끝났습니다! 계산: 4 × 3 × 2 × 1 = 24가지 중 하나";
            }
        }

        function reset() {
            selection = [];
            chars.forEach(c => {
                document.getElementById(`btn-${c}`).classList.remove('selected');
            });
            for(let i=0; i<4; i++) {
                const s = document.getElementById(`slot-${i}`);
                s.innerText = i + 1;
                s.className = "slot w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-bold text-slate-400 bg-slate-50";
            }
            updateStatus();
        }
        updateStatus();
    </script>
</body>
</html>
