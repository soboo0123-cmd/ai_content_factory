<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .active-btn { background-color: #4F46E5 !important; color: white; }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-bold mb-4 text-slate-800">1단계: 첫 번째 친구 선택하기</h2>
        <p class="text-slate-600 mb-6 text-sm">첫 번째 자리에 앉을 친구를 클릭해 보세요. 뒤에 따라오는 '6가지의 묶음'을 확인할 수 있습니다.</p>
        
        <div class="flex gap-4 mb-8 justify-center">
            <button onclick="showPerms('A')" id="btn-A" class="card px-6 py-3 bg-white border-2 border-indigo-500 text-indigo-500 rounded-lg font-bold">A 가 맨 앞</button>
            <button onclick="showPerms('B')" id="btn-B" class="card px-6 py-3 bg-white border-2 border-indigo-500 text-indigo-500 rounded-lg font-bold">B 가 맨 앞</button>
            <button onclick="showPerms('C')" id="btn-C" class="card px-6 py-3 bg-white border-2 border-indigo-500 text-indigo-500 rounded-lg font-bold">C 가 맨 앞</button>
            <button onclick="showPerms('D')" id="btn-D" class="card px-6 py-3 bg-white border-2 border-indigo-500 text-indigo-500 rounded-lg font-bold">D 가 맨 앞</button>
        </div>

        <div id="result-area" class="hidden">
            <h3 id="result-title" class="text-lg font-semibold mb-3 text-indigo-600"></h3>
            <div id="perms-grid" class="grid grid-cols-3 gap-3">
                <!-- 결과가 여기에 동적으로 생성됨 -->
            </div>
            <p class="mt-4 text-center text-sm text-slate-500 font-medium italic">"어떤 친구를 골라도 항상 6가지의 똑같은 묶음이 만들어집니다!"</p>
        </div>
    </div>

    <script>
        const data = {
            'A': ['ABCD', 'ABDC', 'ACBD', 'ACDB', 'ADBC', 'ADCB'],
            'B': ['BACD', 'BADC', 'BCAD', 'BCDA', 'BDAC', 'BDCA'],
            'C': ['CABD', 'CADB', 'CBAD', 'CBDA', 'CDAB', 'CDBA'],
            'D': ['DABC', 'DACB', 'DBAC', 'DBCA', 'DCAB', 'DCBA']
        };

        function showPerms(char) {
            const area = document.getElementById('result-area');
            const title = document.getElementById('result-title');
            const grid = document.getElementById('perms-grid');
            
            // 버튼 스타일 초기화
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active-btn'));
            document.getElementById('btn-' + char).classList.add('active-btn');

            area.classList.remove('hidden');
            title.innerText = `${char}가 맨 앞일 때 발견되는 6가지 패턴`;
            
            grid.innerHTML = '';
            data[char].forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-indigo-50 p-3 rounded text-center font-mono font-bold text-indigo-700 border border-indigo-100';
                div.innerText = item;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
