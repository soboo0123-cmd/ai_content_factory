<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>독립 베르누이 블록의 가법적 결합 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
            user-select: none;
        }
        .block-animate {
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body class="bg-slate-50 p-6 flex flex-col items-center justify-center min-h-[440px]">
    <div class="bg-white rounded-xl shadow-md border border-slate-200 p-5 w-full max-w-2xl">
        <h3 class="text-base font-bold text-slate-800 mb-1 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            독립 베르누이 시행의 가법성 실시간 시뮬레이션
        </h3>
        <p class="text-xs text-slate-500 mb-4">
            성공 확률 $q$를 조절한 뒤 시행 버튼을 누르세요. 5개의 독립된 세포 블록($X_i$)이 무작위로 결정된 후, 합산된 결과 탑($Y$)을 만듭니다.
        </p>

        <!-- Controls -->
        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg mb-5 border border-slate-100">
            <div class="flex items-center gap-3 w-2/3">
                <span class="text-xs font-semibold text-slate-600">성공 확률 (q):</span>
                <input id="prob-slider" type="range" min="0" max="1" step="0.05" value="0.6" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <span id="prob-val" class="text-xs font-bold text-blue-600 w-10 text-right">0.60</span>
            </div>
            <button id="run-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-md transition-colors shadow-sm">
                시행 시뮬레이션
            </button>
        </div>

        <!-- Simulation Arena -->
        <div class="grid grid-cols-5 gap-3 h-28 relative items-end mb-4 border-b border-dashed border-slate-200 pb-2">
            <!-- Blocks will be rendered here dynamically -->
            <div id="cell-0" class="flex flex-col items-center justify-end h-full">
                <div class="block-animate w-full bg-slate-100 border border-slate-200 rounded-md h-12 flex items-center justify-center font-bold text-slate-400 text-sm">-</div>
                <span class="text-[10px] text-slate-400 mt-1">X₁</span>
            </div>
            <div id="cell-1" class="flex flex-col items-center justify-end h-full">
                <div class="block-animate w-full bg-slate-100 border border-slate-200 rounded-md h-12 flex items-center justify-center font-bold text-slate-400 text-sm">-</div>
                <span class="text-[10px] text-slate-400 mt-1">X₂</span>
            </div>
            <div id="cell-2" class="flex flex-col items-center justify-end h-full">
                <div class="block-animate w-full bg-slate-100 border border-slate-200 rounded-md h-12 flex items-center justify-center font-bold text-slate-400 text-sm">-</div>
                <span class="text-[10px] text-slate-400 mt-1">X₃</span>
            </div>
            <div id="cell-3" class="flex flex-col items-center justify-end h-full">
                <div class="block-animate w-full bg-slate-100 border border-slate-200 rounded-md h-12 flex items-center justify-center font-bold text-slate-400 text-sm">-</div>
                <span class="text-[10px] text-slate-400 mt-1">X₄</span>
            </div>
            <div id="cell-4" class="flex flex-col items-center justify-end h-full">
                <div class="block-animate w-full bg-slate-100 border border-slate-200 rounded-md h-12 flex items-center justify-center font-bold text-slate-400 text-sm">-</div>
                <span class="text-[10px] text-slate-400 mt-1">X₅</span>
            </div>
        </div>

        <!-- Result Box -->
        <div class="flex items-center justify-between bg-blue-50 border border-blue-100 p-3 rounded-lg text-xs">
            <div class="text-slate-700">
                실행 결과 식: <span class="font-mono font-bold text-slate-800" id="equation-text">Y = X₁ + X₂ + X₃ + X₄ + X₅ = ?</span>
            </div>
            <div class="text-blue-700 font-bold text-sm">
                최종 합산 값 Y = <span id="sum-val" class="text-lg text-blue-600 font-extrabold">-</span>
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('prob-slider');
        const probVal = document.getElementById('prob-val');
        const runBtn = document.getElementById('run-btn');
        const eqText = document.getElementById('equation-text');
        const sumVal = document.getElementById('sum-val');

        slider.addEventListener('input', () => {
            probVal.textContent = parseFloat(slider.value).toFixed(2);
        });

        runBtn.addEventListener('click', () => {
            const q = parseFloat(slider.value);
            let results = [];
            let sum = 0;

            for (let i = 0; i < 5; i++) {
                const rand = Math.random();
                const success = rand < q ? 1 : 0;
                results.push(success);
                sum += success;

                const cellBlock = document.getElementById(`cell-${i}`).querySelector('.block-animate');
                
                // Reset styling
                cellBlock.className = "block-animate w-full rounded-md h-16 flex flex-col items-center justify-center font-bold text-sm shadow-sm transition-all duration-300 transform scale-95";
                
                setTimeout(() => {
                    if (success === 1) {
                        cellBlock.classList.add('bg-emerald-500', 'border-emerald-600', 'text-white', 'scale-100');
                        cellBlock.innerHTML = `<span>1</span><span class="text-[9px] font-normal text-emerald-100">상승</span>`;
                    } else {
                        cellBlock.classList.add('bg-slate-400', 'border-slate-500', 'text-white', 'scale-100');
                        cellBlock.innerHTML = `<span>0</span><span class="text-[9px] font-normal text-slate-200">하락</span>`;
                    }
                }, i * 80);
            }

            setTimeout(() => {
                eqText.innerHTML = `Y = ${results[0]} + ${results[1]} + ${results[2]} + ${results[3]} + ${results[4]}`;
                sumVal.textContent = sum;
                sumVal.classList.add('scale-125', 'text-emerald-600');
                setTimeout(() => {
                    sumVal.classList.remove('scale-125', 'text-emerald-600');
                }, 200);
            }, 500);
        });
    </script>
</body>
</html>
