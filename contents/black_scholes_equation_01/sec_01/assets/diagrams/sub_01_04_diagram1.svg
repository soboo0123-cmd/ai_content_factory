<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
    <!-- Base Styling -->
    <style>
        .formula-text { font-family: 'Pretendard', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 800; }
        .sub { baseline-shift: sub; font-size: 13px; font-weight: bold; }
        .super { baseline-shift: super; font-size: 13px; font-weight: bold; }
        .title-text { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: bold; fill: #94a3b8; letter-spacing: 0.05em; }
        .desc-text { font-family: 'Pretendard', sans-serif; font-size: 11px; fill: #cbd5e1; }
        .arrow-line { stroke-width: 1.5; stroke-dasharray: 3, 3; }
    </style>

    <!-- Background Card -->
    <rect width="680" height="200" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Main PMF Equation -->
    <!-- Left Equation side: P(X=j) = -->
    <text x="125" y="65" class="formula-text" text-anchor="end" fill="#38bdf8">
        P(X = j) <tspan fill="#64748b">=</tspan>
    </text>
    
    <!-- Component 1: Combination (nCj) aligned at X=170 -->
    <text x="170" y="65" class="formula-text" text-anchor="middle" fill="#10b981">
        <tspan class="sub">n</tspan>C<tspan class="sub">j</tspan>
    </text>
    
    <!-- Operator 1: × aligned at X=257.5 -->
    <text x="257.5" y="65" class="formula-text" text-anchor="middle" fill="#64748b">×</text>
    
    <!-- Component 2: Up Prob (q^j) aligned at X=345 -->
    <text x="345" y="65" class="formula-text" text-anchor="middle" fill="#fbbf24">
        q<tspan class="super">j</tspan>
    </text>
    
    <!-- Operator 2: × aligned at X=432.5 -->
    <text x="432.5" y="65" class="formula-text" text-anchor="middle" fill="#64748b">×</text>
    
    <!-- Component 3: Down Prob (1-q)^(n-j) aligned at X=520 -->
    <text x="520" y="65" class="formula-text" text-anchor="middle" fill="#f43f5e">
        (1-q)<tspan class="super">n-j</tspan>
    </text>

    <!-- Divider Line -->
    <line x1="30" y1="95" x2="650" y2="95" stroke="#334155" stroke-width="1" />

    <!-- Connecting Vertical Lines (Perfect Alignment) -->
    <line x1="170" y1="115" x2="170" y2="78" stroke="#10b981" class="arrow-line" />
    <line x1="345" y1="115" x2="345" y2="78" stroke="#fbbf24" class="arrow-line" />
    <line x1="520" y1="115" x2="520" y2="78" stroke="#f43f5e" class="arrow-line" />

    <!-- Details / Components Explanations -->
    <!-- Card 1: 조합 (경로 제어 장치) - Centered at 170 -->
    <g transform="translate(85, 115)">
        <rect width="170" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
        <text x="85" y="24" class="title-text" fill="#a7f3d0" text-anchor="middle">1. 경로 제어 장치</text>
        <text x="85" y="43" class="desc-text" text-anchor="middle">동일 거시 상태로 도달하는</text>
        <text x="85" y="58" class="desc-text" text-anchor="middle">경로의 총 개수 (조합 가중치)</text>
    </g>

    <!-- Card 2: 상승 누적기 - Centered at 345 -->
    <g transform="translate(260, 115)">
        <rect width="170" height="70" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
        <text x="85" y="24" class="title-text" fill="#fde68a" text-anchor="middle">2. 상승 누적기</text>
        <text x="85" y="43" class="desc-text" text-anchor="middle">독립시행의 등락 규칙 적용,</text>
        <text x="85" y="58" class="desc-text" text-anchor="middle">상승이 j번 중합될 확률의 곱</text>
    </g>

    <!-- Card 3: 하락 누적기 - Centered at 520 -->
    <g transform="translate(435, 115)">
        <rect width="170" height="70" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
        <text x="85" y="24" class="title-text" fill="#fecdd3" text-anchor="middle">3. 하락 누적기</text>
        <text x="85" y="43" class="desc-text" text-anchor="middle">나머지 (n-j) 기간 동안</text>
        <text x="85" y="58" class="desc-text" text-anchor="middle">하락이 중합될 확률의 곱</text>
    </g>
</svg>