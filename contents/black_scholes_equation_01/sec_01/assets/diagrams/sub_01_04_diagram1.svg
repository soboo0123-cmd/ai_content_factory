<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
    <!-- Base Styling -->
    <style>
        .formula-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; font-weight: bold; fill: #ffffff; }
        .title-text { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: bold; fill: #94a3b8; letter-spacing: 0.05em; }
        .desc-text { font-family: 'Pretendard', sans-serif; font-size: 11px; fill: #cbd5e1; }
        .arrow-line { stroke-width: 1.5; stroke-dasharray: 3, 3; }
    </style>

    <!-- Background Card -->
    <rect width="680" height="200" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Main PMF Equation -->
    <g transform="translate(140, 60)">
        <text class="formula-text" fill="#38bdf8">P(X = j)</text>
        <text class="formula-text" x="110">=</text>
        
        <!-- Component 1: Combination -->
        <text class="formula-text" x="145" fill="#10b981"><sub>n</sub>C<sub>j</sub></text>
        
        <text class="formula-text" x="200" fill="#64748b">×</text>
        
        <!-- Component 2: Up Prob -->
        <text class="formula-text" x="225" fill="#fbbf24">q<sup>j</sup></text>
        
        <text class="formula-text" x="265" fill="#64748b">×</text>
        
        <!-- Component 3: Down Prob -->
        <text class="formula-text" x="290" fill="#f43f5e">(1-q)<sup>n-j</sup></text>
    </g>

    <!-- Divider Line -->
    <line x1="30" y1="95" x2="650" y2="95" stroke="#334155" stroke-width="1" />

    <!-- Details / Components Explanations -->
    <!-- Card 1: 조합 (경로 제어 장치) -->
    <g transform="translate(40, 115)">
        <rect width="180" height="65" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
        <text x="15" y="22" class="title-text" fill="#a7f3d0">1. 경로 제어 장치</text>
        <text x="15" y="40" class="desc-text">동일 거시 상태로 도달하는</text>
        <text x="15" y="54" class="desc-text">경로의 총 개수 (조합 가중치)</text>
        <path d="M 90,0 L 90,-25" fill="none" stroke="#10b981" class="arrow-line" />
    </g>

    <!-- Card 2: 상승 누적기 -->
    <g transform="translate(250, 115)">
        <rect width="180" height="65" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
        <text x="15" y="22" class="title-text" fill="#fde68a">2. 상승 누적기</text>
        <text x="15" y="40" class="desc-text">독립시행의 등락 규칙 적용,</text>
        <text x="15" y="54" class="desc-text">상승이 j번 중첩될 확률의 곱</text>
        <path d="M 120,0 L 120,-25" fill="none" stroke="#fbbf24" class="arrow-line" />
    </g>

    <!-- Card 3: 하락 누적기 -->
    <g transform="translate(460, 115)">
        <rect width="180" height="65" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
        <text x="15" y="22" class="title-text" fill="#fecdd3">3. 하락 누적기</text>
        <text x="15" y="40" class="desc-text">나머지 (n-j) 기간 동안</text>
        <text x="15" y="54" class="desc-text">하락이 중첩될 확률의 곱</text>
        <path d="M 120,0 L 120,-25" fill="none" stroke="#f43f5e" class="arrow-line" />
    </g>
</svg>