<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- 배경 레이아웃 -->
  <rect width="800" height="450" rx="16" fill="#0f172a"/>
  
  <!-- 그리드 패턴 -->
  <g opacity="0.05">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#f8fafc" stroke-width="1"/>
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#f8fafc" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="40" y="45" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">단리와 복리의 연산 메커니즘 대조도</text>
  <text x="40" y="70" font-family="'Pretendard', sans-serif" font-size="13" fill="#94a3b8">원금이 이자를 낳는 되먹임(Feedback) 루프의 유무 차이</text>

  <!-- 가이드 라인 (시간의 흐름) -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- 시간 격자 표시 -->
  <g font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="160" y="285">초기 시점 (t=0)</text>
    <text x="400" y="285">1주기 완료 (t=1)</text>
    <text x="640" y="285">2주기 완료 (t=2)</text>
  </g>

  <!-- 단리 노드 구조 (윗부분) -->
  <g>
    <!-- 단리 설명선 -->
    <path d="M 80,150 L 720,150" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    
    <!-- t=0 -->
    <rect x="100" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="143" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">원금 S₀</text>
    <text x="160" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">투자 기준액: S₀</text>

    <!-- 화살표 1 -->
    <path d="M 220,150 L 330,150" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <polygon points="330,146 338,150 330,154" fill="#3b82f6"/>
    <text x="275" y="135" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">+ (r × S₀)</text>
    <text x="275" y="118" font-family="'Pretendard', sans-serif" font-size="10" fill="#475569" text-anchor="middle">고정 이자 발생</text>

    <!-- t=1 -->
    <rect x="340" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="143" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">S₁ = S₀(1 + r)</text>
    <text x="400" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">투자 기준액: S₀</text>

    <!-- 화살표 2 -->
    <path d="M 460,150 L 570,150" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <polygon points="570,146 578,150 570,154" fill="#3b82f6"/>
    <text x="515" y="135" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">+ (r × S₀)</text>
    <text x="515" y="118" font-family="'Pretendard', sans-serif" font-size="10" fill="#475569" text-anchor="middle">동일한 이자 가산</text>

    <!-- t=2 -->
    <rect x="580" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="640" y="143" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">S₂ = S₀(1 + 2r)</text>
    <text x="640" y="168" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">선형 성장 (Linear)</text>

    <!-- 단리 라벨 -->
    <rect x="40" y="135" width="45" height="30" rx="4" fill="#1d4ed8"/>
    <text x="62.5" y="154" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">단리</text>
  </g>

  <!-- 복리 노드 구조 (아랫부분) -->
  <g>
    <!-- 복리 설명선 -->
    <path d="M 80,350 L 720,350" stroke="#f43f5e" stroke-width="2" opacity="0.3"/>
    
    <!-- t=0 -->
    <rect x="100" y="315" width="120" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="343" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">원금 S₀</text>
    <text x="160" y="368" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">투자 기준액: S₀</text>

    <!-- 화살표 1 -->
    <path d="M 220,350 L 330,350" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <polygon points="330,346 338,350 330,354" fill="#f43f5e"/>
    <text x="275" y="335" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#fb7185" text-anchor="middle">× (1 + r)</text>
    <text x="275" y="318" font-family="'Pretendard', sans-serif" font-size="10" fill="#475569" text-anchor="middle">자산 통째로 증식</text>

    <!-- t=1 -->
    <rect x="340" y="315" width="120" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="400" y="343" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">S₁ = S₀(1 + r)</text>
    <text x="400" y="368" font-family="'Pretendard', sans-serif" font-size="11" fill="#f43f5e" font-weight="600" text-anchor="middle">투자 기준액: S₁</text>

    <!-- 되먹임 루프 시각화 -->
    <path d="M 400,315 C 400,240 430,240 430,315" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <polygon points="396,305 400,315 404,305" fill="#f43f5e"/>
    <text x="445" y="255" font-family="'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#fb7185">이자 재투자</text>
    <text x="445" y="270" font-family="'Pretendard', sans-serif" font-size="9" fill="#94a3b8">Feedback Loop</text>

    <!-- 화살표 2 -->
    <path d="M 460,350 L 570,350" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <polygon points="570,346 578,350 570,354" fill="#f43f5e"/>
    <text x="515" y="335" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#fb7185" text-anchor="middle">× (1 + r)</text>
    <text x="515" y="318" font-family="'Pretendard', sans-serif" font-size="10" fill="#475569" text-anchor="middle">성장한 기준액 적용</text>

    <!-- t=2 -->
    <rect x="580" y="315" width="120" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="640" y="343" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">S₂ = S₀(1 + r)²</text>
    <text x="640" y="368" font-family="'Pretendard', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">지수 성장 (Exponential)</text>

    <!-- 복리 라벨 -->
    <rect x="40" y="335" width="45" height="30" rx="4" fill="#be123c"/>
    <text x="62.5" y="354" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">복리</text>
  </g>
</svg>