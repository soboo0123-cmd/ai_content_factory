<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- 배경 격자 데코레이션 -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="0" y1="200" x2="800" y2="200" />
  </g>

  <!-- 가이드 타임라인 텍스트 -->
  <text x="100" y="40" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle">현재 시점 (t = 0)</text>
  <text x="450" y="40" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle">1기간 후 (t = 1)</text>

  <!-- 연결선 (가지) -->
  <!-- 상승 가지 -->
  <path d="M 100 200 Q 275 100 450 100" fill="none" stroke="#3b82f6" stroke-width="3" />
  <path d="M 440 102 L 450 100 L 442 110" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  
  <!-- 하락 가지 -->
  <path d="M 100 200 Q 275 300 450 300" fill="none" stroke="#ef4444" stroke-width="3" />
  <path d="M 442 290 L 450 300 L 440 298" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

  <!-- 무위험 성장선 (중앙 점선) -->
  <line x1="100" y1="200" x2="450" y2="200" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" />
  <polygon points="450,200 440,195 440,205" fill="#f59e0b" />

  <!-- 노드 - 현재 주가 S -->
  <circle cx="100" cy="200" r="35" fill="url(#blueGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="100" y="205" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">S</text>

  <!-- 노드 - 상승 주가 uS -->
  <circle cx="450" cy="100" r="35" fill="url(#greenGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="450" y="105" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">uS</text>

  <!-- 노드 - 하락 주가 dS -->
  <circle cx="450" cy="300" r="35" fill="url(#redGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="450" y="305" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">dS</text>

  <!-- 노드 - 무위험 성장 가치 (1+r)S -->
  <rect x="400" y="175" width="100" height="50" rx="10" fill="url(#goldGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="450" y="206" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">(1+r)S</text>

  <!-- 부등식 맵핑 및 가이드라인 설명 -->
  <!-- 우측 부등식 괄호 데코레이션 -->
  <path d="M 510 100 L 530 100 L 530 200 L 550 200 L 530 200 L 530 300 L 510 300" fill="none" stroke="#64748b" stroke-width="2" />
  
  <!-- 부등식 텍스트 가이드 -->
  <text x="570" y="206" fill="#0f172a" font-size="20" font-weight="800" text-anchor="start">d &lt; 1+r &lt; u</text>
  <text x="570" y="235" fill="#475569" font-size="13" font-weight="500" text-anchor="start">차익거래 불가능 조건</text>

  <!-- 확률 라벨 설명 -->
  <rect x="230" y="110" width="80" height="28" rx="6" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1" />
  <text x="270" y="129" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">확률 p</text>

  <rect x="230" y="260" width="80" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
  <text x="270" y="279" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">확률 1-p</text>

  <rect x="210" y="185" width="120" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
  <text x="270" y="203" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">무위험 기준선</text>
</svg>