```xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- 배경 정의 -->
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  
  <!-- 그라디언트 정의 -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" />
      <stop offset="100%" stop-color="#d5433b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 메인 조합 공식 텍스트 상자 -->
  <g transform="translate(400, 75)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-180" y="-45" width="360" height="70" fill="#161b22" stroke="#30363d" stroke-width="2" rx="10"/>
    <text font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="800" fill="#f0f6fc">
      <tspan fill="#f0f6fc">nCr = </tspan>
      <tspan fill="#58a6ff">n!</tspan>
      <tspan fill="#f0f6fc"> / (</tspan>
      <tspan fill="#ff7b72">r!</tspan>
      <tspan fill="#3fb950">(n-r)!</tspan>
      <tspan fill="#f0f6fc">)</tspan>
    </text>
  </g>

  <!-- 1. 분자: n! (전체 나열 장치) -->
  <g transform="translate(400, 150)">
    <!-- 가이드 화살표 -->
    <path d="M 0,-40 L 0,-10" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <line x1="-150" y1="-10" x2="150" y2="-10" stroke="#58a6ff" stroke-width="2" />
    <line x1="-150" y1="-10" x2="-150" y2="40" stroke="#58a6ff" stroke-width="2" />
    <line x1="150" y1="-10" x2="150" y2="40" stroke="#58a6ff" stroke-width="2" />
  </g>

  <!-- 지칭 카드 블록 1 (분자: n!) -->
  <g transform="translate(400, 185)" filter="url(#shadow)">
    <rect x="-160" y="-35" width="320" height="60" fill="url(#blueGrad)" rx="8" />
    <text x="0" y="-12" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">분자: n! [전체 나열 장치]</text>
    <text x="0" y="14" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#e1e4e8" text-anchor="middle">n개의 시행 단계를 전부 고유한 경로로 보고 나열</text>
  </g>

  <!-- 2. 분모: r! (성공 지움 장치) -->
  <g transform="translate(180, 290)" filter="url(#shadow)">
    <!-- 가이드선 -->
    <path d="M 50,-180 L -100,-180 L -100,-35" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3,3" />
    <rect x="-100" y="-30" width="220" height="75" fill="url(#orangeGrad)" rx="8" />
    <text x="10" y="-8" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">r! [성공 제거 필터]</text>
    <text x="10" y="14" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">성공 단계들끼리 자리 바꾸는</text>
    <text x="10" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">무의미한 내부 순서(r!)를 나눔</text>
  </g>

  <!-- 3. 분모: (n-r)! (실패 지움 장치) -->
  <g transform="translate(620, 290)" filter="url(#shadow)">
    <!-- 가이드선 -->
    <path d="M -110,-180 L 40,-180 L 40,-35" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,3" />
    <rect x="-120" y="-30" width="220" height="75" fill="url(#greenGrad)" rx="8" />
    <text x="-10" y="-8" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">(n-r)! [실패 제거 필터]</text>
    <text x="-10" y="14" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">실패 단계들끼리 자리 바꾸는</text>
    <text x="-10" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">무의미한 내부 순서((n-r)!)를 나눔</text>
  </g>

  <!-- 중앙의 나누기 기호 시각화 연동 -->
  <path d="M 180, 260 L 620, 260" stroke="#30363d" stroke-width="2" />
  
  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
```