<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이산 복리와 연속 복리의 수렴 시각화</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 w-full max-w-4xl">
    <!-- 헤더 -->
    <div class="mb-6">
      <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="p-1.5 bg-indigo-500 rounded-lg text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
        </span>
        이산 복리 vs 연속 복리 성장 시각화 시뮬레이터
      </h2>
      <p class="text-xs text-slate-500 mt-1">
        이자 지급 횟수(n)를 늘려감에 따라 계단식 성장(이산 복리)이 어떻게 매끄러운 지수 곡선(연속 복리, e<sup>rt</sup>)에 완벽히 수렴하는지 확인해 보세요.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- 컨트롤러 영역 -->
      <div class="md:col-span-4 bg-slate-50 p-4 rounded-xl border border-slate-200/60 flex flex-col justify-between space-y-4">
        <div>
          <!-- 연이율 슬라이더 -->
          <div class="mb-4">
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-semibold text-slate-600">연이율 (r)</label>
              <span id="rateVal" class="text-sm font-bold text-indigo-600">30%</span>
            </div>
            <input id="rateSlider" type="range" min="5" max="100" value="30" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          </div>

          <!-- 투자 기간 슬라이더 -->
          <div class="mb-4">
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-semibold text-slate-600">기간 (t, 년)</label>
              <span id="timeVal" class="text-sm font-bold text-indigo-600">5년</span>
            </div>
            <input id="timeSlider" type="range" min="1" max="10" value="5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          </div>

          <!-- 복리 횟수 선택 -->
          <div class="mb-2">
            <label class="text-xs font-semibold text-slate-600 block mb-1">복리 계산 주기 (n번/년)</label>
            <div class="grid grid-cols-3 gap-1.5" id="nButtons">
              <button data-n="1" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition">n=1 (연)</button>
              <button data-n="2" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition">n=2 (반기)</button>
              <button data-n="4" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-indigo-600 text-white font-semibold shadow-sm transition">n=4 (분기)</button>
              <button data-n="12" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition">n=12 (월)</button>
              <button data-n="52" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition">n=52 (주)</button>
              <button data-n="365" class="n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition">n=365 (일)</button>
            </div>
          </div>
        </div>

        <!-- 실시간 비교 수치 카드 -->
        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2 text-xs">
          <div class="flex justify-between items-center pb-1.5 border-b border-slate-100">
            <span class="text-slate-500 font-medium">원금 (S₀)</span>
            <span class="font-bold text-slate-700">10,000 원</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-500 font-medium">이산 복리 최종액</span>
            <span id="discreteFinal" class="font-bold text-amber-600">14,213 원</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-500 font-medium">연속 복리 최종액 (e<sup>rt</sup>)</span>
            <span id="continuousFinal" class="font-bold text-indigo-600">14,493 원</span>
          </div>
          <div class="flex justify-between items-center pt-1.5 border-t border-slate-100 font-semibold text-slate-700">
            <span>두 방식 간 차이</span>
            <span id="diffVal" class="text-rose-500">280 원</span>
          </div>
        </div>
      </div>

      <!-- 그래프 영역 -->
      <div class="md:col-span-8 relative flex flex-col justify-between h-[340px]">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const rateSlider = document.getElementById('rateSlider');
    const timeSlider = document.getElementById('timeSlider');
    const rateVal = document.getElementById('rateVal');
    const timeVal = document.getElementById('timeVal');
    const nButtons = document.querySelectorAll('.n-btn');
    const discreteFinalText = document.getElementById('discreteFinal');
    const continuousFinalText = document.getElementById('continuousFinal');
    const diffValText = document.getElementById('diffVal');

    let currentN = 4;
    const S0 = 10000;
    let chart;

    // 초기 이벤트 바인딩 및 세팅
    rateSlider.addEventListener('input', () => {
      rateVal.innerText = `${rateSlider.value}%`;
      updateChart();
    });

    timeSlider.addEventListener('input', () => {
      timeVal.innerText = `${timeSlider.value}년`;
      updateChart();
    });

    nButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        nButtons.forEach(b => {
          b.className = "n-btn py-1.5 text-xs font-medium rounded-lg border bg-white text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition";
        });
        e.target.className = "n-btn py-1.5 text-xs font-semibold rounded-lg border bg-indigo-600 text-white shadow-sm transition";
        currentN = parseInt(e.target.dataset.n);
        updateChart();
      });
    });

    // 데이터 계산 함수
    function generateData() {
      const r = parseFloat(rateSlider.value) / 100;
      const T = parseInt(timeSlider.value);
      const n = currentN;

      const labels = [];
      const discretePoints = [];
      const continuousPoints = [];

      // 부드러운 연속 그래프를 위한 스텝 정의
      const steps = Math.max(100, T * n);
      for (let i = 0; i <= steps; i++) {
        const t = (T * i) / steps;
        labels.push(t.toFixed(2));

        // 연속 복리 데이터 계산
        const sContinuous = S0 * Math.exp(r * t);
        continuousPoints.push(sContinuous);

        // 이산 복리 데이터 계산 (이산 시점에만 뛰는 계단 현상 반영)
        const completedPeriods = Math.floor(t * n);
        const sDiscrete = S0 * Math.pow(1 + r / n, completedPeriods);
        discretePoints.push(sDiscrete);
      }

      // 최종 수치 갱신용
      const finalDiscrete = S0 * Math.pow(1 + r / n, T * n);
      const finalContinuous = S0 * Math.exp(r * T);

      discreteFinalText.innerText = `${Math.round(finalDiscrete).toLocaleString()} 원`;
      continuousFinalText.innerText = `${Math.round(finalContinuous).toLocaleString()} 원`;
      diffValText.innerText = `${Math.round(finalContinuous - finalDiscrete).toLocaleString()} 원`;

      return { labels, discretePoints, continuousPoints };
    }

    // 차트 생성 및 업데이트
    function updateChart() {
      const { labels, discretePoints, continuousPoints } = generateData();

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = discretePoints;
        chart.data.datasets[1].data = continuousPoints;
        chart.update();
      } else {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: '이산 복리 (계단식 성장)',
                data: discretePoints,
                borderColor: '#f59e0b',
                backgroundColor: 'rgba(245, 158, 11, 0.03)',
                borderWidth: 2,
                pointRadius: 0,
                stepped: 'before',
                fill: true
              },
              {
                label: '연속 복리 (e^rt 곡선)',
                data: continuousPoints,
                borderColor: '#4f46e5',
                borderWidth: 2.5,
                pointRadius: 0,
                fill: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              intersect: false,
              mode: 'index',
            },
            plugins: {
              legend: {
                position: 'top',
                labels: {
                  boxWidth: 12,
                  font: { size: 11, weight: '500' }
                }
              },
              tooltip: {
                callbacks: {
                  title: (context) => `경과 기간: ${context[0].label}년`,
                  label: (context) => ` ${context.dataset.label}: ${Math.round(context.raw).toLocaleString()}원`
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: '시간 (t, 년)', font: { size: 10 } },
                grid: { display: false }
              },
              y: {
                title: { display: true, text: '자산 평가액 (원)', font: { size: 10 } },
                grid: { color: '#f1f5f9' }
              }
            }
          }
        });
      }
    }

    // 첫 실행
    updateChart();
  </script>
</body>
</html>
