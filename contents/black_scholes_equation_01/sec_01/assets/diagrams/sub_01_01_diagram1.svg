<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#f8fafc" rx="10"/>
  
  <!-- Step 1 -->
  <circle cx="50" cy="150" r="20" fill="#3b82f6"/>
  <text x="50" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">시작</text>
  
  <!-- Connections to Step 2 -->
  <line x1="70" y1="150" x2="150" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="150" x2="150" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="150" x2="150" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="150" x2="150" y2="240" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Step 2 -->
  <rect x="150" y="45" width="30" height="30" fill="#60a5fa" rx="5"/>
  <rect x="150" y="105" width="30" height="30" fill="#60a5fa" rx="5"/>
  <rect x="150" y="165" width="30" height="30" fill="#60a5fa" rx="5"/>
  <rect x="150" y="225" width="30" height="30" fill="#60a5fa" rx="5"/>
  <text x="165" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">1차 선택 (4개)</text>
  
  <!-- Connections to Step 3 -->
  <line x1="180" y1="60" x2="250" y2="40" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="180" y1="60" x2="250" y2="60" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="180" y1="60" x2="250" y2="80" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Step 3 -->
  <circle cx="260" cy="40" r="5" fill="#93c5fd"/>
  <circle cx="260" cy="60" r="5" fill="#93c5fd"/>
  <circle cx="260" cy="80" r="5" fill="#93c5fd"/>
  <text x="260" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e293b">2차 (각 3개)</text>
  
  <!-- Summary Box -->
  <rect x="350" y="100" width="220" height="100" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="10"/>
  <text x="460" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">곱의 법칙</text>
  <text x="460" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#3b82f6">4 × 3 × 2 × 1 = 24</text>
  <text x="460" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">단계별 선택지의 곱</text>
</svg>