<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 border-t-4 border-rose-500">
        <h2 class="text-xl font-bold mb-4">팩토리얼($n!$) 계산기</h2>
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">사람 수 ($n$): <span id="n-val" class="text-rose-600 font-bold text-lg">5</span>명</label>
            <input type="range" id="n-slider" min="1" max="10" value="5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-rose-500">
        </div>
        
        <div class="bg-slate-50 rounded-lg p-4 mb-4">
            <div class="text-sm text-slate-500 mb-1 italic">계산 과정:</div>
            <div id="math-process" class="text-lg font-mono text-slate-700 break-all">5 × 4 × 3 × 2 × 1</div>
        </div>
        
        <div class="text-center">
            <div class="text-sm text-slate-500">총 경우의 수</div>
            <div id="result" class="text-4xl font-black text-rose-600">120</div>
        </div>

        <div class="mt-6 p-3 bg-blue-50 rounded text-xs text-blue-700 leading-relaxed">
            💡 $n$이 1씩 커질 때마다 결과값이 얼마나 빠르게 커지는지 확인해 보세요! 이것이 수학에서 말하는 '폭발적 증가'입니다.
        </div>
    </div>

    <script>
        const slider = document.getElementById('n-slider');
        const nVal = document.getElementById('n-val');
        const process = document.getElementById('math-process');
        const result = document.getElementById('result');

        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = n; i >= 1; i--) res *= i;
            return res;
        }

        function update() {
            const n = parseInt(slider.value);
            nVal.innerText = n;
            
            let str = "";
            for (let i = n; i >= 1; i--) {
                str += i + (i === 1 ? "" : " × ");
            }
            process.innerText = str;
            result.innerText = factorial(n).toLocaleString();
        }

        slider.addEventListener('input', update);
        update();
    </script>
</body>
</html>
