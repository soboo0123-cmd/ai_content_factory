<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Interactive Math Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700&family=JetBrains+Mono:wght=300;400&family=Noto+Sans+KR:wght=300;400;500;700&display=swap');
        
        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0C0C0E;
            color: #E2E8F0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #141418; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4A5568; }
    </style>
</head>
<body class="flex flex-col justify-between select-none">

    <!-- 1. Narrative Header -->
    <header class="flex-shrink-0 bg-[#101014] border-b border-[#22222A] px-4 py-2.5 flex flex-col gap-1.5 overflow-hidden">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span id="dimension-badge" class="px-1.5 py-0.5 text-[9px] font-bold bg-[#1E1E24] border border-[#3A3A4A] rounded text-[#58D68D] tracking-wider uppercase">Math Engine</span>
                <h1 id="step-title" class="text-xs md:text-base font-bold tracking-tight text-white truncate max-w-[70vw]">Loading...</h1>
            </div>
            <div class="text-[10px] text-gray-500 font-mono whitespace-nowrap">
                Step <span id="current-step-idx" class="text-[#58D68D]">1</span> / <span id="total-step-idx">-</span>
            </div>
        </div>
        <div id="step-narrative" class="text-[11px] md:text-sm text-gray-300 overflow-y-auto custom-scrollbar pr-1 leading-relaxed max-h-[75px] md:max-h-[100px]"></div>
        <div id="step-formula" class="text-center text-[11px] md:text-xs py-1 text-[#58D68D] font-mono border-t border-[#1A1A22] bg-[#0C0C0E]/50 rounded truncate"></div>
    </header>

    <!-- 2. Visual Main -->
    <main class="flex-grow relative bg-[#0C0C0E] flex items-center justify-center overflow-hidden">
        <canvas id="visual-canvas" class="absolute inset-0 w-full h-full block"></canvas>
        
        <!-- HUD Overlay -->
        <div class="absolute top-3 left-3 pointer-events-none flex flex-col space-y-1.5">
            <div id="hud-1" class="bg-[#141418]/90 border border-[#2A2A35] px-2 py-0.5 rounded text-[10px] font-mono flex items-center space-x-1.5 backdrop-blur">
                <span class="w-1.5 h-1.5 rounded-full bg-[#58D68D] animate-pulse"></span>
                <span id="hud-text-1" class="text-gray-300">System Ready</span>
            </div>
            <div id="hud-2" class="bg-[#141418]/90 border border-[#2A2A35] px-2 py-0.5 rounded text-[10px] font-mono text-gray-400 backdrop-blur hidden"></div>
        </div>

        <!-- Safety Error Guard HUD Banner (Hidden by default) -->
        <div id="error-banner" class="absolute top-3 right-3 bg-red-950/90 border border-red-500/50 px-3 py-1.5 rounded text-[10px] font-mono text-red-200 backdrop-blur hidden z-50">
            ⚠️ 시각화 일시 오류 복구 중...
        </div>
    </main>

    <!-- 3. Dual-Layer Footer -->
    <footer class="flex-shrink-0 bg-[#101014] border-t border-[#22222A] px-4 pb-safe-bottom pt-2 flex flex-col gap-2 z-10 overflow-hidden">
        <div id="sliders-container" class="grid grid-cols-2 lg:grid-cols-4 gap-x-3 gap-y-1.5 items-center"></div>

        <div class="flex flex-row items-center border-t border-[#1E1E24] pt-2 pb-2 w-full justify-between gap-2">
            <div class="text-[10px] text-gray-500 font-mono truncate min-w-[70px]">
                Type: <span id="archetype-badge" class="text-white font-semibold">Standard</span>
            </div>

            <div class="flex items-center space-x-1 flex-nowrap shrink-0">
                <button id="btn-prev" class="px-2.5 py-1.5 bg-[#1E1E24] hover:bg-[#2A2A35] border border-[#3A3A4A] rounded text-[11px] font-semibold transition-all text-gray-300 active:scale-95 whitespace-nowrap">이전</button>
                <button id="btn-play" class="px-3 py-1.5 bg-[#1E1E24] hover:bg-[#2D3748] border border-[#58D68D]/40 text-[#58D68D] rounded text-[11px] font-semibold transition-all flex items-center space-x-1 active:scale-95 whitespace-nowrap">
                    <span id="play-icon">▶</span> <span id="play-text">Play</span>
                </button>
                <button id="btn-next" class="px-2.5 py-1.5 bg-[#58D68D] hover:bg-[#48C67D] text-[#0C0C0E] rounded text-[11px] font-bold transition-all active:scale-95 shadow-md whitespace-nowrap">다음</button>
            </div>

            <div id="aux-control-container" class="flex items-center justify-end min-w-[50px]"></div>
        </div>
    </footer>

    <script>
        // Global Simulation State
        const state = {
            currentStep: 1,
            isPlaying: true,
            lastFrameTime: 0,
            animationTime: 0,
            hasError: false,
            params: {
                "n": 4,
                "j": 2,
                "hover_node": -1,
                "laser_progress": 0.0,
                "chair_anim_time": 0.0,
                "code_n": 4,
                "code_j": 2
            }
        };

        // Scenario Meta Data
        const scenarios = {
            "1": {
                "title": "팩토리얼(n!)의 숲 : 전체 탐색",
                "dimension": "2D Diagram",
                "narrative": "4명의 친구(A, B, C, D)를 제한 없이 줄 세우는 모든 경우의 수($4! = 24$)를 트리 구조로 나타냈습니다. 마우스를 올려 첫 번째 문자를 선택하면, 해당 문자로 시작하는 모든 줄 세우기 경로가 선명하게 하이라이트됩니다. 이 거대한 구조가 순열의 기초가 되는 전체의 모습입니다.",
                "formula": "4! = 4 \\times 3 \\times 2 \\times 1 = 24",
                "sliders": [
                    { "id": "hover_node", "label": "첫 번째 선택 원소", "min": -1, "max": 3, "step": 1, "valKey": "hover_node" }
                ]
            },
            "2": {
                "title": "가지치기와 해체 : '여기까지만 세울게'",
                "dimension": "2D Tree Deconstruction",
                "narrative": "전체 $n$명 중 $j$명만 선택하여 자리에 앉힌다면 어떻게 될까요? 슬라이더를 통해 $n$과 $j$의 크기를 조절해 보세요. $j$단계를 넘어가는 하위 트리 가지들이 **회색 투명(Deconstruct)**으로 변하며, 오직 $j$단계까지의 경로만 선명하게 유지됩니다. 순서 제거가 가져오는 직관적 가지치기를 확인하세요.",
                "formula": "n = 4,\\ j = 2 \\implies 4 \\times 3 = 12",
                "sliders": [
                    { "id": "n", "label": "전체 인원 (n)", "min": 3, "max": 4, "step": 1, "valKey": "n" },
                    { "id": "j", "label": "선택 인원 (j)", "min": 1, "max": 4, "step": 1, "valKey": "j" }
                ]
            },
            "3": {
                "title": "분수식 소거 체험 : 나누기는 곧 '제거'다",
                "dimension": "Formula & Visual Elimination",
                "narrative": "수식 $\\frac{n!}{(n-j)!}$은 원하지 않는 나머지 뒤쪽의 순서 배열($(n-j)!$)을 나누어 통째로 지워 버리는 마법입니다. '소거 진행도' 슬라이더를 증가시켜 보세요. 빨간색 레이저 장벽이 분자/분모의 뒷부분인 $2 \\times 1$을 휩쓸며 스르륵 소거해 버리는 쾌감을 시각적으로 경험할 수 있습니다.",
                "formula": "\\frac{4!}{(4-2)!} = \\frac{4 \\times 3 \\times 2 \\times 1}{2 \\times 1} = 12",
                "sliders": [
                    { "id": "laser_progress", "label": "소거 진행도 (레이저)", "min": 0.0, "max": 1.0, "step": 0.01, "valKey": "laser_progress" }
                ]
            },
            "4": {
                "title": "재구성과 일반화 : 공식과 코드로의 수렴",
                "dimension": "3D-like Animation & Code",
                "narrative": "해체 후 남은 뼈대를 가지고 순열 공식을 최종 정의하고, 이를 컴퓨터 프로그래밍 언어(Python)와 연결합니다. $n$과 $j$를 조절하면 좌측 무대에 원소 인형들이 날아가 자리에 착석하며, 우측 칠판에는 파이썬 코드 결과물 리스트가 실시간 업데이트됩니다.",
                "formula": "_nP_j = \\frac{n!}{(n-j)!}",
                "sliders": [
                    { "id": "code_n", "label": "코드용 n", "min": 3, "max": 5, "step": 1, "valKey": "code_n" },
                    { "id": "code_j", "label": "코드용 j", "min": 1, "max": 5, "step": 1, "valKey": "code_j" }
                ]
            }
        };

        const canvas = document.getElementById('visual-canvas');
        const ctx = canvas.getContext('2d');
        let width = 0, height = 0, scale = 0;

        // --- 1. Common Mathematical Utility Functions ---
        
        function project3D(x, y, z, yaw, pitch) {
            let x1 = x * Math.cos(yaw) - y * Math.sin(yaw);
            let y1 = x * Math.sin(yaw) + y * Math.cos(yaw);
            let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
            let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);
            const projScale = scale * 0.45;
            const screenX = (width / 2) + x2 * projScale;
            const screenY = (height / 2 + scale * 0.05) - y2 * projScale; 
            return { x: screenX, y: screenY, depth: z2 };
        }

        function drawVector(fromX, fromY, toX, toY, color, widthSize = 2.5, arrowHeadSize = 8) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = widthSize;
            ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.beginPath(); ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowHeadSize * Math.cos(angle - Math.PI/6), toY - arrowHeadSize * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - arrowHeadSize * Math.cos(angle + Math.PI/6), toY - arrowHeadSize * Math.sin(angle + Math.PI/6));
            ctx.closePath(); ctx.fill();
        }

        function drawNode(x, y, label, color = '#58D68D', radius = 18) {
            ctx.fillStyle = '#141418'; ctx.strokeStyle = color; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#E2E8F0'; ctx.font = 'bold 10px JetBrains Mono';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
        }

        function drawEdge(fromX, fromY, toX, toY, weight = '', color = '#2A2A35') {
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
            if (weight !== '') {
                const midX = (fromX + toX) / 2;
                const midY = (fromY + toY) / 2;
                ctx.fillStyle = '#101014';
                const textW = 20, textH = 14;
                ctx.fillRect(midX - textW/2, midY - textH/2, textW, textH);
                ctx.fillStyle = '#A0AEC0'; ctx.font = '9px JetBrains Mono';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(weight, midX, midY);
            }
        }

        function drawBarChart(dataPoints, colors = '#58D68D', chartW = width * 0.5, chartH = height * 0.3) {
            const bottom = height * 0.8;
            const left = (width - chartW) / 2;
            const barW = (chartW / dataPoints.length) * 0.7;
            const spacing = (chartW / dataPoints.length) * 0.3;
            
            ctx.strokeStyle = '#2A2A35'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(left + chartW, bottom); ctx.stroke();

            dataPoints.forEach((val, i) => {
                const h = val * chartH;
                const x = left + i * (barW + spacing) + spacing/2;
                const y = bottom - h;
                ctx.fillStyle = Array.isArray(colors) ? colors[i % colors.length] : colors;
                ctx.fillRect(x, y, barW, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.strokeRect(x, y, barW, h);
            });
        }

        function triggerMathJax() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.log('MathJax processing error: ' + err.message));
            }
        }

        // --- 2. Dynamic UI Engine ---
        function initUI() {
            const stepData = scenarios[state.currentStep];
            if (!stepData) return;

            document.getElementById('step-title').innerHTML = stepData.title;
            document.getElementById('step-narrative').innerHTML = stepData.narrative;
            document.getElementById('step-formula').innerHTML = `\\(${stepData.formula}\\)`;
            document.getElementById('current-step-idx').innerText = state.currentStep;
            document.getElementById('total-step-idx').innerText = Object.keys(scenarios).length;
            document.getElementById('dimension-badge').innerText = stepData.dimension || 'Simulation';

            triggerMathJax();

            const slidersContainer = document.getElementById('sliders-container');
            slidersContainer.innerHTML = ''; 
            
            stepData.sliders.forEach(slide => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col space-y-0.5 w-full';
                wrapper.innerHTML = `
                    <div class="flex justify-between text-[10px] text-gray-400 font-mono">
                        <span class="truncate pr-1">${slide.label}</span>
                        <span id="val-${slide.id}" class="text-[#58D68D] font-bold"></span>
                    </div>
                    <input type="range" id="${slide.id}" 
                           min="${slide.min}" max="${slide.max}" step="${slide.step}" 
                           class="w-full h-1 bg-[#1A1A22] rounded-lg appearance-none cursor-pointer accent-[#58D68D] outline-none border-0 py-1"
                    />
                `;
                slidersContainer.appendChild(wrapper);

                const el = document.getElementById(slide.id);
                el.value = state.params[slide.valKey];
                document.getElementById(`val-${slide.id}`).innerText = Number(el.value).toFixed(2);

                const instantPause = () => {
                    if (state.isPlaying) {
                        state.isPlaying = false;
                        updatePlayButtonState();
                    }
                };
                el.addEventListener('pointerdown', instantPause, { passive: true });
                el.addEventListener('touchstart', instantPause, { passive: true });

                el.oninput = (e) => {
                    const val = parseFloat(e.target.value);
                    state.params[slide.valKey] = val;
                    document.getElementById(`val-${slide.id}`).innerText = val.toFixed(2);
                };
            });

            document.getElementById('btn-prev').disabled = (state.currentStep === 1);
            document.getElementById('btn-prev').className = `px-2.5 py-1.5 rounded text-[11px] font-semibold transition-all shrink-0 ${state.currentStep === 1 ? 'opacity-30 cursor-not-allowed bg-[#141418] text-gray-600' : 'bg-[#1E1E24] hover:bg-[#2A2A35] text-gray-300'}`;
            document.getElementById('btn-next').disabled = (state.currentStep === Object.keys(scenarios).length);
            document.getElementById('btn-next').className = `px-2.5 py-1.5 rounded text-[11px] font-bold transition-all shrink-0 ${state.currentStep === Object.keys(scenarios).length ? 'opacity-30 cursor-not-allowed bg-[#141418] text-gray-600' : 'bg-[#58D68D] hover:bg-[#48C67D] text-[#0C0C0E]'}`;
        }

        function updateUI() {
            const stepData = scenarios[state.currentStep];
            if (!stepData) return;
            stepData.sliders.forEach(slide => {
                const el = document.getElementById(slide.id);
                if (el) {
                    el.value = state.params[slide.valKey];
                    const outEl = document.getElementById(`val-${slide.id}`);
                    if (outEl) outEl.innerText = Number(state.params[slide.valKey]).toFixed(2);
                }
            });
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            const btn = document.getElementById('btn-play');
            const icon = document.getElementById('play-icon');
            const txt = document.getElementById('play-text');
            if (state.isPlaying) {
                btn.classList.add('bg-[#58D68D]', 'text-black', 'border-transparent');
                btn.classList.remove('bg-[#1E1E24]', 'text-[#58D68D]');
                icon.innerText = "⏸";
                txt.innerText = "Pause";
            } else {
                btn.classList.remove('bg-[#58D68D]', 'text-black', 'border-transparent');
                btn.classList.add('bg-[#1E1E24]', 'text-[#58D68D]');
                icon.innerText = "▶";
                txt.innerText = "Play";
            }
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            width = rect.width;
            height = rect.height;
            scale = Math.min(width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3. Dynamic Drawing Core ---
        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function drawSlateGrid() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 40;
            
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawCharacters(hoveredIdx = -1) {
            const chars = ['A', 'B', 'C', 'D'];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308'];
            const startX = width / 2 - 135;
            const y = 50;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("대기 원소들 (POOL)", width / 2, y - 25);

            for (let i = 0; i < 4; i++) {
                const x = startX + i * 90;
                const isHovered = (hoveredIdx === i);
                
                ctx.save();
                ctx.shadowBlur = isHovered ? 20 : 6;
                ctx.shadowColor = colors[i];
                
                ctx.fillStyle = isHovered ? '#1e293b' : '#0f172a';
                ctx.strokeStyle = colors[i];
                ctx.lineWidth = isHovered ? 3 : 1.5;
                
                ctx.beginPath();
                ctx.roundRect(x - 30, y - 15, 60, 40, 6);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px "Fira Code", monospace';
                ctx.fillText(chars[i], x, y + 10);
                ctx.restore();
            }
        }

        function drawPermutationTree(totalN, limitJ, hoveredIdx) {
            const chars = ['A', 'B', 'C', 'D', 'E'];
            
            function drawNodeRecursive(depth, parentX, parentY, currentPath, leftBound, rightBound) {
                if (depth > totalN) return;
                
                const isCut = depth > limitJ;
                const baseAlpha = isCut ? 0.12 : 1.0;
                
                const available = [];
                for (let i = 0; i < totalN; i++) {
                    if (!currentPath.includes(chars[i])) {
                        available.push({ char: chars[i], origIdx: i });
                    }
                }
                
                const childCount = available.length;
                if (childCount === 0) return;
                
                const segmentWidth = (rightBound - leftBound) / childCount;
                const nextY = parentY + 75;
                
                for (let i = 0; i < childCount; i++) {
                    const childInfo = available[i];
                    const nextPath = [...currentPath, childInfo.char];
                    const childX = leftBound + segmentWidth * i + segmentWidth / 2;
                    
                    let isHighlighted = true;
                    if (hoveredIdx !== -1) {
                        if (nextPath[0] !== chars[hoveredIdx]) {
                            isHighlighted = false;
                        }
                    }
                    
                    const nodeAlpha = isHighlighted ? baseAlpha : baseAlpha * 0.15;
                    
                    ctx.beginPath();
                    ctx.moveTo(parentX, parentY);
                    ctx.lineTo(childX, nextY);
                    ctx.strokeStyle = isCut ? `rgba(71, 85, 105, ${nodeAlpha * 0.4})` : `rgba(56, 189, 248, ${nodeAlpha * 0.85})`;
                    ctx.lineWidth = isCut ? 1 : (isHighlighted ? 2.5 : 1.2);
                    ctx.stroke();
                    
                    drawNodeRecursive(depth + 1, childX, nextY, nextPath, leftBound + segmentWidth * i, leftBound + segmentWidth * (i + 1));
                    
                    ctx.beginPath();
                    ctx.arc(childX, nextY, 13, 0, Math.PI * 2);
                    ctx.fillStyle = isCut ? `rgba(30, 41, 59, ${nodeAlpha})` : (isHighlighted ? `rgba(15, 23, 42, ${nodeAlpha})` : `rgba(30, 41, 59, ${nodeAlpha})`);
                    ctx.fill();
                    
                    ctx.strokeStyle = isCut ? `rgba(100, 116, 139, ${nodeAlpha})` : `rgba(56, 189, 248, ${nodeAlpha})`;
                    ctx.lineWidth = isHighlighted && !isCut ? 2 : 1;
                    ctx.stroke();
                    
                    ctx.fillStyle = isCut ? `rgba(148, 163, 184, ${nodeAlpha})` : (isHighlighted ? '#ffffff' : `rgba(148, 163, 184, ${nodeAlpha})`);
                    ctx.font = 'bold 11px "Fira Code", monospace';
                    ctx.fillText(childInfo.char, childX, nextY + 4);
                }
            }
            
            const rootX = width / 2;
            const rootY = 120;
            
            ctx.beginPath();
            ctx.arc(rootX, rootY, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px "Fira Code", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ROOT', rootX, rootY + 4);
            
            drawNodeRecursive(1, rootX, rootY, [], 30, width - 30);
        }

        function renderStep1() {
            drawSlateGrid();
            const hovered = Math.floor(state.params.hover_node);
            drawCharacters(hovered);
            
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText("전체 경우의 수 숲: 4! = 24가지", 60, height - 30);
            drawPermutationTree(4, 4, hovered);
        }

        function renderStep2() {
            drawSlateGrid();
            
            let safeN = Math.floor(state.params.n);
            let safeJ = Math.floor(state.params.j);
            if (safeJ > safeN) {
                safeJ = safeN;
            }
            
            drawCharacters(-1);
            
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`현재: ${safeN}명 중 ${safeJ}명을 선택하여 나열`, 40, height - 50);
            
            let pathCount = 1;
            for (let i = 0; i < safeJ; i++) {
                pathCount *= (safeN - i);
            }
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`활성화된 알짜배기 경우의 수: ${pathCount}가지`, 40, height - 30);
            
            drawPermutationTree(safeN, safeJ, -1);
        }

        function renderStep3() {
            drawSlateGrid();
            const progress = state.params.laser_progress;
            
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText("수식 소거 시각화: n=4, j=2 일 때", width / 2, 70);
            
            const lineY = height / 2;
            const startX = width / 2 - 200;
            const endX = width / 2 + 200;
            
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(startX, lineY);
            ctx.lineTo(endX, lineY);
            ctx.stroke();
            
            const numerators = [
                { val: "4", x: width / 2 - 120, active: true },
                { val: "3", x: width / 2 - 40,  active: true },
                { val: "2", x: width / 2 + 40,  active: false },
                { val: "1", x: width / 2 + 120, active: false }
            ];
            
            const denominators = [
                { val: "2", x: width / 2 + 40,  active: false },
                { val: "1", x: width / 2 + 120, active: false }
            ];
            
            const laserX = endX - (endX - startX + 50) * progress;
            
            numerators.forEach((item, index) => {
                const isPassed = item.x > laserX;
                let alpha = 1.0;
                let yOffset = 0;
                
                if (!item.active) {
                    if (isPassed) {
                        alpha = Math.max(0, 1 - (item.x - laserX) / 50);
                        yOffset = (item.x - laserX) * 0.25;
                    }
                }
                
                ctx.fillStyle = item.active ? '#38bdf8' : `rgba(244, 63, 94, ${alpha})`;
                ctx.font = 'bold 36px "Fira Code", monospace';
                ctx.fillText(item.val, item.x, lineY - 60 + yOffset);
                
                if (index < numerators.length - 1) {
                    ctx.fillStyle = '#64748b';
                    ctx.font = '24px "Fira Code", monospace';
                    ctx.fillText('×', item.x + 40, lineY - 60);
                }
            });
            
            denominators.forEach((item, index) => {
                const isPassed = item.x > laserX;
                let alpha = 1.0;
                let yOffset = 0;
                
                if (isPassed) {
                    alpha = Math.max(0, 1 - (item.x - laserX) / 50);
                    yOffset = -(item.x - laserX) * 0.25;
                }
                
                ctx.fillStyle = `rgba(244, 63, 94, ${alpha})`;
                ctx.font = 'bold 36px "Fira Code", monospace';
                ctx.fillText(item.val, item.x, lineY + 60 + yOffset);
                
                if (index < denominators.length - 1) {
                    ctx.fillStyle = '#64748b';
                    ctx.font = '24px "Fira Code", monospace';
                    ctx.fillText('×', item.x + 40, lineY + 60);
                }
            });
            
            if (progress > 0.01 && progress < 0.99) {
                ctx.save();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#f43f5e';
                
                ctx.beginPath();
                ctx.moveTo(laserX, lineY - 140);
                ctx.lineTo(laserX, lineY + 140);
                ctx.stroke();
                
                for (let i = 0; i < 6; i++) {
                    const sparkY = lineY - 120 + Math.random() * 240;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(laserX + (Math.random() - 0.5) * 15, sparkY, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            
            if (progress > 0.8) {
                ctx.fillStyle = '#34d399';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText("제거 성공! 남은 핵심 구조: 4 × 3 = 12", width / 2, height - 60);
            } else {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '13px sans-serif';
                ctx.fillText("레이저 장벽을 가동하면 동일 순서쌍의 불필요한 연산이 제거됩니다.", width / 2, height - 30);
            }
        }

        function renderStep4() {
            drawSlateGrid();
            
            let cn = Math.floor(state.params.code_n);
            let cj = Math.floor(state.params.code_j);
            if (cj > cn) {
                cj = cn;
            }
            
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7'];
            const chars = ['A', 'B', 'C', 'D', 'E'];
            
            const stageLeft = 40;
            const stageWidth = width * 0.45;
            
            ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
            ctx.beginPath();
            ctx.roundRect(stageLeft, 60, stageWidth, height - 120, 10);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("의자 착석 무대 (Reconstruction)", stageLeft + stageWidth/2, 90);
            
            const anim = state.params.chair_anim_time;
            const chairY = height / 2 + 40;
            
            for (let i = 0; i < cj; i++) {
                const chairX = stageLeft + (stageWidth / (cj + 1)) * (i + 1);
                
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(chairX - 20, chairY - 15, 40, 30, 4);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(chairX - 15, chairY + 15);
                ctx.lineTo(chairX - 18, chairY + 45);
                ctx.moveTo(chairX + 15, chairY + 15);
                ctx.lineTo(chairX + 18, chairY + 45);
                ctx.stroke();
                
                const delay = i * 0.15;
                const localAnim = Math.max(0, Math.min(1.0, (anim - delay) * 1.5));
                const yOffset = -150 * (1 - easeOutBack(localAnim));
                const alpha = localAnim;
                
                if (alpha > 0.05) {
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = colors[i % colors.length];
                    
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.beginPath();
                    ctx.arc(chairX, chairY - 20 + yOffset, 16, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px "Fira Code", monospace';
                    ctx.fillText(chars[i], chairX, chairY - 15 + yOffset);
                    ctx.restore();
                }
            }
            
            const terminalLeft = width * 0.52;
            const terminalWidth = width * 0.43;
            
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.roundRect(terminalLeft, 60, terminalWidth, height - 120, 8);
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
            
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(terminalLeft, 60, terminalWidth, 25, {tl: 8, tr: 8, bl: 0, br: 0});
            ctx.fill();
            
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.fillText("interactive_permutation.py", terminalLeft + 12, 76);
            
            ctx.font = '11.5px "Fira Code", monospace';
            ctx.fillStyle = '#34d399';
            ctx.fillText("import itertools", terminalLeft + 15, 110);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`items = [${chars.slice(0, cn).map(c => `'${c}'`).join(', ')}]`, terminalLeft + 15, 130);
            ctx.fillText(`result = list(itertools.permutations(items, ${cj}))`, terminalLeft + 15, 150);
            
            ctx.fillStyle = '#a1a1aa';
            ctx.fillText(`print(f"Count: {len(result)}")`, terminalLeft + 15, 175);
            
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(terminalLeft + 10, 195, terminalWidth - 20, height - 330);
            
            const selectedItems = chars.slice(0, cn);
            function getPermutations(arr, selectNum) {
                let result = [];
                if (selectNum === 1) return arr.map(v => [v]);
                arr.forEach((fixed, index, origin) => {
                    const rest = [...origin.slice(0, index), ...origin.slice(index + 1)];
                    const permutations = getPermutations(rest, selectNum - 1);
                    const attached = permutations.map(p => [fixed, ...p]);
                    result.push(...attached);
                });
                return result;
            }
            
            const allPerms = getPermutations(selectedItems, cj);
            
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 11px monospace';
            ctx.fillText(">>> [TERMINAL OUTPUT]", terminalLeft + 15, 215);
            
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(`전체 경우의 수: ${allPerms.length}개`, terminalLeft + 15, 235);
            
            ctx.fillStyle = '#e2e8f0';
            let outputStr = "목록: [";
            const printedPerms = allPerms.slice(0, 5);
            outputStr += printedPerms.map(p => `(${p.join(',')})`).join(', ');
            if (allPerms.length > 5) {
                outputStr += ", ...";
            }
            outputStr += "]";
            
            ctx.fillText(outputStr, terminalLeft + 15, 255);
            
            ctx.fillStyle = '#818cf8';
            ctx.font = 'italic 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`수식 계산: ${cn}P${cj} = ${cn}! / (${cn}-${cj})! = ${allPerms.length}`, width / 2, height - 35);
        }

        function updateAnimation(delta) {
            state.params.chair_anim_time += delta * 0.8;
            if (state.params.chair_anim_time > 2.2) {
                state.params.chair_anim_time = 0.0;
            }
        }

        function render() {
            ctx.fillStyle = '#0C0C0E';
            ctx.fillRect(0, 0, width, height);

            switch(state.currentStep) {
                case 1:
                    renderStep1();
                    break;
                case 2:
                    renderStep2();
                    break;
                case 3:
                    renderStep3();
                    break;
                case 4:
                    renderStep4();
                    break;
            }
        }

        function loop(timestamp) {
            if (!state.lastFrameTime) state.lastFrameTime = timestamp;
            const delta = (timestamp - state.lastFrameTime) / 1000.0;
            state.lastFrameTime = timestamp;

            try {
                if (state.isPlaying) {
                    state.animationTime += delta;
                    updateAnimation(delta);
                    updateUI();
                }

                render();

                if (state.hasError) {
                    document.getElementById('error-banner').classList.add('hidden');
                    state.hasError = false;
                }
            } catch (err) {
                if (!state.hasError) {
                    console.error("Rendering Loop Exception caught:", err);
                    document.getElementById('error-banner').classList.remove('hidden');
                    state.hasError = true;
                }
            }

            requestAnimationFrame(loop);
        }

        document.getElementById('btn-prev').onclick = () => { if (state.currentStep > 1) { state.currentStep--; initUI(); } };
        document.getElementById('btn-next').onclick = () => { if (state.currentStep < Object.keys(scenarios).length) { state.currentStep++; initUI(); } };
        document.getElementById('btn-play').onclick = () => { state.isPlaying = !state.isPlaying; updatePlayButtonState(); };

        initUI();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
