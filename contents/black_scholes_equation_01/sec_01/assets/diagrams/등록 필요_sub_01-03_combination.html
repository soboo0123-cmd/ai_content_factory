<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Interactive Math Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700&family=JetBrains+Mono:wght=300;400&family=Noto+Sans+KR:wght=300;400;500;700&display=swap');
        
        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0C0C0E;
            color: #E2E8F0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #141418; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4A5568; }
    </style>
</head>
<body class="flex flex-col justify-between select-none">

    <!-- 1. Narrative Header -->
    <header class="flex-shrink-0 bg-[#101014] border-b border-[#22222A] px-4 py-2.5 flex flex-col gap-1.5 overflow-hidden">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span id="dimension-badge" class="px-1.5 py-0.5 text-[9px] font-bold bg-[#1E1E24] border border-[#3A3A4A] rounded text-[#58D68D] tracking-wider uppercase">Math Engine</span>
                <h1 id="step-title" class="text-xs md:text-base font-bold tracking-tight text-white truncate max-w-[70vw]">Loading...</h1>
            </div>
            <div class="text-[10px] text-gray-500 font-mono whitespace-nowrap">
                Step <span id="current-step-idx" class="text-[#58D68D]">1</span> / <span id="total-step-idx">-</span>
            </div>
        </div>
        <div id="step-narrative" class="text-[11px] md:text-sm text-gray-300 overflow-y-auto custom-scrollbar pr-1 leading-relaxed max-h-[75px] md:max-h-[100px]"></div>
        <div id="step-formula" class="text-center text-[11px] md:text-xs py-1 text-[#58D68D] font-mono border-t border-[#1A1A22] bg-[#0C0C0E]/50 rounded truncate"></div>
    </header>

    <!-- 2. Visual Main -->
    <main class="flex-grow relative bg-[#0C0C0E] flex items-center justify-center overflow-hidden">
        <canvas id="visual-canvas" class="absolute inset-0 w-full h-full block"></canvas>
        
        <!-- HUD Overlay -->
        <div class="absolute top-3 left-3 pointer-events-none flex flex-col space-y-1.5">
            <div id="hud-1" class="bg-[#141418]/90 border border-[#2A2A35] px-2 py-0.5 rounded text-[10px] font-mono flex items-center space-x-1.5 backdrop-blur">
                <span class="w-1.5 h-1.5 rounded-full bg-[#58D68D] animate-pulse"></span>
                <span id="hud-text-1" class="text-gray-300">System Ready</span>
            </div>
            <div id="hud-2" class="bg-[#141418]/90 border border-[#2A2A35] px-2 py-0.5 rounded text-[10px] font-mono text-gray-400 backdrop-blur hidden"></div>
        </div>

        <!-- Safety Error Guard HUD Banner (Hidden by default) -->
        <div id="error-banner" class="absolute top-3 right-3 bg-red-950/90 border border-red-500/50 px-3 py-1.5 rounded text-[10px] font-mono text-red-200 backdrop-blur hidden z-50">
            ⚠️ 시각화 일시 오류 복구 중...
        </div>
    </main>

    <!-- 3. Dual-Layer Footer -->
    <footer class="flex-shrink-0 bg-[#101014] border-t border-[#22222A] px-4 pb-safe-bottom pt-2 flex flex-col gap-2 z-10 overflow-hidden">
        <div id="sliders-container" class="grid grid-cols-2 lg:grid-cols-4 gap-x-3 gap-y-1.5 items-center"></div>

        <div class="flex flex-row items-center border-t border-[#1E1E24] pt-2 pb-2 w-full justify-between gap-2">
            <div class="text-[10px] text-gray-500 font-mono truncate min-w-[70px]">
                Type: <span id="archetype-badge" class="text-white font-semibold">Standard</span>
            </div>

            <div class="flex items-center space-x-1 flex-nowrap shrink-0">
                <button id="btn-prev" class="px-2.5 py-1.5 bg-[#1E1E24] hover:bg-[#2A2A35] border border-[#3A3A4A] rounded text-[11px] font-semibold transition-all text-gray-300 active:scale-95 whitespace-nowrap">이전</button>
                <button id="btn-play" class="px-3 py-1.5 bg-[#1E1E24] hover:bg-[#2D3748] border border-[#58D68D]/40 text-[#58D68D] rounded text-[11px] font-semibold transition-all flex items-center space-x-1 active:scale-95 whitespace-nowrap">
                    <span id="play-icon">▶</span> <span id="play-text">Play</span>
                </button>
                <button id="btn-next" class="px-2.5 py-1.5 bg-[#58D68D] hover:bg-[#48C67D] text-[#0C0C0E] rounded text-[11px] font-bold transition-all active:scale-95 shadow-md whitespace-nowrap">다음</button>
            </div>

            <div id="aux-control-container" class="flex items-center justify-end min-w-[50px]"></div>
        </div>
    </footer>

    <script>
        // Global Simulation State
        const state = {
            currentStep: 1,
            isPlaying: true,
            lastFrameTime: 0,
            animationTime: 0,
            hasError: false,
            params: {
  "s1_collapse": 0.0,
  "s2_drag": 0.0,
  "s3_focus": 0,
  "s4_n": 5,
  "s4_j": 3
}
        };

        // Scenario Meta Data Loaded from Python Injection
        const scenarios = {
  "1": {
    "title": "순서의 장벽 허물기",
    "dimension": "2D Space",
    "narrative": "4명 중 2명을 뽑을 때, 순열(Permutation)은 12가지 경로를 만듭니다. 하지만 '순서'를 무시하는 순간, AB와 BA는 하나의 동일한 팀이 됩니다. 슬라이더를 올려 12개의 순열 쌍이 반으로 수축하여 6개의 조합(Combination)으로 합쳐지는 경이로운 과정을 관찰해 보세요.",
    "formula": "{}_4P_2 = 12 \\quad \\longrightarrow \\quad {}_4C_2 = \\frac{12}{2} = 6",
    "sliders": [
      { "id": "s1_collapse", "label": "순서 제거 (압축률)", "min": 0.0, "max": 1.0, "step": 0.01, "valKey": "s1_collapse" }
    ]
  },
  "2": {
    "title": "중복 소거의 일반화 (왜 j! 인가?)",
    "dimension": "2D Space",
    "narrative": "만약 대표를 3명 뽑는다면 어떻게 될까요? {A, B, C} 3명이 자리를 바꾸는 경우의 수는 $3! = 6$가지입니다. 조합의 세계에서는 이 6가지의 다른 순서가 결국 단 하나의 대표팀일 뿐입니다. 슬라이더를 움직여 6개의 순열 카드가 하나의 주머니 속으로 빨려 들어가며 1개로 압축되는 물리적 연출을 확인하세요.",
    "formula": "3! = 3 \\times 2 \\times 1 = 6 \\text{ 개의 순열} \\rightarrow 1 \\text{ 개의 조합}",
    "sliders": [
      { "id": "s2_drag", "label": "주머니 속으로 압축", "min": 0.0, "max": 1.0, "step": 0.01, "valKey": "s2_drag" }
    ]
  },
  "3": {
    "title": "공식의 해체 분석 (Deconstruction)",
    "dimension": "Math Visual",
    "narrative": "조합 공식은 나눗셈이라는 조각칼을 쓰는 것과 같습니다. 전체를 나열하는 $n!$ 에서, 선택받지 못한 이들의 순서 $(n-j)!$ 을 깎아내어 순열을 만들고, 마지막으로 선택된 이들끼리의 순서 $j!$ 마저 깎아내어 가장 순수한 조합만을 남깁니다. 단계별 초점을 클릭해 해체 과정을 감상하세요.",
    "formula": "{}_nC_j = \\frac{n!}{(n-j)! \\times j!}",
    "sliders": [
      { "id": "s3_focus", "label": "공식 해체 단계 (0:전체, 1:n!, 2:(n-j)!, 3:j!)", "min": 0, "max": 3, "step": 1, "valKey": "s3_focus" }
    ]
  },
  "4": {
    "title": "인터랙티브 플레이그라운드 & 코드",
    "dimension": "Interactive Code",
    "narrative": "전체 인원 $n$과 선택할 인원 $j$를 자유롭게 조절해 보세요. 실시간으로 수식의 약분 과정과 매칭되는 파이썬 `itertools.combinations` 연산 결과가 터미널에 출력됩니다. 수학 공식의 연산 구조와 프로그래밍 코드가 완벽히 동치임을 손끝으로 느껴보세요.",
    "formula": "{}_nC_j = \\frac{n!}{(n-j)! j!}",
    "sliders": [
      { "id": "s4_n", "label": "전체 인원 (n)", "min": 2, "max": 7, "step": 1, "valKey": "s4_n" },
      { "id": "s4_j", "label": "선택할 인원 (j)", "min": 1, "max": 7, "step": 1, "valKey": "s4_j" }
    ]
  }
};

        const canvas = document.getElementById('visual-canvas');
        const ctx = canvas.getContext('2d');
        let width = 0, height = 0, scale = 0;

        // --- 1. Common Mathematical Utility Functions ---
        
        function project3D(x, y, z, yaw, pitch) {
            let x1 = x * Math.cos(yaw) - y * Math.sin(yaw);
            let y1 = x * Math.sin(yaw) + y * Math.cos(yaw);
            let y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch);
            let z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);
            const projScale = scale * 0.45;
            const screenX = (width / 2) + x2 * projScale;
            const screenY = (height / 2 + scale * 0.05) - y2 * projScale; 
            return { x: screenX, y: screenY, depth: z2 };
        }

        function drawVector(fromX, fromY, toX, toY, color, widthSize = 2.5, arrowHeadSize = 8) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = widthSize;
            ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.beginPath(); ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowHeadSize * Math.cos(angle - Math.PI/6), toY - arrowHeadSize * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - arrowHeadSize * Math.cos(angle + Math.PI/6), toY - arrowHeadSize * Math.sin(angle + Math.PI/6));
            ctx.closePath(); ctx.fill();
        }

        function drawNode(x, y, label, color = '#58D68D', radius = 18) {
            ctx.fillStyle = '#141418'; ctx.strokeStyle = color; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#E2E8F0'; ctx.font = 'bold 10px JetBrains Mono';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
        }

        function drawEdge(fromX, fromY, toX, toY, weight = '', color = '#2A2A35') {
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
            if (weight !== '') {
                const midX = (fromX + toX) / 2;
                const midY = (fromY + toY) / 2;
                ctx.fillStyle = '#101014';
                const rectW = 20, rectH = 14;
                ctx.fillRect(midX - rectW/2, midY - rectH/2, rectW, rectH);
                ctx.fillStyle = '#A0AEC0'; ctx.font = '9px JetBrains Mono';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(weight, midX, midY);
            }
        }

        function drawBarChart(dataPoints, colors = '#58D68D', chartW = width * 0.5, chartH = height * 0.3) {
            const bottom = height * 0.8;
            const left = (width - chartW) / 2;
            const barW = (chartW / dataPoints.length) * 0.7;
            const spacing = (chartW / dataPoints.length) * 0.3;
            
            ctx.strokeStyle = '#2A2A35'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(left + chartW, bottom); ctx.stroke();

            dataPoints.forEach((val, i) => {
                const h = val * chartH;
                const x = left + i * (barW + spacing) + spacing/2;
                const y = bottom - h;
                ctx.fillStyle = Array.isArray(colors) ? colors[i % colors.length] : colors;
                ctx.fillRect(x, y, barW, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.strokeRect(x, y, barW, h);
            });
        }

        function triggerMathJax() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.log('MathJax processing error: ' + err.message));
            }
        }

        // --- 2. Dynamic UI Engine ---
        function initUI() {
            const stepData = scenarios[state.currentStep];
            if (!stepData) return;

            document.getElementById('step-title').innerHTML = stepData.title;
            document.getElementById('step-narrative').innerHTML = stepData.narrative;
            document.getElementById('step-formula').innerHTML = `\\(${stepData.formula}\\)`;
            document.getElementById('current-step-idx').innerText = state.currentStep;
            document.getElementById('total-step-idx').innerText = Object.keys(scenarios).length;
            document.getElementById('dimension-badge').innerText = stepData.dimension || 'Simulation';

            triggerMathJax();

            const slidersContainer = document.getElementById('sliders-container');
            slidersContainer.innerHTML = ''; 
            
            stepData.sliders.forEach(slide => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col space-y-0.5 w-full';
                wrapper.innerHTML = `
                    <div class="flex justify-between text-[10px] text-gray-400 font-mono">
                        <span class="truncate pr-1">${slide.label}</span>
                        <span id="val-${slide.id}" class="text-[#58D68D] font-bold"></span>
                    </div>
                    <input type="range" id="${slide.id}" 
                           min="${slide.min}" max="${slide.max}" step="${slide.step}" 
                           class="w-full h-1 bg-[#1A1A22] rounded-lg appearance-none cursor-pointer accent-[#58D68D] outline-none border-0 py-1"
                    />
                `;
                slidersContainer.appendChild(wrapper);

                const el = document.getElementById(slide.id);
                el.value = state.params[slide.valKey];
                document.getElementById(`val-${slide.id}`).innerText = Number(el.value).toFixed(2);

                const instantPause = () => {
                    if (state.isPlaying) {
                        state.isPlaying = false;
                        updatePlayButtonState();
                    }
                };
                el.addEventListener('pointerdown', instantPause, { passive: true });
                el.addEventListener('touchstart', instantPause, { passive: true });

                el.oninput = (e) => {
                    const val = parseFloat(e.target.value);
                    state.params[slide.valKey] = val;
                    document.getElementById(`val-${slide.id}`).innerText = val.toFixed(2);
                };
            });

            document.getElementById('btn-prev').disabled = (state.currentStep === 1);
            document.getElementById('btn-prev').className = `px-2.5 py-1.5 rounded text-[11px] font-semibold transition-all shrink-0 ${state.currentStep === 1 ? 'opacity-30 cursor-not-allowed bg-[#141418] text-gray-600' : 'bg-[#1E1E24] hover:bg-[#2A2A35] text-gray-300'}`;
            document.getElementById('btn-next').disabled = (state.currentStep === Object.keys(scenarios).length);
            document.getElementById('btn-next').className = `px-2.5 py-1.5 rounded text-[11px] font-bold transition-all shrink-0 ${state.currentStep === Object.keys(scenarios).length ? 'opacity-30 cursor-not-allowed bg-[#141418] text-gray-600' : 'bg-[#58D68D] hover:bg-[#48C67D] text-[#0C0C0E]'}`;
        }

        function updateUI() {
            const stepData = scenarios[state.currentStep];
            if (!stepData) return;
            stepData.sliders.forEach(slide => {
                const el = document.getElementById(slide.id);
                if (el) {
                    el.value = state.params[slide.valKey];
                    const outEl = document.getElementById(`val-${slide.id}`);
                    if (outEl) outEl.innerText = Number(state.params[slide.valKey]).toFixed(2);
                }
            });
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            const btn = document.getElementById('btn-play');
            const icon = document.getElementById('play-icon');
            const txt = document.getElementById('play-text');
            if (state.isPlaying) {
                btn.classList.add('bg-[#58D68D]', 'text-black', 'border-transparent');
                btn.classList.remove('bg-[#1E1E24]', 'text-[#58D68D]');
                icon.innerText = "⏸";
                txt.innerText = "Pause";
            } else {
                btn.classList.remove('bg-[#58D68D]', 'text-black', 'border-transparent');
                btn.classList.add('bg-[#1E1E24]', 'text-[#58D68D]');
                icon.innerText = "▶";
                txt.innerText = "Play";
            }
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            width = rect.width;
            height = rect.height;
            scale = Math.min(width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3. Dynamic Drawing Core (Injected by Python) ---
        // 전역 헬퍼 함수: 배경 격자 그리기 (3Blue1Brown 스타일)
function drawMathGrid(ctx, width, height) {
  ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
}

// 둥근 사각형 그리기 헬퍼
function drawRoundRect(ctx, x, y, w, h, r, fillColor, strokeColor, strokeWidth = 1) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fillColor) {
    ctx.fillStyle = fillColor;
    ctx.fill();
  }
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.stroke();
  }
}

// 글로우 효과를 주는 노드 그리기
function drawGlowingNode(ctx, x, y, radius, text, baseColor, glowColor, intensity = 0) {
  ctx.save();
  if (intensity > 0) {
    ctx.shadowBlur = intensity * 15;
    ctx.shadowColor = glowColor;
  }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = baseColor;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

// 선형 보간 헬퍼
function lerp(start, end, amt) {
  return (1 - amt) * start + amt * end;
}

// 1단계 렌더링: 순열의 중복 제거 (4P2 -> 4C2)
function renderStep1() {
  const { s1_collapse } = state.params;
  
  // 배경 설정
  ctx.fillStyle = "#121214";
  ctx.fillRect(0, 0, width, height);
  drawMathGrid(ctx, width, height);

  // 대구획 레이블
  ctx.fillStyle = "#8e8e93";
  ctx.font = "14px sans-serif";
  ctx.fillText("순열 영역 (Permutations)", width * 0.25, 50);
  ctx.fillText("조합 주머니 (Combinations)", width * 0.75, 50);

  // 12가지 순열 쌍 매핑
  const pairs = [
    { p1: "AB", p2: "BA", col: "#ff3b30", label: "{A, B}" },
    { p1: "AC", p2: "CA", col: "#ff9500", label: "{A, C}" },
    { p1: "AD", p2: "DA", col: "#ffcc00", label: "{A, D}" },
    { p1: "BC", p2: "CB", col: "#4cd964", label: "{B, C}" },
    { p1: "BD", p2: "DB", col: "#5ac8fa", label: "{B, D}" },
    { p1: "CD", p2: "DC", col: "#5856d6", label: "{C, D}" }
  ];

  // 조합 주머니 영역 그리기
  const bagX = width * 0.75;
  const bagY = height * 0.5;
  const bagRadius = 140;

  ctx.beginPath();
  ctx.arc(bagX, bagY, bagRadius, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 190, 11, 0.05)";
  ctx.strokeStyle = "rgba(255, 190, 11, 0.4)";
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fill();

  ctx.fillStyle = "rgba(255, 190, 11, 0.8)";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Combination Bag", bagX, bagY - bagRadius - 15);

  // 그리드 배치 설정
  const startX = width * 0.12;
  const gapY = (height - 120) / 6;

  pairs.forEach((pair, index) => {
    const y = 80 + index * gapY;
    
    // 원래 순열 원소들의 좌표
    const x1 = startX;
    const x2 = startX + 130;
    const midX = (x1 + x2) / 2;

    // 단계별 좌표 계산
    let drawX1, drawY1, drawX2, drawY2;
    let nodeAlpha = 1.0;

    if (s1_collapse <= 0.5) {
      // 1단계: 순열 카드 한곳으로 수축
      const t = s1_collapse * 2;
      drawX1 = lerp(x1, midX, t);
      drawY1 = y;
      drawX2 = lerp(x2, midX, t);
      drawY2 = y;
    } else {
      // 2단계: 합쳐진 카드가 조합 주머니 내부의 지정 구역으로 이동
      const t = (s1_collapse - 0.5) * 2;
      const targetAngle = (index / 6) * Math.PI * 2;
      const targetX = bagX + Math.cos(targetAngle) * (bagRadius * 0.5);
      const targetY = bagY + Math.sin(targetAngle) * (bagRadius * 0.5);

      drawX1 = lerp(midX, targetX, t);
      drawY1 = lerp(y, targetY, t);
      drawX2 = drawX1;
      drawY2 = drawY1;
      nodeAlpha = lerp(1.0, 0.0, t);
    }

    // 선 그리기 (연결망 시각화)
    if (s1_collapse < 0.5) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
    }

    // 1번 순열 노드 그리기
    if (s1_collapse < 0.99) {
      ctx.save();
      ctx.globalAlpha = nodeAlpha;
      drawGlowingNode(ctx, drawX1, drawY1, 22, pair.p1, "#2c2c2e", pair.col, 0.3);
      drawGlowingNode(ctx, drawX2, drawY2, 22, pair.p2, "#2c2c2e", pair.col, 0.3);
      ctx.restore();
    }

    // 결합된 조합 노드 표시 (1단계 압축 이후 서서히 등장)
    if (s1_collapse > 0.4) {
      const combAlpha = (s1_collapse - 0.4) / 0.6;
      ctx.save();
      ctx.globalAlpha = combAlpha;
      
      // 조합 위치 결정
      let combX = midX;
      let combY = y;
      if (s1_collapse > 0.5) {
        const t = (s1_collapse - 0.5) * 2;
        const targetAngle = (index / 6) * Math.PI * 2;
        const targetX = bagX + Math.cos(targetAngle) * (bagRadius * 0.55);
        const targetY = bagY + Math.sin(targetAngle) * (bagRadius * 0.55);
        combX = lerp(midX, targetX, t);
        combY = lerp(y, targetY, t);
      }

      // 조합을 표현하는 금빛 원형 배지
      drawGlowingNode(ctx, combX, combY, 26, pair.label, "#ffbe0b", "#ffbe0b", 0.8);
      ctx.restore();
    }
  });

  // 하단 설명 가이드 렌더링
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "left";
  if (s1_collapse < 0.5) {
    ctx.fillText("💡 좌측의 12가지 순열에서 색상이 같은 두 사건은 원소 구성이 완벽히 똑같습니다.", 40, height - 40);
  } else if (s1_collapse < 1.0) {
    ctx.fillText("💡 순서를 제거하자 2개씩 묶여서 하나의 대표팀(조합)으로 합쳐집니다! (12 ÷ 2 = 6)", 40, height - 40);
  } else {
    ctx.fillStyle = "#ffbe0b";
    ctx.fillText("✅ 완벽한 압축 완료! 순서가 사라져 12가지 순열이 6가지 조합으로 소거되었습니다.", 40, height - 40);
  }
}

// 2단계 렌더링: 중복 소거의 일반화 (ABC 조합의 3!가지 순열 축소)
function renderStep2() {
  const { s2_drag } = state.params;

  ctx.fillStyle = "#121214";
  ctx.fillRect(0, 0, width, height);
  drawMathGrid(ctx, width, height);

  const centerX = width * 0.35;
  const centerY = height * 0.5;
  const outerRadius = 160;

  const bagX = width * 0.75;
  const bagY = height * 0.5;
  const bagRadius = 140;

  // 중앙의 조합 주머니
  ctx.beginPath();
  ctx.arc(bagX, bagY, bagRadius, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(6, 214, 160, 0.05)";
  ctx.strokeStyle = "rgba(6, 214, 160, 0.4)";
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 6]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fill();

  ctx.fillStyle = "#06d6a0";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("대표팀 {A, B, C} 주머니", bagX, bagY - bagRadius - 15);

  // 6가지 순열 리스트 (3!)
  const perms = ["ABC", "ACB", "BAC", "BCA", "CAB", "CBA"];
  const colors = ["#ff3b30", "#ff9500", "#ffcc00", "#4cd964", "#5ac8fa", "#5856d6"];

  perms.forEach((perm, index) => {
    // 원형 배치 좌표
    const angle = (index / 6) * Math.PI * 2 - Math.PI / 2;
    const startX = centerX + Math.cos(angle) * outerRadius;
    const startY = centerY + Math.sin(angle) * outerRadius;

    // 드래그 진행률에 따라 주머니 안으로 수축
    const currentX = lerp(startX, bagX, s2_drag);
    const currentY = lerp(startY, bagY, s2_drag);
    const alpha = lerp(1.0, 0.1, s2_drag);

    // 이동 경로 안내선
    if (s2_drag > 0 && s2_drag < 1) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(bagX, bagY);
      ctx.stroke();
    }

    ctx.save();
    ctx.globalAlpha = alpha;
    drawGlowingNode(ctx, currentX, currentY, 24, perm, "#2c2c2e", colors[index], 0.4);
    ctx.restore();
  });

  // 주머니 중앙 조합 대표팀 카드
  if (s2_drag > 0.1) {
    const scaleUp = lerp(0.5, 1.2, s2_drag);
    const alpha = lerp(0.0, 1.0, s2_drag);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(bagX, bagY);
    ctx.scale(scaleUp, scaleUp);
    
    // 대표팀 금장 패널
    drawRoundRect(ctx, -60, -35, 120, 70, 10, "#06d6a0", "#ffffff", 2);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("대표 3명", 0, -10);
    ctx.fillStyle = "#121214";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("{ A, B, C }", 0, 18);
    ctx.restore();
  }

  // 안내 가이드
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "left";
  if (s2_drag < 0.9) {
    ctx.fillText("💡 이 6개의 서로 다른 순열 카드는 결국 멤버가 모두 같은 그룹입니다.", 40, height - 40);
  } else {
    ctx.fillStyle = "#06d6a0";
    ctx.fillText("✅ 6개(3!)의 모든 순서 중복을 나눗셈을 통해 단 1개의 조합으로 압축해 냈습니다!", 40, height - 40);
  }
}

  // 공식 전체 렌더링 영역
  const centerX = width * 0.5;

  drawRoundRect(ctx, centerX - 250, formulaY - 60, 500, 110, 12, "#1c1c1e", "rgba(255,255,255,0.1)", 1);

  ctx.fillStyle = "#e5e5ea";
  ctx.fillText("=", centerX - 90, formulaY + 10);

  // 분자 n!
  ctx.fillStyle = s3_focus === 1 ? "#3a86f0" : "#e5e5ea";

  ctx.beginPath();
  ctx.moveTo(centerX - 40, formulaY);
  ctx.lineTo(centerX + 180, formulaY);

  // 분모 (n-j)!
  ctx.fillStyle = s3_focus === 2 ? "#ff007f" : "#e5e5ea";
  ctx.fillText("(n - j)!", centerX + 20, formulaY + 35);

  ctx.fillStyle = "#8e8e93";
  ctx.font = "20px sans-serif";
  ctx.fillText("×", centerX + 100, formulaY + 35);

  // 분모 j!
  ctx.fillStyle = s3_focus === 3 ? "#06d6a0" : "#e5e5ea";
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("j!", centerX + 140, formulaY + 35);

  // 하단 인터랙티브 시뮬레이션 트리/박스 시각화
  const simY = 380;
  
  if (s3_focus === 0) {
    // 0: 전체 조화
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px sans-serif";
    ctx.fillText("공식의 세 요소( n!, (n-j)!, j! )의 조화를 분석합니다.", centerX, simY - 50);
    ctx.fillStyle = "#8e8e93";
    ctx.font = "14px sans-serif";
    ctx.fillText("슬라이더를 넘겨 각 파트가 수학적으로 담당하는 제거 방식을 감상해 보세요.", centerX, simY - 20);

    // 모식도 시각화
    drawRoundRect(ctx, centerX - 180, simY, 360, 60, 8, "rgba(255, 190, 11, 0.1)", "#ffbe0b", 1);
    ctx.fillStyle = "#ffbe0b";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText("조합: 전체 나열에서 두 종류의 순서를 제거한 순수 집합", centerX, simY + 35);

  } else if (s3_focus === 1) {
    // 1: 분자 n! (가장 원초적인 상태)
    ctx.fillStyle = "#3a86f0";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("분자 n! : 아무 제약 없는 전체 무작위 줄 세우기", centerX, simY - 60);

    // 원형 파티클/노드가 마구잡이로 배열된 네트워크 시각화 (팩토리얼의 혼돈 상태)
    const count = 12;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const x = centerX + Math.cos(angle) * 80;
      const y = simY + 15 + Math.sin(angle) * 40;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(58, 134, 240, 0.7)";
      ctx.fill();
      if (i > 0) {
        ctx.strokeStyle = "rgba(58, 134, 240, 0.2)";
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(centerX + Math.cos(((i-1)/count)*Math.PI*2)*80, simY + 15 + Math.sin(((i-1)/count)*Math.PI*2)*40);
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#8e8e93";
    ctx.font = "13px sans-serif";
    ctx.fillText("정제되지 않은 거대한 경우의 수 원석 상태", centerX, simY + 80);

  } else if (s3_focus === 2) {
    // 2: 분모 (n-j)! (선택 안 된 녀석들 순서 제거)
    ctx.fillStyle = "#ff007f";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("분모 (n-j)! : 선택받지 않은 아웃사이더들의 순서 제거", centerX, simY - 60);
    
    // 선택받지 못한 원소들이 어두워지고 X 표시로 소거되는 연출
    ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
    drawRoundRect(ctx, centerX - 180, simY - 20, 160, 70, 6, "#2c2c2e", "#ff007f", 1);

    ctx.fillText("순서 보존 (순열화)", centerX - 100, simY + 35);

    ctx.fillStyle = "#ff007f";
    ctx.fillText("🚫 순서 삭제 완료", centerX + 100, simY + 35);

    ctx.fillStyle = "#8e8e93";
    ctx.font = "13px sans-serif";
    ctx.fillText("이 단계까지 완료되면 '순열' (nPr) 상태가 완성됩니다.", centerX, simY + 80);

  } else if (s3_focus === 3) {
    // 3: 분모 j! (선택된 녀석들의 순서 제거)
    ctx.fillStyle = "#06d6a0";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("분모 j! : 선택받은 대표들 내부의 불필요한 자리바꿈(순서) 소거", centerX, simY - 60);

    // 회전 화살표가 가둬져 수축하는 구조 시각화
    ctx.strokeStyle = "#06d6a0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(centerX, simY + 10, 40, 0, Math.PI * 1.5);
    ctx.stroke();

    // 화살표 삼각 촉
    ctx.beginPath();
    ctx.moveTo(centerX, simY - 35);
    ctx.lineTo(centerX - 10, simY - 30);
    ctx.lineTo(centerX - 5, simY - 45);
    ctx.closePath();
    ctx.fillStyle = "#06d6a0";
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText("j!", centerX, simY + 15);

    ctx.fillStyle = "#8e8e93";
    ctx.font = "13px sans-serif";
    ctx.fillText("내부 서열 정리 화살표를 정지시키고 하나의 묶음(Set)으로 고정!", centerX, simY + 80);
  }
}

// 4단계 렌더링: 플레이그라운드 & 파이썬 코드 매핑
function renderStep4() {
  const { s4_n, s4_j } = state.params;

  // j가 n보다 클 수 없게 강제 조절
  const validJ = Math.min(s4_j, s4_n);

  ctx.fillStyle = "#121214";
  ctx.fillRect(0, 0, width, height);
  drawMathGrid(ctx, width, height);

  // 공식 계산 처리
  const factorial = (num) => {
    let res = 1;
    for (let i = 2; i <= num; i++) res *= i;
    return res;
  };

  const combVal = Math.round(factorial(s4_n) / (factorial(s4_n - validJ) * factorial(validJ)));

  // 1. 좌측 화면: 수학 연산 과정 디테일 시각화
  const midX = width * 0.45;

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("💡 실시간 조합 계산기", 40, 50);

  // 대형 공식 박스
  drawRoundRect(ctx, 40, 75, midX - 60, 160, 12, "#1c1c1e", "rgba(255,255,255,0.05)", 1);

  ctx.fillStyle = "#ffbe0b";
  ctx.font = "bold 38px sans-serif";
  ctx.fillText(`_{${s4_n}}C_{${validJ}}`, 60, 140);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 24px sans-serif";
  ctx.fillText(`= ${combVal}`, 60, 195);

  // 분수 형태로 수식 상세 작성
  ctx.font = "16px monospace";
  ctx.fillStyle = "#3a86f0";
  let numeratorText = "";
  for(let i=0; i<validJ; i++) {
    numeratorText += (s4_n - i) + (i < validJ - 1 ? " × " : "");
  }
  ctx.fillText(numeratorText, 210, 125);

  // 나눗셈 선
  ctx.strokeStyle = "#8e8e93";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(200, 135);
  ctx.lineTo(390, 135);
  ctx.stroke();

  ctx.fillStyle = "#06d6a0";
  let denominatorText = "";
  for(let i=validJ; i>=1; i--) {
    denominatorText += i + (i > 1 ? " × " : "");
  }
  ctx.fillText(denominatorText, 210, 155);

  // 대상 구슬 시각화 (n개 중 j개 선택)
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText("선택 과정 시뮬레이션", 40, 275);

  const ballRadius = 18;
  const startX = 60;
  const gapX = 45;
  for (let i = 0; i < s4_n; i++) {
    const isSelected = i < validJ;
    const x = startX + i * gapX;
    const y = 320;

    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = isSelected ? "rgba(6, 214, 160, 0.8)" : "rgba(255, 255, 255, 0.1)";
    ctx.strokeStyle = isSelected ? "#06d6a0" : "#8e8e93";
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isSelected ? "#121214" : "#ffffff";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String.fromCharCode(65 + i), x, y + 4);
  }
  ctx.textAlign = "left";
  ctx.fillStyle = "#8e8e93";
  ctx.font = "13px sans-serif";
  ctx.fillText(`(초록색으로 표시된 ${validJ}개의 구슬을 선택하는 방법의 수)`, 40, 365);


  // 2. 우측 화면: 파이썬 코드 및 실행 터미널 창
  const codeX = midX + 20;
  const codeWidth = width - codeX - 40;

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px sans-serif";
  ctx.fillText("💻 파이썬 코드 & 아웃풋", codeX, 50);

  // 파이썬 코드 에디터 박스
  drawRoundRect(ctx, codeX, 75, codeWidth, 180, 8, "#1e1e24", "#3a3a3c", 1);
  ctx.fillStyle = "#3a86f0";
  ctx.font = "14px monospace";
  ctx.fillText("import", codeX + 20, 105);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(" itertools", codeX + 75, 105);

  ctx.fillStyle = "#8e8e93";
  ctx.fillText(`items = [${Array.from({length: s4_n}, (_, i) => `'${String.fromCharCode(65+i)}'`).join(", ")}]`, codeX + 20, 135);

  ctx.fillStyle = "#ffbe0b";
  ctx.fillText("combs", codeX + 20, 165);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(` = list(itertools.`, codeX + 115, 165);
  ctx.fillStyle = "#06d6a0";
  ctx.fillText("combinations", codeX + 265, 165);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`(items, ${validJ}))`, codeX + 365, 165);

  ctx.fillStyle = "#4cd964";
  ctx.fillText(`print(len(combs))  # 출력 결과: ${combVal}`, codeX + 20, 205);


  // 가상 터미널 아웃풋 박스
  drawRoundRect(ctx, codeX, 275, codeWidth, 110, 6, "#000000", "#1c1c1e", 1);
  ctx.fillStyle = "#00ff00";
  ctx.font = "12px monospace";
  ctx.fillText("$ python combination_test.py", codeX + 15, 300);

  // 조합 리스트 시뮬레이션 계산
  const getCombinations = (arr, k) => {
    const result = [];
    const helper = (start, combo) => {
      if (combo.length === k) {
        result.push([...combo]);
        return;
      }
      for (let i = start; i < arr.length; i++) {
        combo.push(arr[i]);
        helper(i + 1, combo);
        combo.pop();
      }
    };
    helper(0, []);
    return result;
  };

  const letters = Array.from({length: s4_n}, (_, i) => String.fromCharCode(65+i));
  const combList = getCombinations(letters, validJ);
  const listStr = combList.map(c => `(${c.join(",")})`).slice(0, 6).join(", ") + (combList.length > 6 ? " ... " : "");

  ctx.fillStyle = "#ffffff";
  ctx.fillText(`>> 생성된 조합 (${combVal}개):`, codeX + 15, 330);
  ctx.fillStyle = "#ffcc00";
  ctx.fillText(`[ ${listStr} ]`, codeX + 15, 355);
}

// 매 프레임 파라미터 변동 제어
function updateAnimation(delta) {
  // 지속적인 미세 변동이나 부드러운 애니메이션을 원할 때 로직을 정의합니다.
}

        function render() {
            ctx.fillStyle = '#0C0C0E';
            ctx.fillRect(0, 0, width, height);

            // Dynamically Route Rendering based on the Scenario Steps
            const renderFuncName = `renderStep${state.currentStep}`;
            if (typeof window[renderFuncName] === 'function') {
                window[renderFuncName]();
            } else {
                try {
                    // Fallback to evaluating function name if scope requires it
                    const fn = new Function(`return typeof ${renderFuncName} === 'function' ? ${renderFuncName} : null`)();
                    if (fn) {
                        fn();
                    } else {
                        throw new Error(`${renderFuncName} is not defined`);
                    }
                } catch (err) {
                    if (!state.hasError) {
                        console.error("Dynamic render route execution failed:", err);
                        document.getElementById('error-banner').classList.remove('hidden');
                        state.hasError = true;
                    }
                }
            }
        }

        // --- 4. Main Event Loop with Safety Try-Catch Wrapper ---
        function loop(timestamp) {
            if (!state.lastFrameTime) state.lastFrameTime = timestamp;
            const delta = (timestamp - state.lastFrameTime) / 1000.0;
            state.lastFrameTime = timestamp;

            try {
                if (state.isPlaying) {
                    state.animationTime += delta;
                    updateAnimation(delta);
                    updateUI();
                }

                render();

                if (state.hasError) {
                    document.getElementById('error-banner').classList.add('hidden');
                    state.hasError = false;
                }
            } catch (err) {
                if (!state.hasError) {
                    console.error("Rendering Loop Exception caught:", err);
                    document.getElementById('error-banner').classList.remove('hidden');
                    state.hasError = true;
                }
            }

            requestAnimationFrame(loop);
        }

        // Controls
        document.getElementById('btn-prev').onclick = () => { if (state.currentStep > 1) { state.currentStep--; initUI(); } };
        document.getElementById('btn-next').onclick = () => { if (state.currentStep < Object.keys(scenarios).length) { state.currentStep++; initUI(); } };
        document.getElementById('btn-play').onclick = () => { state.isPlaying = !state.isPlaying; updatePlayButtonState(); };

        // Start initialization
        initUI();
        requestAnimationFrame(loop);
    </script>
