<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- 배경색 정의 -->
  <rect width="800" height="450" fill="#f8fafc" rx="12"/>

  <!-- 타이틀 -->
  <text x="400" y="35" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">예측(Forecasting)과 평가(Valuation)의 패러다임 분리</text>

  <!-- 구분선 -->
  <line x1="400" y1="70" x2="400" y2="400" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- [왼쪽] 물리적 세계 (예측의 영역) -->
  <g transform="translate(40, 60)">
    <!-- 영역 헤더 -->
    <rect width="320" height="40" fill="#fee2e2" rx="8"/>
    <text x="160" y="25" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">물리적 세계 (Physical World)</text>
    
    <!-- 본문 내용 카드들 -->
    <!-- 카드 1 -->
    <rect x="10" y="60" width="300" height="70" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" rx="6"/>
    <text x="25" y="88" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">주관적 미래 예측 (Forecasting)</text>
    <text x="25" y="110" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">"내일 호재가 터져 주가가 폭등할 것이다"</text>
    
    <!-- 카드 2 -->
    <rect x="10" y="145" width="300" height="70" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" rx="6"/>
    <text x="25" y="173" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">위험 프리미엄 (Risk Premium)</text>
    <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">투자자마다 제각각인 위험 회피 성향 (정량화 불가)</text>

    <!-- 연결 화살표 -->
    <path d="M 160 225 L 160 260" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- 결과 -->
    <rect x="10" y="270" width="300" height="55" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6"/>
    <text x="160" y="295" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">가격 결정 불가 (정답이 없음)</text>
    <text x="160" y="313" font-family="'Pretendard', sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">주관적 심리에 따라 끊임없이 흔들림</text>
  </g>

  <!-- [오른쪽] 위험중립 세계 (평가의 영역) -->
  <g transform="translate(440, 60)">
    <!-- 영역 헤더 -->
    <rect width="320" height="40" fill="#dbeafe" rx="8"/>
    <text x="160" y="25" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">위험중립 세계 (Risk-Neutral World)</text>
    
    <!-- 본문 내용 카드들 -->
    <!-- 카드 1 -->
    <rect x="10" y="60" width="300" height="70" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" rx="6"/>
    <text x="25" y="88" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">복제 포트폴리오 (No Arbitrage)</text>
    <text x="25" y="110" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">기초자산과 무위험 채권으로 완벽한 헤지 달성</text>
    
    <!-- 카드 2 -->
    <rect x="10" y="145" width="300" height="70" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" rx="6"/>
    <text x="25" y="173" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">상수화된 무위험 이자율 (r)</text>
    <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="12" fill="#64748b">주관적 성향 완전 배제, 시장 금리로만 할인</text>

    <!-- 연결 화살표 -->
    <path d="M 160 225 L 160 260" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- 결과 -->
    <rect x="10" y="270" width="300" height="55" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="160" y="295" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">단일 공정 가치 산출 (정답 존재)</text>
    <text x="160" y="313" font-family="'Pretendard', sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">시장의 차익거래 기회가 차단된 균형 가격</text>
  </g>

  <!-- 하단 인사이트 브릿지 -->
  <rect x="120" y="395" width="560" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="18"/>
  <text x="400" y="417" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">"예측은 이미 현재 주가(S)에 반영되어 있으므로, 우리는 오직 상대적인 균형 가격만 평가합니다."</text>

  <!-- 마커 정의 (화살표 촉) -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>