<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .node { cursor: pointer; transition: all 0.2s; }
        .node:hover { filter: brightness(1.1); transform: scale(1.05); }
        .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    </style>
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold mb-2">단계별 선택의 트리 구조</h2>
        <p class="text-sm text-slate-500 mb-4">버튼을 클릭하여 각 단계에서 선택지가 어떻게 줄어드는지 확인하세요.</p>
        
        <div class="flex justify-between items-center mb-8 bg-indigo-50 p-4 rounded-lg">
            <div class="text-center">
                <div class="text-xs text-slate-400">1단계</div>
                <div class="text-xl font-bold text-indigo-600">4명</div>
            </div>
            <div class="text-slate-300">×</div>
            <div class="text-center">
                <div class="text-xs text-slate-400">2단계</div>
                <div class="text-xl font-bold text-indigo-600">3명</div>
            </div>
            <div class="text-slate-300">×</div>
            <div class="text-center">
                <div class="text-xs text-slate-400">3단계</div>
                <div class="text-xl font-bold text-indigo-600">2명</div>
            </div>
            <div class="text-slate-300">×</div>
            <div class="text-center">
                <div class="text-xs text-slate-400">4단계</div>
                <div class="text-xl font-bold text-indigo-600">1명</div>
            </div>
            <div class="text-slate-400 font-bold">=</div>
            <div class="text-2xl font-black text-rose-500">24</div>
        </div>

        <svg viewBox="0 0 600 250" class="w-full h-auto">
            <!-- Simplified Tree Visualization -->
            <g id="tree-art">
                <!-- Level 1 -->
                <circle cx="50" cy="125" r="20" fill="#6366f1" />
                <text x="50" y="130" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Start</text>
                
                <path d="M70 125 L150 50" class="line" />
                <path d="M70 125 L150 100" class="line" />
                <path d="M70 125 L150 150" class="line" />
                <path d="M70 125 L150 200" class="line" />
                
                <!-- Level 2 points -->
                <circle cx="150" cy="50" r="15" fill="#818cf8" />
                <circle cx="150" cy="100" r="15" fill="#818cf8" />
                <circle cx="150" cy="150" r="15" fill="#818cf8" />
                <circle cx="150" cy="200" r="15" fill="#818cf8" />
                
                <text x="175" y="55" class="text-xs text-slate-400" font-size="10">각 노드에서 3개씩 파생...</text>
                
                <!-- Level 3 indicators -->
                <path d="M165 50 L230 30" class="line" stroke-dasharray="4" />
                <path d="M165 50 L230 50" class="line" stroke-dasharray="4" />
                <path d="M165 50 L230 70" class="line" stroke-dasharray="4" />
                
                <text x="350" y="130" text-anchor="middle" class="fill-slate-400 italic text-sm">...이런 방식으로 총 24개의 경로가 생깁니다.</text>
            </g>
        </svg>
    </div>
</body>
</html>
