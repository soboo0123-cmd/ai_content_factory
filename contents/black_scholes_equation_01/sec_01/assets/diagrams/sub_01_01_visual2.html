<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { width: 100%; cursor: pointer; }
        .bar { transition: height 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-2">팩토리얼($n!$)의 폭발적 증가</h2>
        <p class="text-sm text-slate-600 mb-6">슬라이더를 움직여 $n$의 값에 따른 전체 경우의 수($n!$)를 확인해 보세요.</p>
        
        <div class="mb-8">
            <div class="flex justify-between mb-2 font-bold text-blue-600">
                <span>n = <span id="n-val">4</span></span>
                <span>n! = <span id="factorial-val">24</span></span>
            </div>
            <input type="range" id="n-slider" min="1" max="10" value="4" step="1" class="h-2 bg-slate-200 rounded-lg appearance-none">
        </div>

        <div class="flex items-end justify-between h-48 bg-slate-100 rounded-lg p-4 gap-1">
            <!-- Bars will be generated here -->
            <div id="chart-container" class="flex items-end justify-between w-full h-full"></div>
        </div>
        
        <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
            <p id="formula-display" class="text-center font-mono text-blue-800 font-bold"></p>
        </div>
    </div>

    <script>
        const slider = document.getElementById('n-slider');
        const nVal = document.getElementById('n-val');
        const fVal = document.getElementById('factorial-val');
        const formulaDisplay = document.getElementById('formula-display');
        const chartContainer = document.getElementById('chart-container');

        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        function update() {
            const n = parseInt(slider.value);
            const f = factorial(n);
            
            nVal.innerText = n;
            fVal.innerText = f.toLocaleString();
            
            // Formula display
            let formula = `${n}! = `;
            for(let i=n; i>=1; i--) {
                formula += i + (i > 1 ? ' × ' : '');
            }
            formulaDisplay.innerText = formula;

            // Chart update
            chartContainer.innerHTML = '';
            for(let i=1; i<=10; i++) {
                const val = factorial(i);
                const maxVal = factorial(10);
                const height = (Math.log10(val) / Math.log10(maxVal)) * 100; // Use log scale for better visualization
                
                const barWrapper = document.createElement('div');
                barWrapper.className = 'flex flex-col items-center flex-1';
                
                const bar = document.createElement('div');
                bar.className = `w-full rounded-t ${i === n ? 'bg-blue-500' : 'bg-slate-300'}`;
                bar.style.height = `${Math.max(height, 5)}%`;
                
                const label = document.createElement('span');
                label.className = 'text-[10px] mt-1 text-slate-500';
                label.innerText = i;
                
                barWrapper.appendChild(bar);
                barWrapper.appendChild(label);
                chartContainer.appendChild(barWrapper);
            }
        }

        slider.addEventListener('input', update);
        update();
    </script>
</body>
</html>
