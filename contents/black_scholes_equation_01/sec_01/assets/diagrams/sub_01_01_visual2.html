<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <h2 class="text-xl font-bold text-slate-800 mb-4">팩토리얼 ($n!$) 계산기</h2>
        
        <div class="mb-8">
            <label class="block text-sm font-medium text-slate-600 mb-2">나열할 대상의 수 ($n$): <span id="n-val" class="text-indigo-600 text-lg font-bold">5</span>명</label>
            <input type="range" id="n-slider" min="1" max="12" value="5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
        </div>

        <div class="space-y-4">
            <div class="p-4 bg-indigo-50 rounded-lg">
                <div class="text-xs text-indigo-400 uppercase font-bold mb-1">계산 과정</div>
                <div id="factorial-process" class="text-slate-700 font-mono break-all">5 × 4 × 3 × 2 × 1</div>
            </div>

            <div class="p-4 bg-slate-800 rounded-lg text-center">
                <div class="text-xs text-slate-400 uppercase font-bold mb-1">총 경우의 수</div>
                <div id="factorial-result" class="text-white text-3xl font-black">120</div>
            </div>
        </div>

        <p class="text-xs text-slate-400 mt-6 leading-relaxed italic">
            * 숫자가 1씩 커질 때마다 경우의 수가 얼마나 급격히 증가하는지 확인해 보세요. 12명만 되어도 무려 4억 가지가 넘습니다!
        </p>
    </div>

    <script>
        const slider = document.getElementById('n-slider');
        const nVal = document.getElementById('n-val');
        const process = document.getElementById('factorial-process');
        const result = document.getElementById('factorial-result');

        function update() {
            const n = parseInt(slider.value);
            nVal.innerText = n;
            
            let res = 1;
            let processStr = "";
            for (let i = n; i >= 1; i--) {
                res *= i;
                processStr += i + (i === 1 ? "" : " × ");
            }
            
            process.innerText = processStr;
            result.innerText = res.toLocaleString();
        }

        slider.addEventListener('input', update);
        update();
    </script>
</body>
</html>
