<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e293b; }
      .grid { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .axis-arrow { fill: #94a3b8; }
      .line-y-x { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6,6; }
      .curve-exp { stroke: #f43f5e; stroke-width: 3; fill: none; }
      .curve-log { stroke: #3b82f6; stroke-width: 3; fill: none; }
      .point { stroke: #1e293b; stroke-width: 2; }
      .point-exp { fill: #f43f5e; }
      .point-log { fill: #3b82f6; }
      .text-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .text-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; fill: #cbd5e1; }
      .text-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
      .math { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="axis-arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="12" class="bg"/>

  <!-- Grid Lines -->
  <line x1="100" y1="50" x2="100" y2="380" class="grid" />
  <line x1="200" y1="50" x2="200" y2="380" class="grid" />
  <line x1="300" y1="50" x2="300" y2="380" class="grid" />
  <line x1="400" y1="50" x2="400" y2="380" class="grid" />
  <line x1="500" y1="50" x2="500" y2="380" class="grid" />
  
  <line x1="50" y1="100" x2="550" y2="100" class="grid" />
  <line x1="50" y1="200" x2="550" y2="200" class="grid" />
  <line x1="50" y1="300" x2="550" y2="300" class="grid" />

  <!-- Coordinate Axes -->
  <line x1="50" y1="300" x2="560" y2="300" class="axis" marker-end="url(#arrow)"/>
  <line x1="200" y1="390" x2="200" y2="40" class="axis" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="570" y="305" class="text-label math">x</text>
  <text x="195" y="30" class="text-label math">y</text>
  <text x="185" y="315" class="text-label">0</text>

  <!-- Symmetry Line y = x -->
  <line x1="70" y1="430" x2="420" y2="80" class="line-y-x" />
  <text x="390" y="70" class="text-label math" fill="#64748b">y = x</text>

  <!-- Curves -->
  <!-- y = 2^x (Mapped: Origin at 200,300. Scale: 1 unit = 100px) -->
  <!-- X ranges from -1.5 (x=50) to 1.3 (x=330) -->
  <path d="M 50,365 C 100,350 150,330 200,200 C 220,148 250,80 270,50" class="curve-exp"/>
  
  <!-- y = log2(x) (Symmetric to y=2^x) -->
  <!-- Y ranges from -1.5 (y=450) to 1.3 (y=170) -->
  <path d="M 235,430 C 250,380 270,330 400,200 C 452,180 520,150 550,130" class="curve-log"/>

  <!-- Key Points & Guidelines -->
  <!-- (0,1) on Exp -->
  <line x1="100" y1="200" x2="200" y2="200" class="grid" />
  <circle cx="200" cy="200" r="5" class="point point-exp"/>
  <text x="140" y="190" class="text-label" fill="#f43f5e">(0, 1)</text>

  <!-- (1,0) on Log -->
  <line x1="300" y1="300" x2="300" y2="200" class="grid" />
  <circle cx="300" cy="300" r="5" class="point point-log"/>
  <text x="310" y="325" class="text-label" fill="#3b82f6">(1, 0)</text>

  <!-- (1,2) on Exp -->
  <circle cx="300" cy="100" r="5" class="point point-exp"/>
  <text x="310" y="95" class="text-label" fill="#f43f5e">(1, 2)</text>

  <!-- (2,1) on Log -->
  <circle cx="400" cy="200" r="5" class="point point-log"/>
  <text x="410" y="190" class="text-label" fill="#3b82f6">(2, 1)</text>

  <!-- Title & Legend -->
  <text x="30" y="45" class="text-title">지수함수와 로그함수의 역함수 대칭성 (밑 a = 2)</text>
  
  <rect x="30" y="400" width="12" height="12" fill="#f43f5e" rx="2"/>
  <text x="50" y="411" class="text-label math">y = 2^x (지수함수)</text>

  <rect x="180" y="400" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="200" y="411" class="text-label math">y = log_2(x) (로그함수)</text>
  
  <text x="400" y="411" class="text-sub">※ 두 함수는 y = x 선에 대해 선대칭을 이룹니다.</text>
</svg>