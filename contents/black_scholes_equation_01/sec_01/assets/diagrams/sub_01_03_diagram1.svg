<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; border: 1px solid #1e293b;">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- 단계 1: 전체 나열 (원석) -->
  <rect x="30" y="50" width="180" height="150" rx="15" fill="url(#grad1)" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="85" fill="#a5b4fc" font-size="15" font-family="'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle">1단계: 전체 나열</text>
  <text x="120" y="125" fill="#ffffff" font-size="28" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle">n!</text>
  <text x="120" y="165" fill="#94a3b8" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">제약 없는 일렬 배열 상태</text>
  <text x="120" y="185" fill="#818cf8" font-size="11" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">(예: 4! = 24가지)</text>

  <!-- 첫 번째 덜어냄 화살표 & 깔때기 -->
  <g transform="translate(220, 100)">
    <path d="M 10 25 L 80 25" stroke="url(#arrowGrad)" stroke-width="4" fill="none" stroke-dasharray="1 0"/>
    <polygon points="80,20 90,25 80,30" fill="#6366f1" />
    <!-- 나눗셈 필터 기호 -->
    <rect x="20" y="-20" width="50" height="30" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="45" y="0" fill="#a5b4fc" font-size="11" font-family="'Inter', sans-serif" font-weight="bold" text-anchor="middle">÷ (n - j)!</text>
    <text x="45" y="25" fill="#64748b" font-size="9" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">대기자 제외</text>
  </g>

  <!-- 단계 2: 순열 (1차 필터링 완료) -->
  <rect x="320" y="50" width="180" height="150" rx="15" fill="url(#grad2)" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="85" fill="#93c5fd" font-size="15" font-family="'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle">2단계: 일부 순열</text>
  <text x="410" y="125" fill="#ffffff" font-size="28" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle">_nP_j</text>
  <text x="410" y="165" fill="#94a3b8" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">탈락자 순서 무효화</text>
  <text x="410" y="185" fill="#60a5fa" font-size="11" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">(예: _4P_2 = 12가지)</text>

  <!-- 두 번째 덜어냄 화살표 & 깔때기 -->
  <g transform="translate(510, 100)">
    <path d="M 10 25 L 80 25" stroke="url(#arrowGrad)" stroke-width="4" fill="none" stroke-dasharray="1 0"/>
    <polygon points="80,20 90,25 80,30" fill="#10b981" />
    <!-- 나눗셈 필터 기호 -->
    <rect x="25" y="-20" width="40" height="30" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="0" fill="#6ee7b7" font-size="11" font-family="'Inter', sans-serif" font-weight="bold" text-anchor="middle">÷ j!</text>
    <text x="45" y="25" fill="#64748b" font-size="9" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">당선자 순서 무시</text>
  </g>

  <!-- 단계 3: 조합 (최종 완성) -->
  <rect x="610" y="50" width="210" height="150" rx="15" fill="url(#grad3)" stroke="#10b981" stroke-width="2"/>
  <text x="715" y="85" fill="#6ee7b7" font-size="15" font-family="'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle">3단계: 최종 조합</text>
  <text x="715" y="125" fill="#ffffff" font-size="28" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle">_nC_j</text>
  <text x="715" y="165" fill="#a7f3d0" font-size="12" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">당선자 정렬 노이즈 소거</text>
  <text x="715" y="185" fill="#34d399" font-size="11" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">(예: _4C_2 = 6가지)</text>

  <!-- 전체 흐름 요약 바텀 라벨 -->
  <text x="425" y="255" fill="#94a3b8" font-size="13" font-family="'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">
    "나눗셈은 자유도를 박탈하여 하나의 상태로 묶어주는 덜어냄의 마법입니다."
  </text>
</svg>