<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <!-- 배경 테두리 및 라운드 설정 -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />
  
  <!-- 타이틀 -->
  <text x="40" y="45" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">일반 수익률 vs 로그수익률 패러다임 비교</text>
  
  <!-- 왼쪽 영역: 일반 수익률 (Asymmetry) -->
  <g transform="translate(40, 75)">
    <!-- 카드 배경 -->
    <rect width="340" height="265" rx="12" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">일반 (산술) 수익률의 특징</text>
    
    <!-- 흐름도 1: 비대칭성 -->
    <g transform="translate(20, 60)">
      <!-- 10,000원 -> 5,000원 -->
      <rect x="0" y="0" width="85" height="40" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1" />
      <text x="42.5" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">10,000 원</text>
      
      <!-- 화살표 하락 -->
      <path d="M 95 20 L 140 20" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" fill="none" />
      <text x="117.5" y="14" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">-50%</text>
      
      <rect x="150" y="0" width="85" height="40" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1" />
      <text x="192.5" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">5,000 원</text>

      <!-- 화살표 회복 -->
      <path d="M 192.5 48 C 192.5 88, 42.5 88, 42.5 48" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" fill="none" />
      <text x="117.5" y="85" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">+100% 상승 필요</text>
    </g>

    <!-- 속성 설명 목록 -->
    <g transform="translate(20, 175)">
      <circle cx="5" cy="5" r="3" fill="#ef4444" />
      <text x="15" y="9" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">시간 가산성 결여 (복리 곱셈 연산 필요)</text>
      
      <circle cx="5" cy="27" r="3" fill="#ef4444" />
      <text x="15" y="31" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">상승/하락의 불일치로 리스크 왜곡 발생</text>

      <circle cx="5" cy="49" r="3" fill="#ef4444" />
      <text x="15" y="53" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">하방 제한(-100%)으로 비정규적 분포 보임</text>
    </g>
  </g>

  <!-- 오른쪽 영역: 로그 수익률 (Symmetry) -->
  <g transform="translate(420, 75)">
    <!-- 카드 배경 -->
    <rect width="340" height="265" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">로그 (연속) 수익률의 특징</text>
    
    <!-- 흐름도 2: 대칭성 -->
    <g transform="translate(20, 60)">
      <!-- 10,000원 -> 5,000원 -->
      <rect x="0" y="0" width="85" height="40" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1" />
      <text x="42.5" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">10,000 원</text>
      
      <!-- 화살표 하락 (ln 0.5) -->
      <path d="M 95 20 L 140 20" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" fill="none" />
      <text x="117.5" y="14" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">-69.3%</text>
      
      <rect x="150" y="0" width="85" height="40" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1" />
      <text x="192.5" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">5,000 원</text>

      <!-- 화살표 회복 (ln 2) -->
      <path d="M 192.5 48 C 192.5 88, 42.5 88, 42.5 48" stroke="#10b981" stroke-width="2" fill="none" />
      <text x="117.5" y="85" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">+69.3% (완벽한 대칭)</text>
    </g>

    <!-- 속성 설명 목록 -->
    <g transform="translate(20, 175)">
      <circle cx="5" cy="5" r="3" fill="#10b981" />
      <text x="15" y="9" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">시간의 가산성 확보 (다기간 수익률은 단순 덧셈)</text>
      
      <circle cx="5" cy="27" r="3" fill="#10b981" />
      <text x="15" y="31" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">상승/하락 변동이 대칭되어 통계적 균형 달성</text>

      <circle cx="5" cy="49" r="3" fill="#10b981" />
      <text x="15" y="53" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">정규분포 모델링에 최적화 (-∞ ~ +∞ 범위)</text>
    </g>
  </g>

  <!-- 마커 정의 -->
  <defs>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="2" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#f87171" />
    </marker>
    <marker id="arrow-slate" markerWidth="6" markerHeight="6" refX="2" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#64748b" />
    </marker>
  </defs>
</svg>