<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gradient: The Mathematical Compass (Enhanced)</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --accent-color: #00d2ff;
            --gradient-color: #f1c40f;
            --panel-bg: #151515;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            flex: 0 0 auto;
            max-height: 25%;
            padding: 15px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-bottom: 1px solid #333;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        main {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
            cursor: move;
        }

        canvas { display: block; width: 100%; height: 100%; }

        footer {
            flex: 0 0 auto;
            background: var(--panel-bg);
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 10;
        }

        .layer-1 {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .layer-2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        button {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:active { transform: scale(0.95); }
        button.active { background: var(--accent-color); color: black; }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.03);
            padding: 5px 12px;
            border-radius: 15px;
        }

        input[type=range] { width: 80px; accent-color: var(--accent-color); }

        .narrative-title { color: var(--accent-color); font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .narrative-body { font-size: 0.9rem; line-height: 1.6; opacity: 0.9; }

        .rotation-hint {
            position: absolute;
            bottom: 10px; right: 10px;
            font-size: 0.7rem; color: #666;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            input[type=range] { width: 120px; }
            .slider-group span { display: none; }
        }
    </style>
</head>
<body>

<header id="narrative-box">
    <div id="step-content"></div>
</header>

<main id="canvas-container">
    <canvas id="math-canvas"></canvas>
    <div class="rotation-hint">드래그하여 회전</div>
</main>

<footer>
    <div class="layer-1">
        <button onclick="changeStep(-1)">이전</button>
        <button id="play-btn" class="active" onclick="togglePlay()">Pause</button>
        <button onclick="changeStep(1)">다음</button>
    </div>
    <div class="layer-2" id="controls"></div>
</footer>

<script>
    const state = {
        step: 0,
        isPlaying: true,
        time: 0,
        camera: { alpha: 0.5, beta: 0.6 },
        params: { x: 0.5, y: 0.5, u: 0, lr: 0.05 },
        steps: [
            { title: "1. 경사의 기초", text: "지형의 높이 $f(x,y) = \\sin(x)\\cos(y)$를 살펴봅시다. 점에서의 기울기는 그 지점의 '가파름'을 나타냅니다.", controls: ['x', 'y'] },
            { title: "2. 축별 편미분", text: "$x$축과 $y$축 방향으로만 보았을 때의 기울기를 각각 $\\frac{\\partial f}{\\partial x}, \\frac{\\partial f}{\\partial y}$라고 합니다.", controls: ['x', 'y'] },
            { title: "3. 그라디언트 벡터 (∇f)", text: "두 편미분 값을 성분으로 하는 벡터 $\\nabla f$는 항상 <b>가장 가파른 오르막</b> 방향을 가리킵니다.", controls: ['x', 'y'] },
            { title: "4. 방향 미분과 최대 경사", text: "임의의 방향($u$)으로의 기울기는 $\\nabla f$와의 내적입니다. $u$를 조절해 보세요. 노란 화살표($\\nabla f$)와 겹칠 때 가장 가파릅니다.", controls: ['x', 'y', 'u'] },
            { title: "5. 경사하강법 (Gradient Descent)", text: "AI는 $\\nabla f$의 반대 방향으로 이동하여 함수의 최솟값을 찾아냅니다. 공을 놓아보세요.", controls: ['lr', 'reset'] }
        ]
    };

    const canvas = document.getElementById('math-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    let dpr = window.devicePixelRatio || 1;

    // Interaction
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    container.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        state.camera.alpha += (e.clientX - lastMouse.x) * 0.01;
        state.camera.beta = Math.max(0.1, Math.min(Math.PI/2 - 0.1, state.camera.beta + (e.clientY - lastMouse.y) * 0.01));
        lastMouse = { x: e.clientX, y: e.clientY };
    });
    // Touch support
    container.addEventListener('touchstart', e => { isDragging = true; lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
    window.addEventListener('touchend', () => isDragging = false);
    window.addEventListener('touchmove', e => {
        if (!isDragging) return;
        state.camera.alpha += (e.touches[0].clientX - lastMouse.x) * 0.01;
        state.camera.beta = Math.max(0.1, Math.min(Math.PI/2 - 0.1, state.camera.beta + (e.touches[0].clientY - lastMouse.y) * 0.01));
        lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    function resize() {
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    function changeStep(dir) {
        state.step = Math.max(0, Math.min(state.steps.length - 1, state.step + dir));
        updateUI();
    }

    function togglePlay() {
        state.isPlaying = !state.isPlaying;
        document.getElementById('play-btn').innerText = state.isPlaying ? "Pause" : "Play";
        document.getElementById('play-btn').classList.toggle('active', state.isPlaying);
    }

    function updateUI() {
        const step = state.steps[state.step];
        document.getElementById('step-content').innerHTML = `
            <div class="narrative-title">${step.title}</div>
            <div class="narrative-body">${step.text}</div>
        `;
        if(window.MathJax) MathJax.typesetPromise();

        const controls = document.getElementById('controls');
        controls.innerHTML = '';
        step.controls.forEach(c => {
            if(c === 'reset') { controls.innerHTML += `<button onclick="resetBall()">공 재설정</button>`; return; }
            const group = document.createElement('div');
            group.className = 'slider-group';
            const labels = { x: 'X 위치', y: 'Y 위치', u: '방향(u)', lr: '학습률' };
            group.innerHTML = `<span>${labels[c] || c}</span>
                <input type="range" min="-2.5" max="2.5" step="0.01" value="${state.params[c]}" 
                oninput="state.params.${c}=parseFloat(this.value); if('${c}'!=='lr') state.isPlaying=false;">`;
            if(c === 'u') { group.querySelector('input').min = 0; group.querySelector('input').max = 6.28; }
            if(c === 'lr') { group.querySelector('input').min = 0.01; group.querySelector('input').max = 0.2; }
            controls.appendChild(group);
        });
    }

    const f = (x, y) => Math.sin(x) * Math.cos(y);
    const dfdx = (x, y) => Math.cos(x) * Math.cos(y);
    const dfdy = (x, y) => -Math.sin(x) * Math.sin(y);

    function project(x, y, z) {
        const cw = canvas.width / dpr, ch = canvas.height / dpr;
        const scale = Math.min(cw, ch) * 0.18;
        
        // 3D Rotation
        let x1 = x * Math.cos(state.camera.alpha) - y * Math.sin(state.camera.alpha);
        let y1 = x * Math.sin(state.camera.alpha) + y * Math.cos(state.camera.alpha);
        let z1 = z;

        let x2 = x1;
        let y2 = y1 * Math.cos(state.camera.beta) - z1 * Math.sin(state.camera.beta);
        let z2 = y1 * Math.sin(state.camera.beta) + z1 * Math.cos(state.camera.beta);

        return { x: cw/2 + x2 * scale, y: ch/2 - y2 * scale };
    }

    function getZColor(z) {
        const hue = 200 + z * 40; // Height-based hue
        return `hsla(${hue}, 70%, 50%, ${0.3 + (z+1)*0.2})`;
    }

    let ballPos = {x: 1.5, y: 1.5};
    function resetBall() { ballPos = {x: (Math.random()-0.5)*4, y: (Math.random()-0.5)*4}; }

    function draw() {
        ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
        
        if(state.isPlaying) {
            state.time += 0.015;
            if(state.step < 4) {
                state.params.x = Math.sin(state.time * 0.5) * 1.8;
                state.params.y = Math.cos(state.time * 0.7) * 1.8;
            } else {
                const gx = dfdx(ballPos.x, ballPos.y);
                const gy = dfdy(ballPos.x, ballPos.y);
                ballPos.x -= state.params.lr * gx;
                ballPos.y -= state.params.lr * gy;
            }
        }

        const {x, y} = (state.step === 4) ? ballPos : state.params;
        const z = f(x, y);

        // 1. Terrain Grid with Heatmap
        for(let i=-2.5; i<=2.5; i+=0.25) {
            ctx.beginPath();
            for(let j=-2.5; j<=2.55; j+=0.1) {
                const p = project(i, j, f(i,j));
                ctx.strokeStyle = getZColor(f(i,j));
                j === -2.5 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.beginPath();
            for(let j=-2.5; j<=2.55; j+=0.1) {
                const p = project(j, i, f(j,i));
                ctx.strokeStyle = getZColor(f(j,i));
                j === -2.5 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }

        // 2. Base Plane
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath();
        const corners = [[-2.5,-2.5], [2.5,-2.5], [2.5,2.5], [-2.5,2.5]];
        corners.forEach((c, idx) => {
            const p = project(c[0], c[1], -1.2);
            idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
        });
        ctx.closePath(); ctx.stroke();
        ctx.setLineDash([]);

        // 3. Point and Vectors
        const p0 = project(x, y, z);
        const pBase = project(x, y, -1.2);

        // Projection line
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(pBase.x, pBase.y); ctx.stroke();

        // The Ball
        ctx.fillStyle = (state.step === 4) ? "#ff4757" : "white";
        ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath(); ctx.arc(p0.x, p0.y, 6, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Gradient Vector
        if(state.step >= 2) {
            const gx = dfdx(x, y), gy = dfdy(x, y);
            const pGradEnd = project(x + gx*0.5, y + gy*0.5, z); // On the surface
            drawArrow(p0, pGradEnd, varColor('--gradient-color'), "∇f");
            
            // Base shadow of gradient
            const pGradBase = project(x + gx*0.5, y + gy*0.5, -1.2);
            drawArrow(pBase, pGradBase, "rgba(241, 196, 15, 0.3)", "");
        }

        // Directional Derivative (Step 4)
        if(state.step === 3) {
            const ux = Math.cos(state.params.u), uy = Math.sin(state.params.u);
            const gx = dfdx(x, y), gy = dfdy(x, y);
            const dot = gx * ux + gy * uy;
            const pDirEnd = project(x + ux*0.5, y + uy*0.5, z);
            drawArrow(p0, pDirEnd, "#00d2ff", `dir (slope: ${dot.toFixed(2)})`);
        }

        requestAnimationFrame(draw);
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function drawArrow(from, to, color, label) {
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
        const angle = Math.atan2(to.y - from.y, to.x - from.x);
        ctx.beginPath(); ctx.moveTo(to.x, to.y);
        ctx.lineTo(to.x - 12 * Math.cos(angle - 0.4), to.y - 12 * Math.sin(angle - 0.4));
        ctx.lineTo(to.x - 12 * Math.cos(angle + 0.4), to.y - 12 * Math.sin(angle + 0.4));
        ctx.fill();
        if(label) {
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "white";
            ctx.fillText(label, to.x + 8, to.y);
        }
    }

    updateUI();
    draw();
</script>
</body>
</html>
