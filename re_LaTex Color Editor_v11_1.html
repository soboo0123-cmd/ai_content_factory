<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX 컬러 에디터 v10</title>
    
    <!-- KaTeX core CSS & JS -->
    <link class="jsbin" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- [추가] KaTeX Auto-Render Extension 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <style>
        /* --- 기본값: 다크모드 --- */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; position: relative; }
        
        textarea { 
            width: 100%; height: 100px; font-size: 16px; padding: 10px; 
            background-color: #1e1e1e; color: #e0e0e0;
            border: 1px solid #333; border-radius: 4px; box-sizing: border-box; resize: vertical; 
        }
        #preview { 
            padding: 25px; border: 1px solid #333; border-radius: 4px; font-size: 20px; 
            background-color: #1e1e1e; min-height: 60px;
            overflow-x: auto; white-space: pre-wrap; word-break: break-all;
        }

        /* --- 터치 영역 개선 및 겹침 방지 --- */
        .katex * { pointer-events: none; }
        .math-term { 
            position: relative; z-index: 10; pointer-events: auto !important; 
            border-radius: 3px; padding: 0 1px; display: inline-block; cursor: pointer;
            transition: background-color 0.15s, outline 0.15s; 
        }
        .math-term::after {
            content: ''; position: absolute;
            top: -6px; bottom: -6px; left: -3px; right: -3px; z-index: 1;
        }
        .math-term.hovered { background-color: #2b2b2b; }
        .math-term.selected, .math-term.selected * { 
            background-color: #bbdefb !important; color: #121212 !important; outline: 2px solid #2196f3; 
        }

        /* --- UI 레이아웃 --- */
        .title-bar { display: flex; justify-content: space-between; align-items: center; }
        .title-bar h2 { margin: 0; font-size: 20px; }
        .action-btn { padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; background-color: #333; color: #e0e0e0; border: 1px solid #555; transition: background 0.2s; }
        .action-btn:hover { background-color: #444; }
        .theme-btn { position: absolute; top: -10px; right: 0; padding: 8px 16px; font-weight: bold; border-radius: 20px; cursor: pointer; background-color: #333; color: #e0e0e0; border: 1px solid #555; }

        .mode-toggle-area { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .mode-btn { padding: 6px 16px; font-size: 13px; border-radius: 20px; border: 1px solid #555; background-color: #333; color: #e0e0e0; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active { background-color: #2196f3; color: #fff; border-color: #2196f3; font-weight: bold; }
        .mode-btn.action-range { background-color: #ff9800; border-color: #f57c00; font-weight: bold; color: #fff; }

        .palette-area { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .palette { display: flex; gap: 10px; align-items: center; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.3); transition: transform 0.2s;}
        .color-btn:hover { transform: scale(1.1); }
        .clear-btn { padding: 8px 16px; border: 1px solid #555; background: #333; color:#e0e0e0; border-radius: 4px; cursor: pointer; font-size: 14px; }

        .output-container { display: flex; gap: 10px; align-items: stretch; }
        .output-container textarea { height: auto; flex-grow: 1; background-color: #2a2a2a; color:#fff; }
        .copy-btn { width: 100px; background-color: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.2s; }
        .copy-btn:hover { background-color: #45a049; }

        body.light-mode { background-color: #f9f9f9; color: #333; }
        body.light-mode textarea { background-color: #fff; color: #333; border: 1px solid #ccc; }
        body.light-mode #preview { background-color: #fff; border: 1px solid #ddd; }
        body.light-mode .action-btn, body.light-mode .clear-btn, body.light-mode .theme-btn { background-color: #fff; color: #333; border: 1px solid #ccc; }
        body.light-mode .math-term.hovered { background-color: #e3f2fd; }
        body.light-mode .output-container textarea { background-color: #f1f1f1; color: #333; }
        body.light-mode .mode-btn { background-color: #eee; color: #333; border: 1px solid #ccc; }
        body.light-mode .mode-btn.active { background-color: #2196f3; color: #fff; border-color: #2196f3; }
        body.light-mode .mode-btn.action-range { background-color: #ff9800; color: #fff; border: none; }
    </style>
</head>
<body>

<div class="container">
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">☀️ 라이트모드로 보기</button>

    <div class="title-bar" style="margin-top: 30px;">
        <h2>1. LaTeX 입력</h2>
        <button class="action-btn" onclick="resetInput()">입력 초기화</button>
    </div>
    <textarea id="latexInput">$$C = \frac{1}{(1+r)^n} \sum_{j=a}^{n} \left[ \binom{n}{j} p^j (1-p)^{n-j} \left(S_0 u^j d^{n-j} - K\right) \right]$$</textarea>

    <div class="title-bar">
        <h2>2. 항 선택</h2>
        <div class="mode-toggle-area">
            <button id="modeSingleBtn" class="mode-btn" onclick="setMode('single')">개별</button>
            <button class="mode-btn action-range" onclick="applyRangeSelection()">범위</button>
            <button id="modeSearchBtn" class="mode-btn active" onclick="setMode('search')">찾기</button>
        </div>
    </div>
    
    <div id="preview"></div>

    <div class="title-bar">
        <h2>3. 색상 지정</h2>
        <button class="action-btn" onclick="resetColors()">전체 색상 초기화</button>
    </div>
    <div class="palette-area">
        <div class="palette">
            <div class="color-btn" style="background-color: #e53935;" onclick="applyColor('#e53935')"></div>
            <div class="color-btn" style="background-color: #1e88e5;" onclick="applyColor('#1e88e5')"></div>
            <div class="color-btn" style="background-color: #43a047;" onclick="applyColor('#43a047')"></div>
            <div class="color-btn" style="background-color: #fdd835;" onclick="applyColor('#fdd835')"></div>
            <button class="clear-btn" onclick="applyColor(null)">선택한 기호 색상만 지우기</button>
        </div>
    </div>

    <h2>최종 출력 코드</h2>
    <div class="output-container">
        <textarea id="latexOutput" readonly></textarea>
        <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()">코드 복사</button>
    </div>
</div>

<script>
    let tokenColors = {};       
    let selectedIds = new Set(); 
    let tokenRegistry = [];      
    let currentMode = 'search';

    const encodeClass = (str) => "term-" + btoa(unescape(encodeURIComponent(str))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

    // 안전 토크나이저
    function tokenizeMath(mathContent) {
        let tokens = [];
        let i = 0;
        const len = mathContent.length;

        const safeCommands = new Set([
            '\\alpha', '\\beta', '\\gamma', '\\delta', '\\epsilon', '\\varepsilon', '\\zeta', '\\eta', '\\theta', '\\vartheta', '\\iota', '\\kappa', '\\lambda', '\\mu', '\\nu', '\\xi', '\\pi', '\\varpi', '\\rho', '\\varrho', '\\sigma', '\\varsigma', '\\tau', '\\upsilon', '\\phi', '\\varphi', '\\chi', '\\psi', '\\omega',
            '\\Gamma', '\\Delta', '\\Theta', '\\Lambda', '\\Xi', '\\Pi', '\\Sigma', '\\Upsilon', '\\Phi', '\\Psi', '\\Omega',
            '\\infty', '\\partial', '\\nabla', '\\hbar', '\\ell', '\\Re', '\\Im', '\\wp', '\\emptyset', '\\varnothing',
            '\\cdot', '\\times', '\\div', '\\pm', '\\mp', '\\ast', '\\star', '\\circ', '\\bullet',
            '\\leq', '\\geq', '\\approx', '\\neq', '\\equiv', '\\propto', '\\sim', '\\simeq', '\\cong',
            '\\forall', '\\exists', '\\in', '\\notin', '\\subset', '\\supset', '\\cup', '\\cap',
            '\\rightarrow', '\\leftarrow', '\\Rightarrow', '\\Leftarrow', '\\leftrightarrow', '\\Leftrightarrow'
        ]);

        while (i < len) {
            let char = mathContent[i];

            // 1. 공백 보존
            if (/\s/.test(char)) {
                let ws = '';
                while (i < len && /\s/.test(mathContent[i])) { ws += mathContent[i]; i++; }
                tokens.push({ type: 'structural', text: ws });
                continue;
            }

            // 2. \left, \right 명령어 보존
            if (char === '\\' && mathContent.slice(i).match(/^\\(left|right)\b/)) {
                let match = mathContent.slice(i).match(/^\\(left|right)\s*(\\[a-zA-Z]+|\\[^a-zA-Z]|[^ \t\r\n])/);
                if (match) {
                    tokens.push({ type: 'structural', text: match[0] });
                    i += match[0].length;
                    continue;
                }
            }

            // 3. 백슬래시(\)로 시작하는 명령어
            if (char === '\\') {
                let cmdMatch = mathContent.slice(i).match(/^\\([a-zA-Z]+|[^a-zA-Z])/);
                if (cmdMatch) {
                    let cmd = cmdMatch[0];
                    if (safeCommands.has(cmd)) {
                        tokens.push({ type: 'colorable', text: cmd });
                    } else {
                        tokens.push({ type: 'structural', text: cmd });
                    }
                    i += cmd.length;
                    continue;
                }
            }

            // 4. 구조를 결정짓는 핵심 기호 잠금
            if (/[{}[\]_^&~#'"]/.test(char)) {
                tokens.push({ type: 'structural', text: char });
                i++;
                continue;
            }

            // 5. 일반 문자 및 숫자
            if (/[a-zA-Z0-9+\-=().,:;!?|<>]/.test(char)) {
                tokens.push({ type: 'colorable', text: char });
                i++;
                continue;
            }

            tokens.push({ type: 'structural', text: char });
            i++;
        }
        return tokens;
    }

    function processMixedText(text, isForOutput = false) {
        text = text.replace(/₩/g, '\\'); 
        let tokenIndex = 0;
        if (!isForOutput) tokenRegistry = []; 

        const mathBlockRegex = /(\$\$[\s\S]+?\$\$)|(\$[\s\S]+?\$)/g;

        return text.replace(mathBlockRegex, (block) => {
            const isDisplay = block.startsWith('$$');
            const delimiter = isDisplay ? '$$' : '$';
            const mathContent = isDisplay ? block.slice(2, -2) : block.slice(1, -1);

            const tokens = tokenizeMath(mathContent);

            const processedMath = tokens.map(token => {
                if (token.type !== 'colorable') return token.text;

                const match = token.text;
                const currentIdx = tokenIndex++;
                if (!isForOutput) tokenRegistry[currentIdx] = match; 

                const color = tokenColors[currentIdx];

                if (isForOutput) {
                    if (color) {
                        return `{\\textcolor{${color}}{${match}}}`;
                    } else {
                        return match; 
                    }
                } else {
                    const coloredToken = color ? `\\textcolor{${color}}{${match}}` : match;
                    const valClass = encodeClass(match);
                    const idClass = `idx-${currentIdx}`;
                    return `{\\htmlClass{math-term ${valClass} ${idClass}}{${coloredToken}}}`;
                }
            }).join('');

            return `${delimiter}${processedMath}${delimiter}`;
        });
    }

function parseAndRender() {
    const rawInput = document.getElementById('latexInput').value;
    const previewSource = processMixedText(rawInput, false);
    const finalSource = processMixedText(rawInput, true);
    const previewEl = document.getElementById('preview');
    
    // 줄바꿈 보존 처리
    previewEl.innerHTML = previewSource.replace(/\n/g, '<br>'); 

    try {
        // 공식 auto-render를 호출하여 $$ 디스플레이 수식의 스타일(시그마 첨자 위아래 정렬)을 완벽하게 적용합니다.
        renderMathInElement(previewEl, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            trust: true,
            throwOnError: false
        });
        document.getElementById('latexOutput').value = finalSource;
    } catch (err) {
        const escapedSource = previewSource.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        previewEl.innerHTML = `
            <span style="color:#ff5252; font-size:16px;"><b>KaTeX 문법 에러:</b> ${err.message}</span>
            <br><br>
            <div style="font-size:14px; color:#aaa; line-height:1.4;">
                <b>[디버깅용 파싱 코드]</b><br>${escapedSource}
            </div>`;
    }

    attachEvents();
    updateSelectionStyles();
}

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeSearchBtn').classList.toggle('active', mode === 'search');
        document.getElementById('modeSingleBtn').classList.toggle('active', mode === 'single');
        selectedIds.clear();
        updateSelectionStyles();
    }

    function applyRangeSelection() {
        if (selectedIds.size < 2) return;
        
        const idsArray = Array.from(selectedIds).sort((a, b) => a - b);
        const minId = idsArray[0];
        const maxId = idsArray[idsArray.length - 1];

        for (let i = minId; i <= maxId; i++) {
            if (tokenRegistry[i] !== undefined) {
                selectedIds.add(i);
            }
        }
        updateSelectionStyles();
    }

    function attachEvents() {
        const terms = document.querySelectorAll('.math-term');
        terms.forEach(term => {
            const classes = Array.from(term.classList);
            const valClass = classes.find(c => c.startsWith('term-'));
            const idClass = classes.find(c => c.startsWith('idx-'));
            if (!valClass || !idClass) return;

            const currentId = parseInt(idClass.replace('idx-', ''));

            term.onmouseenter = () => {
                if (currentMode === 'search') document.querySelectorAll(`.${valClass}`).forEach(el => el.classList.add('hovered'));
                else term.classList.add('hovered');
            };
            term.onmouseleave = () => {
                if (currentMode === 'search') document.querySelectorAll(`.${valClass}`).forEach(el => el.classList.remove('hovered'));
                else term.classList.remove('hovered');
            };

            term.onclick = (e) => {
                e.stopPropagation();
                const isAlreadySelected = selectedIds.has(currentId);

                if (currentMode === 'search') {
                    if (isAlreadySelected) {
                        selectedIds.delete(currentId);
                    } else {
                        const currentlySelectedValues = Array.from(selectedIds).map(id => tokenRegistry[id]);
                        const firstSelectedVal = currentlySelectedValues[0];
                        const clickedVal = tokenRegistry[currentId];

                        if (firstSelectedVal && firstSelectedVal !== clickedVal) selectedIds.clear();

                        tokenRegistry.forEach((val, idx) => {
                            if (val === clickedVal) selectedIds.add(idx);
                        });
                    }
                } else if (currentMode === 'single') {
                    if (isAlreadySelected) selectedIds.delete(currentId);
                    else selectedIds.add(currentId);
                }
                updateSelectionStyles();
            };
        });

        document.getElementById('preview').onclick = () => {
            selectedIds.clear();
            updateSelectionStyles();
        };
    }

    function updateSelectionStyles() {
        document.querySelectorAll('.math-term').forEach(el => {
            const idClass = Array.from(el.classList).find(c => c.startsWith('idx-'));
            if (idClass) {
                const id = parseInt(idClass.replace('idx-', ''));
                if (selectedIds.has(id)) el.classList.add('selected');
                else el.classList.remove('selected');
            }
        });
    }

    function applyColor(color) {
        if (selectedIds.size === 0) return;
        selectedIds.forEach(id => {
            if (color === null) delete tokenColors[id];
            else tokenColors[id] = color;
        });
        selectedIds.clear(); 
        parseAndRender();
    }

    function resetInput() {
        document.getElementById('latexInput').value = '';
        tokenColors = {}; selectedIds.clear();
        parseAndRender(); document.getElementById('latexInput').focus();
    }

    function resetColors() {
        tokenColors = {}; selectedIds.clear(); parseAndRender();
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        body.classList.toggle('light-mode');
        btn.innerText = body.classList.contains('light-mode') ? '🌙 다크모드로 보기' : '☀️ 라이트모드로 보기';
    }

    function copyToClipboard() {
        const outputEl = document.getElementById('latexOutput');
        const copyBtn = document.getElementById('copyBtn');
        
        navigator.clipboard.writeText(outputEl.value).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "Copied!";
            copyBtn.style.backgroundColor = "#2e7d32";
            
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = ""; 
            }, 1200);
        }).catch(err => console.error("복사 실패: " + err));
    }

    document.getElementById('latexInput').addEventListener('input', () => {
        tokenColors = {}; selectedIds.clear(); parseAndRender();
    });

    parseAndRender();
</script>

</body>
</html>
